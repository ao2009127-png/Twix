<title>TWIX Gaming Lounge</title>

(function() {
var l = window.location;
var isGh = l.hostname.endsWith('github.io');
var segs = l.pathname.split('/').filter(Boolean);
var base = isGh && segs.length > 0 ? '/' + segs[0] + '/' : '/';
l.replace(l.origin + base + (l.search || '') + (l.hash || ''));
})();
</script>
