    function playNotificationSound(type = 'click') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.04);
          osc.start(); osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'cash') {
          osc.frequency.setValueAtTime(987, ctx.currentTime);
          osc.frequency.setValueAtTime(1318, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'alert') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.setValueAtTime(330, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(); osc.stop(ctx.currentTime + 0.3);
        }
      } catch(e) {}
    }

    function compressImageFile(file, maxDimension = 700) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h && w > maxDimension) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
            else if (h > maxDimension) { w = Math.round((w * maxDimension) / h); h = maxDimension; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function calcDevicePrice(type, mode, minutes) {
      if (!minutes || minutes <= 0) return 0;
      const dev = PRICING[type] || PRICING.PS4;
      const rate = mode === 'multi' ? dev.multi : dev.single;
      const blocks = Math.ceil(minutes / 30);
      return Math.max(1, blocks) * rate.per30;
    }

    function calculateInfiniteLevel(xp = 0, totalHoursPlayed = 0) {
      const level = Math.floor(Math.sqrt(Math.max(0, xp) / 25)) + 1;
      let title = "مبتدئ (Rookie Gamer)", badge = "🥉", color = "text-neutral-400";
      if (level >= 100) { title = "أسطورة TWIX المطلقة"; badge = "👑"; color = "text-amber-400"; }
      else if (level >= 50) { title = "بطل ما وراء الطبيعة"; badge = "💎"; color = "text-cyan-400"; }
      else if (level >= 25) { title = "محترف الصالة"; badge = "🥇"; color = "text-amber-300"; }
      else if (level >= 10) { title = "مقاتل فضي"; badge = "🥈"; color = "text-slate-300"; }
      return { level, title, badge, color, nextLvlXP: Math.pow(level, 2) * 25, eligibleFor24hReward: totalHoursPlayed >= 24 };
    }

      }

      const customerWallet = (currentCustomer && currentCustomer.walletBalance) || 0;
      const [paymentMethod, setPaymentMethod] = useState(() => {
        if (customerWallet >= pendingBooking.totalCost && pendingBooking.totalCost > 0) return 'wallet_full';
        if (customerWallet > 0 && customerWallet < pendingBooking.totalCost) return 'hybrid';
        return 'cash_full';
      });
      const [selectedWalletType, setSelectedWalletType] = useState('vodafone');
      const [senderPhone, setSenderPhone] = useState(pendingBooking.phone || (currentCustomer?.phone || ''));
      const [senderWalletName, setSenderWalletName] = useState(pendingBooking.customerName || '');
      const [receiptScreenshot, setReceiptScreenshot] = useState(null);
      const [copiedNumber, setCopiedNumber] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [paymentDoneSuccess, setPaymentDoneSuccess] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      let walletDeduction = 0, remainingCashToTransfer = pendingBooking.totalCost;
      if (paymentMethod === 'wallet_full') { walletDeduction = pendingBooking.totalCost; remainingCashToTransfer = 0; }
      else if (paymentMethod === 'hybrid') {
        walletDeduction = Math.min(customerWallet, pendingBooking.totalCost);
        remainingCashToTransfer = Math.max(0, pendingBooking.totalCost - walletDeduction);
      }

      const handleExecutePayment = () => {
        setErrorMsg('');
        if (remainingCashToTransfer > 0) {
          if (!validateEgyptianPhone(senderPhone)) return setErrorMsg('يجب كتابة رقم المحفظة المحول منها (11 رقماً).');
          if (!receiptScreenshot) return setErrorMsg('إلزامي: يرجى إرفاق سكرين شوت إيصال التحويل لتأكيد الحجز.');
        }
        setIsSubmitting(true);
        const newBal = Math.max(0, customerWallet - walletDeduction);
        const totalMins = (pendingBooking.bookedDevices || []).reduce((s, d) => s + Number(d.duration || 0), 0) || Number(pendingBooking.duration || 30);
        const addedHours = Number((totalMins / 60).toFixed(2));
        const addedXP = Math.round(totalMins * 1.5);
        const isInstantConfirm = remainingCashToTransfer === 0;

        const finalBookingData = {
          ...pendingBooking, paymentMethod, walletDeduction, remainingCashToTransfer,
          senderPhone: remainingCashToTransfer > 0 ? senderPhone.trim() : (currentCustomer?.phone || 'محفظة داخلية'),
          senderWalletName: remainingCashToTransfer > 0 ? senderWalletName.trim() : (currentCustomer?.name || 'محفظة داخلية'),
          selectedWalletType: remainingCashToTransfer > 0 ? selectedWalletType : 'internal_wallet',
          receiptScreenshot: receiptScreenshot || null,
          status: isInstantConfirm ? 'confirmed' : 'awaiting_admin_approval',
          rewardedStats: isInstantConfirm,
          createdAt: new Date().toISOString()
        };

        db.collection('bookings').doc(finalBookingData.id).set(finalBookingData).then(() => {
          if (currentCustomer && (walletDeduction > 0 || isInstantConfirm)) {
            const updates = { walletBalance: newBal };
            if (isInstantConfirm) {
              updates.hoursPlayed = firebase.firestore.FieldValue.increment(addedHours);
              updates.xp = firebase.firestore.FieldValue.increment(addedXP);
            }
            db.collection('customers').doc(currentCustomer.phone).set(updates, { merge: true });
            setCurrentCustomer(prev => prev ? { ...prev, walletBalance: newBal, hoursPlayed: (prev.hoursPlayed || 0) + (isInstantConfirm ? addedHours : 0), xp: (prev.xp || 0) + (isInstantConfirm ? addedXP : 0) } : prev);
          }
          if (pendingBooking.promoDiscount > 0) localStorage.setItem(`twix_promo_used_${getDeviceFingerprint()}`, 'true');
          setMyBookings(prev => [finalBookingData, ...prev]);
          playNotificationSound('cash'); setPaymentDoneSuccess(true); setIsSubmitting(false);
        }).catch(() => {
          setMyBookings(prev => [finalBookingData, ...prev]);
          playNotificationSound('cash'); setPaymentDoneSuccess(true); setIsSubmitting(false);
        });
      };

      const whatsappMsg = encodeURIComponent(
        `السلام عليكم، حجز جديد في ${config.loungeName} 🎮\n• كود الحجز: ${pendingBooking.ref}\n• العميل: ${pendingBooking.customerName} (${pendingBooking.phone})\n• الميعاد: ${pendingBooking.date} الساعة ${pendingBooking.time}\n• الأجهزة: ${pendingBooking.devicesSummary}\n• الكافتيريا: ${pendingBooking.snacksSummary}\n• الإجمالي: ${pendingBooking.totalCost} ج.م`
      );

      return (
        <div className="max-w-md mx-auto py-6 space-y-5 text-xs">
          {!paymentDoneSuccess ? (
            <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl space-y-4 shadow-2xl">
              <div className="text-center space-y-1 border-b border-neutral-800 pb-3">
                <span className="text-[10px] bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full font-black">بوابة الدفع الإلكتروني المعتمدة</span>
                <h2 className="text-xl font-black text-white mt-1">تأكيد الحجز والدفع</h2>
                <span className="text-neutral-400 font-mono text-[11px] block">كود الحجز: {pendingBooking.ref}</span>
              </div>

              <div className="space-y-2">
                <label className="text-neutral-300 font-bold block">اختر طريقة الدفع:</label>
                <button type="button" onClick={() => setPaymentMethod('cash_full')} className={`w-full p-3 rounded-2xl border text-right flex justify-between items-center ${paymentMethod === 'cash_full' ? 'bg-amber-500/10 border-amber-500 text-amber-400' : 'bg-neutral-950 border-neutral-800 text-neutral-300'}`}>
                  <div><strong className="block">1. دفع الحساب بالكامل بمحفظة كاش</strong><span className="text-[10px] text-neutral-400">فودافون كاش / أورانج / اتصالات / وي</span></div>
                  <span className="font-mono font-black text-sm">{pendingBooking.totalCost} ج</span>
                </button>
                <button type="button" disabled={customerWallet < pendingBooking.totalCost} onClick={() => setPaymentMethod('wallet_full')} className={`w-full p-3 rounded-2xl border text-right flex justify-between items-center ${customerWallet < pendingBooking.totalCost ? 'opacity-40 cursor-not-allowed bg-neutral-950 border-neutral-900 text-neutral-500' : (paymentMethod === 'wallet_full' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-400' : 'bg-neutral-950 border-neutral-800 text-neutral-300')}`}>
                  <div><strong className="block">2. الدفع الكامل من رصيد محفظتك بالتطبيق</strong><span className="text-[10px] text-neutral-400">رصيدك المتاح: {customerWallet} ج.م</span></div>
                  <span className="font-mono font-black text-emerald-400">خصم فوري</span>
                </button>
                <button type="button" disabled={customerWallet <= 0} onClick={() => setPaymentMethod('hybrid')} className={`w-full p-3 rounded-2xl border text-right flex justify-between items-center ${customerWallet <= 0 ? 'opacity-40 cursor-not-allowed bg-neutral-950 border-neutral-900 text-neutral-500' : (paymentMethod === 'hybrid' ? 'bg-cyan-500/10 border-cyan-500 text-cyan-400' : 'bg-neutral-950 border-neutral-800 text-neutral-300')}`}>
                  <div><strong className="block">3. الدفع الهجين (رصيد التطبيق + كاش)</strong><span className="text-[10px] text-neutral-400">خصم رصيدك وتحويل الباقي</span></div>
                  <span className="font-mono font-black text-cyan-400">هجين</span>
                </button>
              </div>

              {paymentMethod === 'hybrid' && (
                <div className="p-3.5 bg-cyan-500/10 border border-cyan-500/40 rounded-2xl space-y-1 text-[11px] text-cyan-200">
                  <div className="flex justify-between"><span>الإجمالي:</span><strong className="font-mono text-white">{pendingBooking.totalCost} ج</strong></div>
                  <div className="flex justify-between"><span>من محفظتك:</span><strong className="font-mono text-emerald-400">-{walletDeduction} ج</strong></div>
                  <div className="flex justify-between border-t border-cyan-500/20 pt-1"><span>المتبقي كاش:</span><strong className="font-mono text-amber-400">{remainingCashToTransfer} ج</strong></div>
                </div>
              )}

              {remainingCashToTransfer > 0 ? (
                <div className="space-y-3">
                  <div className="bg-neutral-950 p-3 rounded-2xl border border-neutral-800 text-center space-y-1">
                    <span className="text-[10px] text-neutral-400 block">حول ({remainingCashToTransfer} ج) للرقم الرسمي:</span>
                    <div className="flex items-center justify-center gap-2">
                      <span className="font-mono text-base font-black text-amber-400">{config.phone}</span>
                      <button type="button" onClick={() => { navigator.clipboard.writeText(config.phone); setCopiedNumber(true); setTimeout(() => setCopiedNumber(false), 2000); }} className="px-2.5 py-1 bg-neutral-800 text-white rounded-lg text-[10px] font-bold">{copiedNumber ? '✓ تم النسخ' : 'نسخ'}</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    {[{ id: 'vodafone', name: 'فودافون كاش' }, { id: 'orange', name: 'أورانج كاش' }, { id: 'etisalat', name: 'اتصالات كاش' }, { id: 'wepay', name: 'وي باي (WE)' }].map(w => (
                      <button key={w.id} type="button" onClick={() => setSelectedWalletType(w.id)} className={`p-2 rounded-xl border font-bold ${selectedWalletType === w.id ? 'bg-amber-500 text-black border-amber-500' : 'bg-neutral-950 border-neutral-800 text-neutral-300'}`}>{w.name}</button>
                    ))}
                  </div>
                  <input type="tel" required value={senderPhone} onChange={e => setSenderPhone(e.target.value)} placeholder="رقم المحفظة المحول منها (01xxxxxxxxx)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-left" />
                  <input type="text" required value={senderWalletName} onChange={e => setSenderWalletName(e.target.value)} placeholder="التحويل باسم مين؟" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
                  <div>
                    <label className="text-[10px] text-neutral-400 block mb-1">سكرين شوت إيصال التحويل 📸 *:</label>
                    <input type="file" accept="image/*" required onChange={async (e) => { if (e.target.files[0]) setReceiptScreenshot(await compressImageFile(e.target.files[0])); }} className="w-full text-neutral-400 bg-neutral-950 p-1.5 rounded-xl border border-neutral-800 text-[11px]" />
                    {receiptScreenshot && <img src={receiptScreenshot} alt="Receipt" className="max-h-24 mx-auto rounded-xl border border-emerald-500/50 mt-1.5" />}
                  </div>
                </div>
              ) : (
                <div className="p-3 bg-emerald-500/10 border border-emerald-500/40 rounded-2xl text-center text-emerald-400 font-bold">✓ رصيد محفظتك يغطي كامل الفاتورة — تأكيد فوري!</div>
              )}

              {errorMsg && <div className="p-2.5 bg-rose-500/10 border border-rose-500/40 text-rose-300 rounded-xl text-center font-bold">⚠️ {errorMsg}</div>}
              <button type="button" disabled={isSubmitting} onClick={handleExecutePayment} className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-2xl shadow-lg">
                {isSubmitting ? 'جاري التأكيد...' : (remainingCashToTransfer > 0 ? `تأكيد وإرسال الحجز (${remainingCashToTransfer} ج)` : `دفع فوري من المحفظة (${walletDeduction} ج)`)}
              </button>
            </div>
          ) : (
            <div className="bg-neutral-900 border border-emerald-500/50 p-6 rounded-3xl text-center space-y-4 shadow-2xl">
              <div className="text-5xl animate-bounce">🎉</div>
              <h2 className="text-xl font-black text-white">تم استلام حجزك بنجاح!</h2>
              <span className="text-amber-400 font-mono text-sm font-black block">كود الحجز: {pendingBooking.ref}</span>
              <a href={`https://wa.me/${config.whatsappNumber}?text=${whatsappMsg}`} target="_blank" className="w-full py-3 bg-emerald-600 text-white font-black rounded-2xl flex items-center justify-center gap-2">💬 إرسال تفاصيل الحجز على واتساب</a>
              <a href={config.mapsUrl} target="_blank" className="w-full py-2.5 bg-neutral-800 text-amber-300 border border-amber-500/40 rounded-2xl font-black flex items-center justify-center gap-2">📍 فتح موقع الصالة على Google Maps</a>
              <div className="flex gap-2">
                <button onClick={() => navigate('account')} className="flex-1 py-2.5 bg-neutral-800 text-white font-bold rounded-xl">حسابي</button>
                <button onClick={() => navigate('home')} className="flex-1 py-2.5 bg-amber-500 text-black font-black rounded-xl">الرئيسية</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function BundlesPage({ navigate, bundles, setPendingBooking, currentCustomer }) {
      const [selectedDevType, setSelectedDevType] = useState('PS5');
      const handleBookBundle = (bundle) => {
        playNotificationSound('click');
        const devPricePerHour = (PRICING[selectedDevType] || PRICING.PS5)[bundle.mode].perHour;
        const rawTimeCost = devPricePerHour * bundle.hours;
        const discountAmount = Math.round(rawTimeCost * (bundle.discountPercent / 100));
        setPendingBooking({
          id: `bk-${Date.now()}`, ref: `TX-BNDL-${Math.floor(1000 + Math.random() * 9000)}`,
          customerName: currentCustomer ? currentCustomer.name : 'عميل باقة تويكس',
          phone: currentCustomer ? (currentCustomer.phone || '') : '', email: currentCustomer ? (currentCustomer.email || '') : '',
          date: new Date().toISOString().slice(0, 10), time: '18:00', duration: bundle.hours * 60,
          bookedDevices: [{ id: 1, type: selectedDevType, mode: bundle.mode, duration: bundle.hours * 60 }],
          devicesSummary: `${bundle.name} (${selectedDevType} - ${bundle.hours} ساعات)`,
          snacksSummary: `شرط الباقة الإجباري: ${bundle.cafeteriaCondition}`,
          totalDevicesCost: rawTimeCost, totalSnacksCost: 0, promoDiscount: discountAmount,
          totalCost: rawTimeCost - discountAmount, status: 'awaiting_payment'
        });
        navigate('payment');
      };

      return (
        <div className="max-w-4xl mx-auto py-6 space-y-6 text-xs">
          <div className="text-center space-y-1">
            <h1 className="text-2xl font-black text-white">🎁 باقات التوفير الـ 8 الأساسية</h1>
            <p className="text-neutral-400">العب لساعات أطول واستمتع بطلبات الكافتيريا بأعلى خصم حقيقي</p>
          </div>
          <div className="flex justify-center items-center gap-3 bg-neutral-900 p-2.5 rounded-2xl border border-neutral-800 w-fit mx-auto">
            <span className="text-neutral-400 font-bold">اختر الجهاز:</span>
            <button type="button" onClick={() => setSelectedDevType('PS5')} className={`px-4 py-1.5 rounded-xl font-black ${selectedDevType === 'PS5' ? 'bg-amber-500 text-black' : 'text-neutral-400'}`}>PS5 VIP (120Hz)</button>
            <button type="button" onClick={() => setSelectedDevType('PS4')} className={`px-4 py-1.5 rounded-xl font-black ${selectedDevType === 'PS4' ? 'bg-amber-500 text-black' : 'text-neutral-400'}`}>PS4 Pro</button>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3.5">
            {bundles.map(b => {
              const originalCost = (PRICING[selectedDevType] || PRICING.PS5)[b.mode].perHour * b.hours;
              const finalPrice = originalCost - Math.round(originalCost * (b.discountPercent / 100));
              return (
                <div key={b.id} className="p-4 bg-neutral-900 border border-neutral-800 rounded-3xl flex flex-col justify-between space-y-3 shadow-xl">
                  <div className="space-y-2">
                    <div className="flex justify-between items-center"><span className="text-[10px] bg-amber-500 text-black font-black px-2 py-0.5 rounded-md">خصم {b.discountPercent}%</span><span className="text-[10px] text-neutral-400">{b.mode === 'multi' ? 'ملتي' : 'فردي'}</span></div>
                    <strong className="text-white block">{b.name}</strong>
                    <p className="text-[10px] text-neutral-400">{b.desc}</p>
                    <div className="p-2 bg-neutral-950 rounded-xl border border-neutral-800 text-[10px]"><span className="text-amber-300 font-bold block">☕ شرط الباقة:</span><span className="text-neutral-300">{b.cafeteriaCondition}</span></div>
                  </div>
                  <div className="pt-2 border-t border-neutral-800 space-y-2">
                    <div className="flex justify-between items-baseline"><span className="text-neutral-500 line-through font-mono">{originalCost} ج</span><span className="text-amber-400 font-black text-base font-mono">{finalPrice} ج.م</span></div>
                    <button type="button" onClick={() => handleBookBundle(b)} className="w-full py-2 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl">احجز هذه الباقة ➔</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
        }
    function PartiesPage({ navigate, config, devices, currentCustomer, setPendingBooking }) {
      const [partyName, setPartyName] = useState(currentCustomer ? currentCustomer.name : '');
      const [partyPhone, setPartyPhone] = useState(currentCustomer ? (currentCustomer.phone || '') : '');
      const [partyDate, setPartyDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [partyStartTime, setPartyStartTime] = useState('18:00');
      const [partyDurationHours, setPartyDurationHours] = useState(3);
      const [partyReason, setPartyReason] = useState('');
      const [attendeesCount, setAttendeesCount] = useState(10);
      const [errorMsg, setErrorMsg] = useState('');

      const totalLoungeHourlyRate = devices.reduce((sum, d) => sum + ((PRICING[d.type] || PRICING.PS4).multi.perHour), 0);
      const devicesTotalCost = totalLoungeHourlyRate * partyDurationHours;
      const partyTax = config.partyTax || 200;
      const finalPartyTotal = devicesTotalCost + partyTax;

      const handleProceedPartyBooking = (e) => {
        e.preventDefault(); setErrorMsg('');
        if (!partyName.trim()) return setErrorMsg('يرجى كتابة اسم المسؤول عن الحفلة.');
        if (!validateEgyptianPhone(partyPhone)) return setErrorMsg('يرجى كتابة رقم هاتف مصري صحيح مكون من 11 رقماً.');
        if (!partyReason.trim()) return setErrorMsg('يرجى توضيح سبب الحفلة.');

        setPendingBooking({
          id: `party-${Date.now()}`, ref: `TX-PARTY-${Math.floor(1000 + Math.random() * 9000)}`,
          customerName: partyName.trim(), phone: partyPhone.trim(),
          date: partyDate, time: partyStartTime, duration: partyDurationHours * 60, isParty: true,
          devicesSummary: `حجز الصالة بالكامل (${devices.length} شاشات) لمدة ${partyDurationHours} ساعات`,
          snacksSummary: `حفلة خاصة (${partyReason.trim()}) - الحضور: ${attendeesCount} أفراد`,
          totalDevicesCost: devicesTotalCost, totalSnacksCost: partyTax, promoDiscount: 0,
          totalCost: finalPartyTotal, status: 'awaiting_payment'
        });
        navigate('payment');
      };

      return (
        <div className="max-w-2xl mx-auto py-6 space-y-6 text-xs">
          <div className="text-center space-y-1">
            <span className="text-[10px] bg-pink-500/20 text-pink-300 px-3 py-1 rounded-full font-black">قسم المناسبات وأعياد الميلاد VIP</span>
            <h1 className="text-2xl font-black text-white">🎉 حجز الصالة بالكامل لحفلة خاصة</h1>
            <p className="text-neutral-400">احجز المكان بالكامل لك ولأصحابك للاحتفال بدون أي مقاطعة</p>
          </div>
          <div className="p-4 bg-gradient-to-r from-pink-500/10 via-neutral-900 to-pink-500/10 border border-pink-500/30 rounded-3xl space-y-1">
            <strong className="text-pink-300 block">💡 شروط حجز الحفلة:</strong>
            <p className="text-neutral-300 text-[11px]">يتم حجز جميع الشاشات ({devices.length} أجهزة) لعدد الساعات المحدد وتضاف رسوم تنظيم {partyTax} ج.م.</p>
          </div>
          {errorMsg && <div className="p-3 bg-rose-500/10 border border-rose-500/40 text-rose-300 rounded-2xl text-center font-bold">⚠️ {errorMsg}</div>}
          <form onSubmit={handleProceedPartyBooking} className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl space-y-4 shadow-2xl">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><label className="text-[10px] text-neutral-400 block mb-1">اسم المسؤول *:</label><input required value={partyName} onChange={e => setPartyName(e.target.value)} placeholder="اسمك بالكامل" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" /></div>
              <div><label className="text-[10px] text-neutral-400 block mb-1">رقم الهاتف *:</label><input required type="tel" value={partyPhone} onChange={e => setPartyPhone(e.target.value)} placeholder="01xxxxxxxxx" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-left" /></div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div><label className="text-[10px] text-neutral-400 block mb-1">التاريخ:</label><input type="date" value={partyDate} onChange={e => setPartyDate(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono" /></div>
              <div><label className="text-[10px] text-neutral-400 block mb-1">وقت البدء:</label><input type="time" value={partyStartTime} onChange={e => setPartyStartTime(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono" /></div>
              <div><label className="text-[10px] text-neutral-400 block mb-1">المدة:</label><select value={partyDurationHours} onChange={e => setPartyDurationHours(Number(e.target.value))} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-bold">{[2,3,4,5,6].map(h => <option key={h} value={h}>{h} ساعات</option>)}</select></div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div className="sm:col-span-2"><label className="text-[10px] text-neutral-400 block mb-1">سبب الحفلة *:</label><input required value={partyReason} onChange={e => setPartyReason(e.target.value)} placeholder="عيد ميلاد / تخرج / بطولة" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" /></div>
              <div><label className="text-[10px] text-neutral-400 block mb-1">عدد الحضور:</label><input type="number" min={1} value={attendeesCount} onChange={e => setAttendeesCount(Number(e.target.value))} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-center" /></div>
            </div>
            <div className="p-3.5 bg-neutral-950 rounded-2xl border border-neutral-800 space-y-1.5 text-[11px]">
              <div className="flex justify-between text-neutral-400"><span>ساعات الصالة ({devices.length} شاشات × {partyDurationHours}س):</span><strong className="font-mono text-white">{devicesTotalCost} ج.م</strong></div>
              <div className="flex justify-between text-neutral-400"><span>رسوم التنظيم:</span><strong className="font-mono text-pink-400">+{partyTax} ج.م</strong></div>
              <div className="flex justify-between pt-1 border-t border-neutral-800 text-sm"><span className="font-bold text-white">الإجمالي:</span><strong className="font-mono text-amber-400 font-black">{finalPartyTotal} ج.م</strong></div>
            </div>
            <button type="submit" className="w-full py-3 bg-gradient-to-r from-pink-600 to-amber-500 text-black font-black rounded-2xl shadow-xl">المتابعة للدفع وتأكيد الحفلة ({finalPartyTotal} ج.م) ➔</button>
          </form>

    function LuckyWheelPage({ wheelSegments, currentCustomer, setCurrentCustomer }) {
      const [isSpinning, setIsSpinning] = useState(false);
      const [spinOutcome, setSpinOutcome] = useState(null);

      const handleTriggerSpin = () => {
        if (!currentCustomer) return alert("يرجى تسجيل الدخول أولاً لحفظ هداياك في حسابك!");
        const fp = getDeviceFingerprint();
        const spinKey = `twix_last_spin_${fp}`;
        const lastSpin = Number(localStorage.getItem(spinKey) || 0);
        const cooldownMs = 24 * 60 * 60 * 1000;
        if (Date.now() - lastSpin < cooldownMs) {
          const remHours = Math.ceil((cooldownMs - (Date.now() - lastSpin)) / (1000 * 60 * 60));
          return alert(`لقد استخدمت لفتك اليومية بالفعل. متبقي ${remHours} ساعة.`);
        }
        setIsSpinning(true); setSpinOutcome(null);
        const rand = Math.random() * 100;
        let cumulative = 0, picked = wheelSegments[0];
        for (const seg of wheelSegments) { cumulative += seg.prob; if (rand <= cumulative) { picked = seg; break; } }

        setTimeout(() => {
          setIsSpinning(false); setSpinOutcome(picked);
          localStorage.setItem(spinKey, Date.now().toString());
          if (picked.type !== 'none') {
            playNotificationSound('cash');
            const newGift = { id: `rew-${Date.now()}`, title: picked.label, rewardType: picked.type, createdAt: Date.now(), validDays: 7, status: 'active' };
            const updatedRewards = [...(currentCustomer.rewards || []), newGift];
            setCurrentCustomer(prev => ({ ...prev, rewards: updatedRewards }));
            db.collection('customers').doc(currentCustomer.phone).set({ rewards: updatedRewards }, { merge: true });
          } else playNotificationSound('click');
        }, 2500);
      };

      return (
        <div className="max-w-md mx-auto py-6 space-y-6 text-xs text-center">
          <div className="space-y-1"><h1 className="text-2xl font-black text-white">🎡 عجلة حظ TWIX الدوارة</h1><p className="text-neutral-400">لفة واحدة كل 24 ساعة وجوائز صالحة لمدة 7 أيام</p></div>
          <div className="relative w-64 h-64 mx-auto flex items-center justify-center">
            <div className="absolute -top-3.5 z-20 text-3xl text-amber-400">▼</div>
            <div className={`w-full h-full rounded-full border-4 border-amber-500/50 bg-neutral-900 shadow-2xl flex items-center justify-center relative overflow-hidden ${isSpinning ? 'animate-spin' : ''}`}>
              <div className="grid grid-cols-2 grid-rows-3 w-full h-full text-[10px] font-black text-white p-2">
                {wheelSegments.map((seg, idx) => <div key={idx} className={`flex items-center justify-center text-center p-1 border border-neutral-800 ${idx % 2 === 0 ? 'bg-neutral-950 text-neutral-300' : 'bg-neutral-900 text-amber-400'}`}><span>{seg.label}</span></div>)}
              </div>
            </div>
            <button type="button" disabled={isSpinning} onClick={handleTriggerSpin} className="absolute z-10 w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-black shadow-2xl border-4 border-black">{isSpinning ? '⏳' : 'دَوّر!'}</button>
          </div>
          {spinOutcome && <div className="p-4 rounded-3xl border bg-neutral-900 border-amber-500/40"><h3 className="text-base font-black text-white">{spinOutcome.label}</h3></div>}
          {currentCustomer && (currentCustomer.rewards || []).length > 0 && (
            <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-3 text-right">
              <h3 className="font-bold text-white border-b border-neutral-800 pb-2">🎁 صندوق جوائزي النشطة ({currentCustomer.rewards.length}):</h3>
              {currentCustomer.rewards.map((rew, index) => {
                const diffMs = (rew.createdAt + ((rew.validDays || 7) * 86400000)) - Date.now();
                const isExpired = diffMs <= 0;
                const daysLeft = Math.floor(Math.max(0, diffMs) / 86400000);
                return (
                  <div key={rew.id || index} className="p-3 rounded-2xl border border-amber-500/30 bg-neutral-950 flex justify-between items-center">
                    <div><strong className="text-white block">{rew.title}</strong><span className="text-[10px] text-neutral-400 font-mono">{isExpired ? 'منتهية ✕' : `⏳ متبقي: ${daysLeft} يوم`}</span></div>

                      <button type="button" onClick={() => {
                        const req = { id: `req-${Date.now()}`, screenName: 'تفعيل جائزة عجلة الحظ', customerName: `${currentCustomer.name} (${currentCustomer.phone})`, type: 'reward', detail: `طلب تفعيل جائزة: ${rew.title}`, status: 'pending', time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }), createdAt: new Date().toISOString() };

                    )}

    function GamingAIAssistant() {
      const [panelMode, setPanelMode] = useState(null); // null | 'ai' | 'guide'
      const [guideTab, setGuideTab] = useState('fifa');
      const [aiQuery, setAiQuery] = useState('');

      ]);

      const getSmartGamingReply = (rawQ) => {
        const q = rawQ.trim().toLowerCase();
        const blocked = ['ادمن', 'إدارة', 'ادارة', 'رمز', 'باسورد', 'ارباح', 'أرباح', 'كاش', 'فلوس', 'شفت', 'شِفت', 'درج', 'حسابات', 'عملاء', 'تليفون', 'موبايل', 'سري', 'مصروف', 'شكك', 'مبيعات', 'مدير', 'مخزون'];
        if (blocked.some(w => q.includes(w))) {
          return '🔒 عذراً! أنا مساعد ذكي مبرمج للإجابة عن ألعاب البلايستيشن والذراع فقط، وممنوع تماماً الإجابة عن أي تفاصيل إدارية أو حسابات.';
        }
        if (q.includes('فيفا') || q.includes('fifa') || q.includes('fc')) {
          return '⚽ في فيفا / EA FC: الشوت بـ ◯، الباص بـ ✕، العرضية بـ ▢، والثرو بـ △. شوتة R1+◯ قوية جداً من حدود المنطقة، وفي الدفاع اضغط L2 للوقفة المتوازنة مع R1 لاستدعاء زميل!';
        }
        if (q.includes('بيس') || q.includes('pes') || q.includes('فوتبول') || q.includes('efootball')) {
          return '⚽ في بيس / eFootball: انتبه إن الشوت بـ ▢ والعرضية بـ ◯ (عكس فيفا)! واستخدم L2 في الدفاع لغلق زاوية التمرير، وR1+▢ لشوتة مركونة.';
        }
        if (q.includes('مورتال') || q.includes('تكن') || q.includes('قتال') || q.includes('mk') || q.includes('tekken')) {
          return '🥊 في ألعاب القتال: ▢ و △ لليد، و ✕ و ◯ للرجل، واستخدم الأسهم (D-Pad) للكومبوهات بدل الأنالوج. في مورتال كومبات الصد بـ R2، والضربة الخارقة بـ L2+R2 لما دمك يقل!';
        }
        if (q.includes('gta') || q.includes('جاتا') || q.includes('حرامي')) {
          return '🔫 في GTA V: التصويب بـ L2 والضرب بـ R2، ركوب العربية بـ △، قائمة الأسلحة بـ L1، والاختباء بـ R1.';
        }
        if (q.includes('دراع') || q.includes('ذراع') || q.includes('زرار') || q.includes('أزرار')) {
          return '🎮 تقدر تضغط على زرار "دليل أزرار الذراع" اللي جنبي عشان تشوف شرح كل زرار (✕ ◯ ▢ △ R1 R2 L1 L2) لكل نوع لعبة بالصور والتفصيل!';
        }
        if (q.includes('ps5') || q.includes('ps4') || q.includes('فرق') || q.includes('120')) {
          return '⚡ أجهزة PS5 VIP عندنا شغالة على شاشات 4K 120Hz بسلاسة خرافية واستجابة فورية بدون أي لاج، ومع دراعات DualSense الأصلية!';
        }
        return '🎮 أنا متخصص في ألعاب البلايستيشن (فيفا، بيس، مورتال كومبات، تكن، GTA، السباقات، وأزرار الذراع). اكتب اسم اللعبة أو الحركة اللي عايز تعرفها وهشرحهالك فوراً!';
      };

      const handleAskAI = (e) => {
        e.preventDefault();
        if (!aiQuery.trim()) return;
        const reply = getSmartGamingReply(aiQuery);
        setChatLog(prev => [...prev, { sender: 'user', text: aiQuery }, { sender: 'ai', text: reply }]);
        setAiQuery('');
      };

      return (
        <div className="fixed bottom-4 left-4 z-40 text-xs">
          {!panelMode ? (
            <div className="flex flex-wrap gap-2">
              <button type="button" onClick={() => setPanelMode('ai')} className="bg-amber-500 hover:bg-amber-400 text-black font-black px-3.5 py-2.5 rounded-full shadow-2xl flex items-center gap-1.5 border-2 border-black">

                <input required name="cPass" defaultValue="123456" placeholder="الرقم السري" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
                <input type="number" min={0} defaultValue={0} name="cBalance" placeholder="رصيد افتتاحي (ج)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-mono text-center" />
                <input type="file" name="cAvatar" accept="image/*" className="w-full text-neutral-400 bg-neutral-950 p-1 rounded-xl border border-neutral-800 text-[10px]" />
                <button type="submit" className="w-full py-2.5 bg-blue-600 text-white font-black rounded-xl">حفظ وتفعيل سحابياً</button>
              </form>
            </div>
          )}

          {/* نافذة تسجيل المصاريف */}
          {showExpenseModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">📉 مصاريف الشِفت ({totalExpenses} ج)</h3><button type="button" onClick={() => setShowExpenseModal(false)} className="text-neutral-400">✕</button></div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const title = e.target.eTitle.value.trim(), amount = Number(e.target.eAmount.value || 0);
                  if (!title || amount <= 0) return;
                  const id = `exp-${Date.now()}`;
                  db.collection('expenses').doc(id).set({ id, title, amount, shiftId: adminShift, date: todayStr, createdAt: new Date().toISOString() });
                  e.target.reset(); playNotificationSound('click');
                }} className="space-y-2">
                  <input required name="eTitle" placeholder="بند المصروف (شاي، سكر، بضاعة...)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white" />
                  <input required type="number" min={1} name="eAmount" placeholder="المبلغ (ج.م)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-mono text-center" />
                  <button type="submit" className="w-full py-2 bg-rose-600 text-white font-black rounded-xl">+ خصم من الدرج</button>
                </form>
                <div className="max-h-36 overflow-y-auto space-y-1.5 no-scrollbar">
                  {currentShiftExpenses.map(ex => (
                    <div key={ex.id} className="p-2 bg-neutral-950 rounded-xl flex justify-between items-center border border-neutral-800">
                      <span>{ex.title} — <strong className="text-rose-400 font-mono">{ex.amount}ج</strong></span>
                      <button type="button" onClick={() => db.collection('expenses').doc(ex.id).delete()} className="text-neutral-500 hover:text-rose-400">✕</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* نافذة دفتر الشكك */}
          {showDebtModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">📝 دفتر الشكك ({totalUnpaidDebts} ج)</h3><button type="button" onClick={() => setShowDebtModal(false)} className="text-neutral-400">✕</button></div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const customerName = e.target.dName.value.trim(), amount = Number(e.target.dAmount.value || 0), note = e.target.dNote.value.trim();
                  if (!customerName || amount <= 0) return;
                  const id = `dbt-${Date.now()}`;
                  db.collection('debts').doc(id).set({ id, customerName, amount, note, paid: false, shiftId: adminShift, date: todayStr, createdAt: new Date().toISOString() });
                  e.target.reset(); playNotificationSound('click');
                }} className="space-y-2">
                  <input required name="dName" placeholder="اسم العميل" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white" />
                  <input required type="number" min={1} name="dAmount" placeholder="المبلغ (ج.م)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-mono text-center" />
                  <input name="dNote" placeholder="ملاحظة (اختياري)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white" />
                  <button type="submit" className="w-full py-2 bg-amber-500 text-black font-black rounded-xl">+ تسجيل شكك</button>
                </form>
                <div className="max-h-36 overflow-y-auto space-y-1.5 no-scrollbar">
                  {currentShiftDebts.filter(d => !d.paid).map(d => (
                    <div key={d.id} className="p-2 bg-neutral-950 rounded-xl flex justify-between items-center border border-neutral-800">
                      <div><strong className="text-white">{d.customerName}</strong> <span className="text-amber-400 font-mono">({d.amount}ج)</span></div>
                      <button type="button" onClick={() => db.collection('debts').doc(d.id).update({ paid: true })} className="px-2 py-0.5 bg-emerald-500 text-black font-bold rounded text-[10px]">تم السداد ✓</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* تقرير الوردية للواتساب */}
          {showShiftReport && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 text-center">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">📊 ملخص الوردية ({adminShift === 'shift_1' ? 'شِفت 1' : 'شِفت 2'})</h3><button type="button" onClick={() => setShowShiftReport(false)} className="text-neutral-400">✕</button></div>
                <div className="p-3 bg-neutral-950 rounded-2xl border border-neutral-800 text-right space-y-1 text-[11px]">
                  <div>💵 كاش الصالة: <strong className="text-emerald-400">{inStoreRevenue} ج.م</strong></div>
                  <div>🌐 الأونلاين: <strong className="text-blue-400">{onlineRevenue} ج.م</strong></div>
                  <div>📉 المصاريف: <strong className="text-rose-400">-{totalExpenses} ج.م</strong></div>
                  <div className="border-t border-neutral-800 pt-1 font-bold text-amber-400">صافي كاش الدرج: {netDrawerCash} ج.م</div>
                </div>
                <a href={`https://wa.me/${config.whatsappNumber}?text=${encodeURIComponent(`📊 تقرير وردية ${config.loungeName} (${adminShift} - ${todayStr}):\n• كاش الصالة: ${inStoreRevenue} ج\n• الأونلاين: ${onlineRevenue} ج\n• المصاريف: ${totalExpenses} ج\n• صافي الدرج: ${netDrawerCash} ج.م`)}`} target="_blank" className="w-full py-2.5 bg-emerald-600 text-white font-black rounded-xl block">📲 إرسال للواتساب</a>
              </div>
            </div>
          )}

          {/* الفاتورة الحرارية 80mm */}
          {printableReceipt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-white text-black rounded-3xl p-6 max-w-xs w-full space-y-3">
                <div id="printable-receipt" className="space-y-2 text-center border-b pb-3">
                  <h2 className="font-black text-lg">{config.loungeName}</h2>
                  <p className="text-[10px] text-neutral-600">بون حساب — ت: {config.phone}</p>
                  <div className="text-[11px] text-right space-y-1 pt-2 border-t border-dashed">
                    <div>الجهاز: <strong>{printableReceipt.devName}</strong></div>
                    <div>العميل: <strong>{printableReceipt.customerName}</strong></div>
                    <div>المدة: <strong>{printableReceipt.durationMins || 30} دقيقة</strong></div>
                    {printableReceipt.controllersCheck && <div>الدراعات: <strong>{printableReceipt.controllersCheck}</strong></div>}
                  </div>
                  <div className="text-base font-black pt-2 border-t border-dashed flex justify-between"><span>الإجمالي:</span><span>{printableReceipt.totalCost} ج.م</span></div>
                </div>
                <div className="flex gap-2"><button type="button" onClick={() => window.print()} className="flex-1 py-2 bg-black text-white font-bold rounded-xl">🖨️ طباعة</button><button type="button" onClick={() => setPrintableReceipt(null)} className="flex-1 py-2 bg-neutral-200 text-neutral-800 font-bold rounded-xl">إغلاق</button></div>
              </div>
            </div>
          )}

          {/* معاينة صورة المستند */}
          {viewDocImage && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
              <div className="bg-neutral-900 border border-neutral-700 rounded-3xl p-5 max-w-md w-full space-y-3 text-center">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">معاينة المستند</h3><button type="button" onClick={() => setViewDocImage(null)} className="text-neutral-400">✕</button></div>
                <img src={viewDocImage} alt="Document" className="max-h-[65vh] mx-auto rounded-xl object-contain" />
                <button type="button" onClick={() => setViewDocImage(null)} className="w-full py-2 bg-neutral-800 text-white rounded-xl font-bold">إغلاق</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
  </script>
</body>
</html>
