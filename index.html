      <div className="space-y-2.5 max-h-[70vh] overflow-y-auto no-scrollbar">{filtered.map(b => {

        return (<div key={b.id} className={"p-3.5 bg-neutral-950 rounded-2xl border space-y-2 " + (b.status === 'pending_cancel_approval' ? 'border-cyan-500' : (ti.state === 'ended' ? 'border-rose-500 animate-pulse' : 'border-neutral-800'))}><div className="flex flex-wrap justify-between gap-2"><div><span className="font-mono font-bold text-amber-400">{b.ref}</span> — <strong className="text-white">{b.customerName} ({b.phone})</strong>{b.duplicateReceiptOf && <span className="mr-1.5 px-2 py-0.5 bg-rose-600 text-white rounded text-[9px] font-black">⚠️ إيصال مكرر ({b.duplicateReceiptOf})</span>}<div className="text-[11px] text-neutral-300">{b.devicesSummary} | {b.date} ({formatTime12(b.time, 'ar')}) | <strong className="text-amber-300 font-mono">{b.totalCost} ج</strong></div><div className="text-[10px] text-neutral-500">{b.snacksSummary} {b.cancelNote ? ("| 🔔 " + b.cancelNote) : ''}</div></div><div className="flex flex-wrap gap-1">{(b.receiptMediaId || b.receiptScreenshot) && <button onClick={() => onViewMedia(b.receiptMediaId || b.receiptScreenshot)} className="px-2 py-1 bg-neutral-800 text-amber-300 rounded text-[10px]">📸 الإيصال</button>}<button onClick={() => setReceipt({ ref: b.ref, devName: b.devicesSummary, customerName: b.customerName, durationMins: b.duration, totalCost: b.totalCost })} className="px-2 py-1 bg-neutral-800 text-white rounded text-[10px]">🖨️</button><button onClick={() => setShowEditBooking(b)} className="px-2 py-1 bg-neutral-800 text-cyan-300 rounded text-[10px]">✏️</button><a href={"https://wa.me/" + formatWhatsAppNum(b.whatsappPhone || b.phone) + "?text=" + encodeURIComponent("أهلاً " + b.customerName + "، بخصوص حجزك (" + b.ref + ") في " + config.loungeName + " يوم " + b.date + " الساعة " + formatTime12(b.time, 'ar') + " 🎮")} target="_blank" rel="noopener noreferrer" className="px-2 py-1 bg-emerald-600/30 text-emerald-300 rounded text-[10px]">💬</a></div></div><div className="flex flex-wrap gap-1.5 items-center pt-1 border-t border-neutral-900"><span className="text-[10px] font-black text-amber-300">{trStatus(b.status, 'ar')}</span>{b.status === 'pending_cancel_approval' && <><button disabled={busyBtn} onClick={() => handleCancelReview(b, 'external_done')} className="px-2 py-1 bg-emerald-500 text-black font-black rounded text-[10px]">✓ تم التحويل الخارجي</button><button disabled={busyBtn} onClick={() => handleCancelReview(b, 'to_wallet')} className="px-2 py-1 bg-amber-500 text-black font-bold rounded text-[10px]">💸 رد لمحفظة التطبيق</button><button disabled={busyBtn} onClick={() => handleCancelReview(b, 'reject_cancel')} className="px-2 py-1 bg-rose-600 text-white rounded text-[10px]">✕ رفض الإلغاء</button></>}{b.status === 'awaiting_admin_approval' && <><button disabled={busyBtn} onClick={async () => { setBusyBtn(true); try { const r = await confirmBooking(b); toast(r.msg); } catch (e) { showAlert(e.message); } finally { setBusyBtn(false); } }} className="px-2.5 py-1 bg-emerald-500 text-black font-black rounded text-[10px]">✓ موافقة</button><button onClick={async () => { const rs = await showPrompt('سبب الرفض:', 'الإيصال غير واضح'); if (rs !== null) rejectBooking(b, { refundCashToWallet: false, reason: rs }); }} className="px-2 py-1 bg-rose-600 text-white rounded text-[10px]">❌ رفض</button></>}{b.status === 'confirmed' && !b.isPackOrder && <><select value="" onChange={e => swapBookingScreen(b, e.target.value)} className="bg-neutral-900 text-purple-300 p-1 rounded text-[10px]"><option value="">🔀 نقل شاشة...</option>{devices.filter(d => d.status !== 'maintenance').map(d => <option key={d.id} value={d.id}>{d.name}</option>)}</select>{ns === 'late_arrival' && <button onClick={() => markNoShow(b)} className="px-2 py-1 bg-rose-600/30 text-rose-200 rounded text-[10px]">🚫 غياب (تحرير الشاشة)</button>}{ns === 'same_day_makeup' && <button onClick={() => confirmBooking(b, { makeupToday: true }).then(r => toast(r.msg)).catch(e => showAlert(e.message))} className="px-2 py-1 bg-cyan-500 text-black font-black rounded text-[10px]">🔄 تعويض اليوم</button>}{ti.state !== 'finished' && ns === 'normal' && <>{!b.checkedIn && ti.state === 'scheduled' && <button onClick={() => controlTimer(b, 'start')} className="px-2 py-1 bg-emerald-500 text-black font-black rounded text-[10px]">✅ بدء</button>}<button onClick={() => controlTimer(b, ti.state === 'running' ? 'pause' : (ti.state === 'paused' ? 'resume' : 'start'))} className="px-2 py-1 bg-amber-500 text-black font-black rounded text-[10px]">{ti.state === 'running' ? '⏸️' : '▶️'}</button><button onClick={() => controlTimer(b, 'adjust', 15, true)} className="px-2 py-1 bg-neutral-800 text-emerald-300 rounded text-[10px]">+15د</button><button onClick={() => controlTimer(b, 'adjust', -15, false)} className="px-2 py-1 bg-neutral-800 text-rose-300 rounded text-[10px]">-15د</button><button onClick={() => controlTimer(b, 'finish')} className="px-2 py-1 bg-rose-600/40 text-rose-200 rounded text-[10px]">⏹️</button></>}</>}</div></div>);
      })}</div>
    </div>
  );
    }
