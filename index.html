    function playNotificationSound(type = 'click') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.04);
          osc.start(); osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'cash') {
          osc.frequency.setValueAtTime(987, ctx.currentTime);
          osc.frequency.setValueAtTime(1318, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'alert') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.setValueAtTime(330, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(); osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'countdown') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start(); osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) {}
    }

    function compressImageFile(file, maxDimension = 700) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h && w > maxDimension) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
            else if (h > maxDimension) { w = Math.round((h * maxDimension) / h); h = maxDimension; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function calcDevicePriceWithConfig(pricingData, type, mode, minutes) {
      if (!minutes || minutes <= 0) return 0;
      const rates = pricingData || DEFAULT_PRICING;
      const dev = rates[type] || rates.PS4 || DEFAULT_PRICING.PS4;
      const rate = mode === 'multi' ? dev.multi : dev.single;
      const blocks = Math.ceil(minutes / 30);
      return Math.max(1, blocks) * (rate.per30 || 35);
    }

    function calculateInfiniteLevel(xp = 0, totalHoursPlayed = 0) {
      const level = Math.floor(Math.sqrt(Math.max(0, xp) / 25)) + 1;

      if (level >= 100) { title = "أسطورة TWIX المطلقة"; badge = "👑"; color = "text-amber-400"; }
      else if (level >= 50) { title = "بطل ما وراء الطبيعة"; badge = "💎"; color = "text-cyan-400"; }
      else if (level >= 25) { title = "محترف الصالة"; badge = "🥇"; color = "text-amber-300"; }
      else if (level >= 10) { title = "مقاتل فضي"; badge = "🥈"; color = "text-slate-300"; }
      return { level, title, badge, color, nextLvlXP: Math.pow(level, 2) * 25, eligibleFor24hReward: totalHoursPlayed >= 24 };

    function PaymentPage({ navigate, config, pendingBooking, currentCustomer, setCurrentCustomer, setMyBookings }) {
      if (!pendingBooking) {
        return (
          <div className="text-center py-20 space-y-3">
            <p className="text-neutral-400">لا يوجد حجز معلق للدفع حالياً.</p>
            <button onClick={() => navigate('booking')} className="bg-amber-500 text-black font-bold px-4 py-2 rounded-xl text-xs">الذهاب لصفحة الحجز 🎮</button>
          </div>
        );
      }

      const customerWallet = (currentCustomer && currentCustomer.walletBalance) || 0;
      const [paymentMethod, setPaymentMethod] = useState(() => {
        if (customerWallet >= pendingBooking.totalCost && pendingBooking.totalCost > 0) return 'wallet_full';
        return 'cash_full';
      });
      const [senderPhone, setSenderPhone] = useState(pendingBooking.phone || (currentCustomer?.phone || ''));
      const [senderWalletName, setSenderWalletName] = useState(pendingBooking.customerName || '');
      const [receiptScreenshot, setReceiptScreenshot] = useState(null);
      const [copiedNumber, setCopiedNumber] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [paymentDoneSuccess, setPaymentDoneSuccess] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      let walletDeduction = 0, remainingCashToTransfer = pendingBooking.totalCost;
      if (paymentMethod === 'wallet_full') { walletDeduction = pendingBooking.totalCost; remainingCashToTransfer = 0; }

      const handleExecutePayment = () => {
        if (isSubmitting) return;
        setErrorMsg('');
        if (remainingCashToTransfer > 0) {
          if (!validateEgyptianPhone(senderPhone)) return setErrorMsg('يجب كتابة رقم المحفظة المحول منها (11 رقماً).');
          if (!receiptScreenshot) return setErrorMsg('إلزامي: يرجى إرفاق سكرين شوت إيصال التحويل لتأكيد الحجز.');
        }
        setIsSubmitting(true);
        const newBal = Math.max(0, customerWallet - walletDeduction);
        const isInstantConfirm = remainingCashToTransfer === 0;

        const finalBookingData = {
          ...pendingBooking, paymentMethod, walletDeduction, remainingCashToTransfer,
          senderPhone: remainingCashToTransfer > 0 ? senderPhone.trim() : (currentCustomer?.phone || 'محفظة داخلية'),
          senderWalletName: remainingCashToTransfer > 0 ? senderWalletName.trim() : (currentCustomer?.name || 'محفظة داخلية'),
          receiptScreenshot: receiptScreenshot || null,
          status: isInstantConfirm ? 'confirmed' : 'awaiting_admin_approval',
          createdAt: new Date().toISOString()
        };

        db.collection('bookings').doc(finalBookingData.id).set(finalBookingData).then(() => {
          if (currentCustomer && (walletDeduction > 0 || isInstantConfirm)) {
            db.collection('customers').doc(currentCustomer.phone).set({ walletBalance: newBal }, { merge: true });
            setCurrentCustomer(prev => prev ? { ...prev, walletBalance: newBal } : prev);
          }
          setMyBookings(prev => [finalBookingData, ...prev]);
          playNotificationSound('cash'); setPaymentDoneSuccess(true); setIsSubmitting(false);
        }).catch(() => {
          setIsSubmitting(false); alert('تعذر حفظ الحجز، تحقق من اتصال الإنترنت.');
        });
      };

    function LuckyWheelPage({ wheelSegments, currentCustomer, setCurrentCustomer }) {
      const [isSpinning, setIsSpinning] = useState(false);
      const [spinOutcome, setSpinOutcome] = useState(null);

      const handleTriggerSpin = () => {
        if (!currentCustomer) return alert("يرجى تسجيل الدخول أولاً لحفظ هداياك في حسابك!");
        const cooldownMs = 24 * 60 * 60 * 1000;
        const lastSpin = currentCustomer.lastWheelSpin || 0;
        if (Date.now() - lastSpin < cooldownMs) {
          const remHours = Math.ceil((cooldownMs - (Date.now() - lastSpin)) / (1000 * 60 * 60));
          return alert(`عفواً يا بطل! لك لفة واحدة كل 24 ساعة. متبقي ${remHours} ساعة.`);
        }
        setIsSpinning(true); setSpinOutcome(null);
        const rand = Math.random() * 100;
        let cumulative = 0, picked = wheelSegments[0];
        for (const seg of wheelSegments) { cumulative += seg.prob; if (rand <= cumulative) { picked = seg; break; } }

        setTimeout(() => {
          setIsSpinning(false); setSpinOutcome(picked);
          const nowTs = Date.now();
          const updates = { lastWheelSpin: nowTs };
          if (picked.type !== 'none') {
            playNotificationSound('cash');
            const newGift = { id: `rew-${Date.now()}`, title: picked.label, rewardType: picked.type, createdAt: nowTs, validDays: 7, status: 'active', isUsed: false };
            const updatedRewards = [...(currentCustomer.rewards || []), newGift];
            updates.rewards = updatedRewards;
            setCurrentCustomer(prev => ({ ...prev, ...updates }));
          } else {
            playNotificationSound('click');
            setCurrentCustomer(prev => ({ ...prev, ...updates }));
          }
          db.collection('customers').doc(currentCustomer.phone).set(updates, { merge: true });
        }, 2500);
      };

      return (
        <div className="max-w-md mx-auto py-6 space-y-6 text-xs text-center">
          <div className="space-y-1"><h1 className="text-2xl font-black text-white">🎡 عجلة حظ TWIX الدوارة</h1><p className="text-neutral-400">لفة واحدة كل 24 ساعة وجوائز صالحة لمدة 7 أيام</p></div>
          <div className="relative w-64 h-64 mx-auto flex items-center justify-center">
            <div className="absolute -top-3.5 z-20 text-3xl text-amber-400">▼</div>
            <div className={`w-full h-full rounded-full border-4 border-amber-500/50 bg-neutral-900 shadow-2xl flex items-center justify-center relative overflow-hidden ${isSpinning ? 'animate-spin' : ''}`}>
              <div className="grid grid-cols-2 grid-rows-3 w-full h-full text-[10px] font-black text-white p-2">
                {wheelSegments.map((seg, idx) => <div key={idx} className={`flex items-center justify-center text-center p-1 border border-neutral-800 ${idx % 2 === 0 ? 'bg-neutral-950 text-neutral-300' : 'bg-neutral-900 text-amber-400'}`}><span>{seg.label}</span></div>)}
              </div>
            </div>
            <button type="button" disabled={isSpinning} onClick={handleTriggerSpin} className="absolute z-10 w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-black shadow-2xl border-4 border-black">{isSpinning ? '⏳' : 'دَوّر!'}</button>
          </div>
          {spinOutcome && <div className="p-4 rounded-3xl border bg-neutral-900 border-amber-500/40"><h3 className="text-base font-black text-white">{spinOutcome.label}</h3></div>}
          {currentCustomer && (currentCustomer.rewards || []).length > 0 && (
            <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-3 text-right">
              <h3 className="font-bold text-white border-b border-neutral-800 pb-2">🎁 صندوق جوائزي النشطة ({currentCustomer.rewards.filter(r => !r.isUsed).length}):</h3>
              {currentCustomer.rewards.map((rew, index) => {
                const diffMs = (rew.createdAt + ((rew.validDays || 7) * 86400000)) - Date.now();
                const isExpired = diffMs <= 0;
                const daysLeft = Math.floor(Math.max(0, diffMs) / 86400000);
                return (
                  <div key={rew.id || index} className={`p-3 rounded-2xl border bg-neutral-950 flex justify-between items-center ${rew.isUsed ? 'border-neutral-800 opacity-40' : 'border-amber-500/30'}`}>

                      <button type="button" onClick={() => {

                        db.collection('customers').doc(currentCustomer.phone).set({ rewards: updated }, { merge: true });

                setShowWalkInModal(false); playNotificationSound('cash');
              }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">تسجيل زبون صالة مباشر</h3><button type="button" onClick={() => setShowWalkInModal(false)} className="text-neutral-400">✕</button></div>
                <input required name="wName" placeholder="اسم الزبون" defaultValue="زبون صالة" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
                <select required name="wDev" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-bold">
                  <option value="">-- اختر شاشة متاحة --</option>
                  {devices.filter(d => d.status === 'available').map(d => <option key={d.id} value={d.id}>{d.name} ({d.type})</option>)}
                </select>
                <div className="grid grid-cols-2 gap-2">
                  <select name="wMode" className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-amber-300 font-bold"><option value="single">فردي</option><option value="multi">ملتي (4 دراعات)</option></select>
                  <input name="wControllers" defaultValue="C1, C2" className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-cyan-300 font-mono" />
                </div>
                <button type="submit" className="w-full py-3 bg-amber-500 text-black font-black rounded-xl">بدء تشغيل الشاشة فوراً 🎮</button>
              </form>
            </div>
          )}

          {showExpenseModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">📉 تسجيل مصروف للشفت</h3><button type="button" onClick={() => setShowExpenseModal(false)} className="text-neutral-400">✕</button></div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const t = e.target.eTitle.value.trim(), a = Number(e.target.eAmount.value || 0);
                  if (!t || a <= 0) return;
                  const id = `exp-${Date.now()}`;
                  db.collection('expenses').doc(id).set({ id, title: t, amount: a, shiftId: adminShift, date: todayStr, createdAt: new Date().toISOString() });
                  e.target.reset(); playNotificationSound('click');
                }} className="space-y-2">
                  <input required name="eTitle" placeholder="بند المصروف (شاي، سكر، بضاعة...)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white" />
                  <input required type="number" min={1} name="eAmount" placeholder="المبلغ (ج.م)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-mono text-center" />
                  <button type="submit" className="w-full py-2 bg-rose-600 text-white font-black rounded-xl">+ خصم من الدرج</button>
                </form>
              </div>
            </div>
          )}
          {showShiftReport && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 text-center">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">📊 ملخص الوردية ({adminShift === 'shift_1' ? 'شِفت 1' : 'شِفت 2'})</h3><button type="button" onClick={() => setShowShiftReport(false)} className="text-neutral-400">✕</button></div>
                <div className="p-3 bg-neutral-950 rounded-2xl border border-neutral-800 text-right space-y-1 text-[11px]">
                  <div>💵 كاش الصالة: <strong className="text-emerald-400">{inStoreRevenue} ج.م</strong></div>
                  <div>🌐 الأونلاين: <strong className="text-blue-400">{onlineRevenue} ج.م</strong></div>
                  <div>📉 المصاريف: <strong className="text-rose-400">-{totalExpenses} ج.م</strong></div>
                  <div className="border-t border-neutral-800 pt-1 font-bold text-amber-400">صافي كاش الدرج: {netDrawerCash} ج.م</div>
                </div>
                <a href={`https://wa.me/${config.whatsappNumber}?text=${encodeURIComponent(`📊 تقرير وردية ${config.loungeName} (${adminShift} - ${todayStr}):\n• كاش الصالة: ${inStoreRevenue} ج\n• الأونلاين: ${onlineRevenue} ج\n• المصاريف: ${totalExpenses} ج\n• صافي الدرج: ${netDrawerCash} ج.م`)}`} target="_blank" rel="noopener noreferrer" className="w-full py-2.5 bg-emerald-600 text-white font-black rounded-xl block">📲 إرسال للواتساب</a>
              </div>
            </div>
          )}

          {printableReceipt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-white text-black rounded-3xl p-6 max-w-xs w-full space-y-3">
                <div id="printable-receipt" className="space-y-2 text-center border-b pb-3">
                  <h2 className="font-black text-lg">{config.loungeName}</h2>
                  <p className="text-[10px] text-neutral-600">بون حساب — ت: {config.phone}</p>
                  <div className="text-[10px] text-neutral-500 font-mono">فاتورة #{printableReceipt.ref} | {printableReceipt.date} ({printableReceipt.time})</div>
                  <div className="text-[11px] text-right space-y-1 pt-2 border-t border-dashed">
                    <div>الجهاز: <strong>{printableReceipt.devName}</strong></div>
                    <div>العميل: <strong>{printableReceipt.customerName}</strong></div>
                    <div>المدة: <strong>{printableReceipt.durationMins || 30} دقيقة</strong></div>
                    {printableReceipt.damageFee > 0 && <div className="text-rose-600">غرامة تلف دراع: <strong>+{printableReceipt.damageFee} ج</strong></div>}
                  </div>
                  <div className="text-base font-black pt-2 border-t border-dashed flex justify-between"><span>الإجمالي:</span><span>{printableReceipt.totalCost} ج.م</span></div>
                </div>
                <div className="flex gap-2"><button type="button" onClick={() => window.print()} className="flex-1 py-2 bg-black text-white font-bold rounded-xl">🖨️ طباعة</button><button type="button" onClick={() => setPrintableReceipt(null)} className="flex-1 py-2 bg-neutral-200 text-neutral-800 font-bold rounded-xl">إغلاق</button></div>
              </div>
            </div>
          )}

          {showAdminAIChat && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-neutral-900 border border-amber-500/50 rounded-3xl p-5 max-w-md w-full space-y-3 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <span className="text-amber-400 font-black">🤖 المساعد التنفيذي الذكي للإدارة</span>
                  <button type="button" onClick={() => setShowAdminAIChat(false)} className="text-neutral-400 font-bold">✕</button>
                </div>
                <div className="h-64 overflow-y-auto space-y-2 p-2 bg-neutral-950 rounded-2xl border border-neutral-800 no-scrollbar">
                  {adminAIChatLog.map((c, i) => (
                    <div key={i} className={`p-2.5 rounded-xl text-[11px] leading-relaxed whitespace-pre-line ${c.sender === 'ai' ? 'bg-neutral-900 text-neutral-200 border border-neutral-800' : 'bg-amber-500 text-black font-bold mr-auto'}`}>{c.text}</div>
                  ))}
                  {isAdminAILoading && <div className="p-2 rounded-xl text-[11px] bg-neutral-900 text-amber-400 animate-pulse">⏳ جاري التحليل والتنفيذ...</div>}
                </div>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const q = adminAIQuery.trim();
                  if (!q || isAdminAILoading) return;
                  setAdminAIChatLog(prev => [...prev, { sender: 'user', text: q }]);
                  setAdminAIQuery(''); setIsAdminAILoading(true);
                  try {
                    const res = await fetch(AI_WORKER_URL, {
                      method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ message: `أمر إداري من مدير صالة TWIX: ${q}`, role: 'admin' })
                    });
                    const data = await res.json();
                    setAdminAIChatLog(prev => [...prev, { sender: 'ai', text: data?.reply || 'تم استلام الأمر ومراجعته بدقة!' }]);
                  } catch(err) {
                    setAdminAIChatLog(prev => [...prev, { sender: 'ai', text: `تقرير سريع: كاش الصالة الحالي ${inStoreRevenue}ج، والمصاريف ${totalExpenses}ج، وصافي الدرج ${netDrawerCash}ج.` }]);
                  } finally { setIsAdminAILoading(false); }
                }} className="flex gap-2">
                  <input value={adminAIQuery} onChange={e => setAdminAIQuery(e.target.value)} placeholder="اكتب أمرك للـ AI (مثال: احسب الأرباح، افحص عميل...)" className="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white text-[11px]" />
                  <button type="submit" disabled={isAdminAILoading} className="px-4 py-2 bg-amber-500 text-black font-black rounded-xl">إرسال</button>
                </form>
              </div>
            </div>
          )}

          {viewDocImage && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
              <div className="bg-neutral-900 border border-neutral-700 rounded-3xl p-5 max-w-md w-full space-y-3 text-center">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">معاينة الإيصال</h3><button type="button" onClick={() => setViewDocImage(null)} className="text-neutral-400">✕</button></div>
                <img src={viewDocImage} alt="Document" className="max-h-[65vh] mx-auto rounded-xl object-contain" />
                <button type="button" onClick={() => setViewDocImage(null)} className="w-full py-2 bg-neutral-800 text-white rounded-xl font-bold">إغلاق</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function GamingAIAssistant() {
      const [isOpen, setIsOpen] = useState(false);
      const [aiQuery, setAiQuery] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [chatLog, setChatLog] = useState([
        { sender: 'ai', text: 'أهلاً بك يا بطل في TWIX 🎮 اسألني عن خطط فيفا، بيس، أزرار الذراع، أو كومبوهات مورتال كومبات!' }
      ]);
      return (
        <div className="fixed bottom-4 left-4 z-40 text-xs">
          {!isOpen ? (
            <button type="button" onClick={() => setIsOpen(true)} className="bg-amber-500 hover:bg-amber-400 text-black font-black px-3.5 py-2.5 rounded-full shadow-2xl flex items-center gap-1.5 border-2 border-black">
              <span>🤖</span><span>مساعد البلايستيشن AI</span>
            </button>
          ) : (
            <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-4 w-80 sm:w-96 space-y-3 shadow-2xl">
              <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                <span className="text-amber-400 font-bold">🤖 مساعد الألعاب AI</span>
                <button type="button" onClick={() => setIsOpen(false)} className="text-neutral-400 hover:text-white font-bold">✕</button>
              </div>
              <div className="h-52 overflow-y-auto space-y-2 p-2 bg-neutral-950 rounded-2xl border border-neutral-800 no-scrollbar">
                {chatLog.map((c, i) => <div key={i} className={`p-2.5 rounded-xl text-[11px] leading-relaxed whitespace-pre-line ${c.sender === 'ai' ? 'bg-neutral-900 text-neutral-200 border border-neutral-800' : 'bg-amber-500 text-black font-bold mr-auto'}`}>{c.text}</div>)}
                {isLoading && <div className="p-2 rounded-xl text-[11px] bg-neutral-900 text-amber-400 animate-pulse">⏳ جاري التفكير...</div>}
              </div>
              <form onSubmit={async (e) => {
                e.preventDefault();
                const q = aiQuery.trim(); if (!q || isLoading) return;
                setChatLog(prev => [...prev, { sender: 'user', text: q }]); setAiQuery(''); setIsLoading(true);
                try {
                  const res = await fetch(AI_WORKER_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: q })
                  });
                  const d = await res.json();
                  setChatLog(prev => [...prev, { sender: 'ai', text: d?.reply || '🎮 اسألني عن خطط اللعب وحركات البلايستيشن!' }]);
                } catch(err) {
                  setChatLog(prev => [...prev, { sender: 'ai', text: 'في فيفا: الشوت بدائرة ◯ والباص بإكس ✕، وتمريرة R1+◯ مركونة ساحقة!' }]);
                } finally { setIsLoading(false); }
              }} className="flex gap-1.5">
                <input value={aiQuery} onChange={e => setAiQuery(e.target.value)} placeholder="اسأل عن أي لعبة أو خطة..." className="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-2.5 py-1.5 text-white text-[11px]" />
                <button type="submit" disabled={isLoading} className="px-3 py-1.5 bg-amber-500 text-black font-black rounded-xl">إرسال</button>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
  </script>
</body>
</html>
