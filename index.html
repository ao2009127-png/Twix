    function calcPrice(type, mode, minutes) {
      if (minutes <= 0) return 0;
      const blocks = Math.ceil(minutes / 30);
      const dev = PRICING[type] || PRICING.PS4;
      const m = mode === 'multi' ? dev.multi : dev.single;
      return Math.max(1, blocks) * m.ratePer30;
    }

    function App() {
      const [page, setPage] = useState('home');
      const [mobileMenu, setMobileMenu] = useState(false);
      const [showGoogleModal, setShowGoogleModal] = useState(false);

      const [devices, setDevices] = useState(() => {

        return db.collection('bookings').onSnapshot(snap => {

      useEffect(() => { localStorage.setItem('twix_customer', JSON.stringify(currentCustomer)); }, [currentCustomer]);

      useEffect(() => {
        const timer = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      const toggleHeart = (gameId) => {
        if (userHearts.includes(gameId)) {
          setUserHearts(userHearts.filter(id => id !== gameId));

        } else {

        const freeHoursEarned = Math.floor(totalHours / 24);
        const progressInTier = totalHours % 24;
        const remainingToReward = 24 - progressInTier;

                ))}
              </nav>

            {page === 'games' && <GamesPage games={games} userHearts={userHearts} toggleHeart={toggleHeart} navigate={navigate} />}
            {page === 'devices' && <DevicesPage devices={devices} navigate={navigate} />}
            {page === 'booking' && <BookingPage devices={devices} bookings={bookings} sessions={sessions} currentCustomer={currentCustomer} setPendingBooking={setPendingBooking} navigate={navigate} />}
            {page === 'payment' && <PaymentPage pendingBooking={pendingBooking} bookings={bookings} setBookings={setBookings} navigate={navigate} />}
            {page === 'pricing' && <PricingPage navigate={navigate} />}
            {page === 'reviews' && <ReviewsPage reviews={reviews} setReviews={setReviews} />}
            {page === 'about' && <AboutPage navigate={navigate} />}
            {page === 'contact' && <ContactPage />}
            {page === 'admin' && (

                devices={devices} setDevices={setDevices}

                expenses={expenses} setExpenses={setExpenses}

      return (

          <div className="bg-white text-neutral-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b pb-3">
              <div className="flex items-center gap-2">
                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                <span className="font-bold text-sm text-neutral-600">تسجيل الدخول عبر Google</span>
              </div>

            </div>
            <div className="text-center space-y-1">
              <h3 className="font-bold text-base text-neutral-900">اختر حساباً للمتابعة إلى TWIX</h3>
              <p className="text-xs text-neutral-500">اربط حسابك لتفعيل سكور الساعات وكسب ساعات لعب مجانية</p>
            </div>
            <div className="space-y-2">
              {[
                { email: 'player.twix@gmail.com', name: 'أحمد محمود', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80' },
                { email: 'gamer.pro2026@gmail.com', name: 'كريم الجيمر', avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=150&q=80' }
              ].map((acc, i) => (
                <div key={i} onClick={() => { setCurrentCustomer({ email: acc.email, name: acc.name, avatar: acc.avatar, authProvider: 'google' }); setShowGoogleModal(false); }} className="p-3 border rounded-2xl flex items-center gap-3 cursor-pointer hover:bg-neutral-50 transition-colors">

                </div>
              ))}
            </div>
            <button onClick={() => { const custom = prompt("أدخل بريدك الإلكتروني لـ Google:", "gamer@gmail.com"); if (custom && custom.includes('@')) { setCurrentCustomer({ email: custom.trim().toLowerCase(), name: custom.split('@')[0], avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80', authProvider: 'google' }); setShowGoogleModal(false); } }} className="w-full text-center text-xs text-blue-600 font-bold hover:underline pt-1">استخدام حساب Google آخر...</button>
          </div>
        </div>
      );
    }

    function CustomerAccountPage({ currentCustomer, setCurrentCustomer, bookings, googleScoreStats, navigate, setShowGoogleModal }) {
      const [emailInput, setEmailInput] = useState('');
      const [nameInput, setNameInput] = useState('');

      const handleEmailLogin = (e) => {

    function BookingPage({ devices, bookings, sessions, currentCustomer, setPendingBooking, navigate }) {
      const [name, setName] = useState(currentCustomer ? currentCustomer.name : '');
      const [email, setEmail] = useState(currentCustomer ? currentCustomer.email : '');
      const [phone, setPhone] = useState('');
      const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [time, setTime] = useState('16:00');
      const [policyChecked, setPolicyChecked] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [items, setItems] = useState([{ deviceType: 'PS5', mode: 'single', duration: 60 }]);
      const [snacks, setSnacks] = useState({ indomie: 0, tea: 0, coffee: 0 });

      const updateSnackQty = (id, delta) => setSnacks(prev => ({ ...prev, [id]: Math.max(0, (prev[id] || 0) + delta) }));
      const addItem = () => setItems([...items, { deviceType: 'PS4', mode: 'single', duration: 60 }]);
      const removeItem = (idx) => items.length > 1 && setItems(items.filter((_, i) => i !== idx));
      const updateItem = (idx, field, val) => { const next = [...items]; next[idx][field] = val; setItems(next); setErrorMsg(null); };

      const devicesTotal = items.reduce((sum, itm) => sum + calcPrice(itm.deviceType, itm.mode, itm.duration), 0);
      const snacksTotal = SNACKS_MENU.reduce((sum, s) => sum + (snacks[s.id] * s.price), 0);
      const grandTotal = devicesTotal + snacksTotal;

      const validateCapacity = () => {
        const reqStart = new Date(`${date}T${time}:00`).getTime();
        for (const itm of items) {
          const type = itm.deviceType;
          const totalInLounge = devices.filter(d => d.type === type && d.status !== 'maintenance').length;
          if (totalInLounge === 0) return { valid: false, error: `للأسف جميع أجهزة ${type} في الصيانة حالياً.` };
          
          let bookedCount = 0, latestEndMs = 0;
          bookings.forEach(b => {
            if (b.status === 'rejected' || b.status === 'cancelled' || b.date !== date) return;
            b.items && b.items.forEach(bItem => {
              if (bItem.deviceType === type) {
                const bStart = new Date(`${b.date}T${b.time}:00`).getTime();
                const bEnd = bStart + (bItem.duration * 60 * 1000);
                if (reqStart < bEnd && (reqStart + itm.duration * 60 * 1000) > bStart) { 
                  bookedCount++; 
                  if (bEnd > latestEndMs) latestEndMs = bEnd; 
                }
              }
            });
          });

          const todayStr = new Date().toISOString().slice(0, 10);
          if (date === todayStr) {
            sessions.forEach(s => { if (s.devType === type) bookedCount++; });
          }

          const requestedInOrder = items.filter(x => x.deviceType === type).length;
          if ((bookedCount + requestedInOrder - 1) >= totalInLounge) {
            const nextFree = latestEndMs > 0 ? new Date(latestEndMs).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : 'لاحقاً';
            return { valid: false, error: `عفواً! أجهزة (${type}) مشغولة بالكامل في هذا التوقيت (${totalInLounge} أجهزة). أقرب وقت متاح تقريباً هو الساعة ${nextFree}.` };
          }
        }
        return { valid: true };
      };

      const handleProceed = (e) => {
        e.preventDefault(); setErrorMsg(null);
        if (!name || !phone) return setErrorMsg("يرجى كتابة الاسم ورقم الهاتف.");
        if (!policyChecked) return setErrorMsg("يجب الموافقة الصريحة على شروط وسياسة الحجز.");
        const check = validateCapacity();
        if (!check.valid) return setErrorMsg(check.error);

        const snacksSummaryArr = [];
        SNACKS_MENU.forEach(s => { if (snacks[s.id] > 0) snacksSummaryArr.push(`${s.name} x${snacks[s.id]}`); });

        setPendingBooking({
          id: `bk-${Date.now()}`, ref: `TWIX-${Math.floor(100000 + Math.random() * 900000)}`,
          customerName: name, email: email.trim().toLowerCase(), phone, date, time, items, snacks,
          source: 'online', snacksCost: snacksTotal, devicesCost: devicesTotal, snacksSummary: snacksSummaryArr.join('، '),
          totalCost: grandTotal, status: 'awaiting_payment'
        });
        navigate('payment');
      };

      return (
        <div className="max-w-2xl mx-auto py-8 px-4 space-y-6">
          <div className="text-center space-y-1">
            <h1 className="text-2xl font-black text-white">حجز جلسة لعب في TWIX</h1>
            <p className="text-xs text-neutral-400">حدد أجهزتك ونوع اللعب ومشاريبك وتُقفل الأجهزة فوراً بدون أي تعارض</p>
          </div>
          {errorMsg && <div className="p-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs rounded-2xl">⚠️ {errorMsg}</div>}
          <form onSubmit={handleProceed} className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl space-y-5">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input required value={name} onChange={e => setName(e.target.value)} placeholder="اسم العميل *" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" />
              <input required value={phone} onChange={e => setPhone(e.target.value)} placeholder="رقم الهاتف *" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white text-left" />
              <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="إيميل Google (للسكور)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" />
              <input type="time" value={time} onChange={e => setTime(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" />
            </div>

            <div className="space-y-3 pt-2">
              <div className="flex justify-between items-center"><span className="text-xs font-bold text-amber-400">🎮 الأجهزة ونوع اللعب:</span><button type="button" onClick={addItem} className="text-xs bg-neutral-800 hover:bg-neutral-700 text-amber-400 px-3 py-1 rounded-lg font-bold">+ جهاز إضافي</button></div>
              {items.map((itm, i) => (
                <div key={i} className="p-3 bg-neutral-950 border border-neutral-800 rounded-2xl flex flex-wrap items-center justify-between gap-2">
                  <select value={itm.deviceType} onChange={e => updateItem(i, 'deviceType', e.target.value)} className="bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-xs text-white font-bold">
                    <option value="PS5">PlayStation 5 VIP</option>
                    <option value="PS4">PlayStation 4 Pro</option>
                  </select>
                  <select value={itm.mode} onChange={e => updateItem(i, 'mode', e.target.value)} className="bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-xs text-amber-300 font-bold">
                    <option value="single">فردي (مع صديق - ذراعين)</option>
                    <option value="multi">ملتي (4 ذراعات)</option>
                  </select>
                  <select value={itm.duration} onChange={e => updateItem(i, 'duration', Number(e.target.value))} className="bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-xs text-white">
                    <option value={30}>30 دقيقة</option>
                    <option value={60}>60 دقيقة (ساعة)</option>
                    <option value={90}>90 دقيقة (ساعة ونصف)</option>
                    <option value={120}>120 دقيقة (ساعتان)</option>
                  </select>
                  {items.length > 1 && <button type="button" onClick={() => removeItem(i)} className="text-rose-400 text-xs px-2">حذف</button>}
                </div>
              ))}
            </div>

            <div className="space-y-3 pt-2 border-t border-neutral-800">
              <div className="flex justify-between items-center"><span className="text-xs font-bold text-amber-400">☕ المشاريب والمأكولات (اختياري):</span><span className="text-[11px] text-neutral-400">إجمالي الطلبات: {snacksTotal} ج.م</span></div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {SNACKS_MENU.map(snack => (
                  <div key={snack.id} className="p-3 bg-neutral-950 border border-neutral-800 rounded-2xl flex flex-col justify-between space-y-2">
                    <div className="flex justify-between items-center"><span className="text-xs font-bold text-white">{snack.icon} {snack.name}</span><span className="text-[11px] text-amber-400 font-bold">{snack.price} ج.م</span></div>
                    <div className="flex items-center justify-between bg-neutral-900 rounded-xl p-1 border border-neutral-800">

    // التحقق السري المشفر بدون كتابة الرمز
    const DEFAULT_HASH = "MTQ3MA=="; // Base64 تشفير
    function verifyPass(input) {
      const savedHash = localStorage.getItem('twix_admin_pin_hash') || DEFAULT_HASH;
      try {
        return btoa(input.trim()) === savedHash;
      } catch(e) {
        return false;
      }
    }

      const [authed, setAuthed] = useState(() => sessionStorage.getItem('twix_admin_auth') === 'true');
      const [pin, setPin] = useState('');
      const [error, setError] = useState(false);

      const [showWalkInModal, setShowWalkInModal] = useState(false);
      const [showQuickPOS, setShowQuickPOS] = useState(false);
      const [showExpenseModal, setShowExpenseModal] = useState(false);
      const [receiptData, setReceiptData] = useState(null);

      const [walkInDevice, setWalkInDevice] = useState('');
      const [walkInCustomerName, setWalkInCustomerName] = useState('زبون صالة');
      const [walkInMode, setWalkInMode] = useState('single');
      const [walkInTimerType, setWalkInTimerType] = useState('open');
      const [walkInTargetMins, setWalkInTargetMins] = useState(60);

      const [transferSessionTarget, setTransferSessionTarget] = useState(null);

      if (!authed) {
        return (
          <div className="max-w-sm mx-auto py-16 px-4 space-y-5">
            <div className="w-12 h-12 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto text-amber-400 text-xl font-black">🔒</div>

            <p className="text-xs text-neutral-400 text-center">منطقة مخصصة للإدارة ومسؤولي الصالة فقط</p>
            {error && <div className="p-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center rounded-xl font-bold">الرمز السري غير صحيح، يرجى المحاولة مرة أخرى.</div>}
            <form onSubmit={(e) => { 
              e.preventDefault(); 
              if (verifyPass(pin)) { 
                setAuthed(true); 
                sessionStorage.setItem('twix_admin_auth', 'true'); 
                setError(false); 
              } else { 
                setError(true); 
                setPin(''); 
              } 
            }} className="space-y-4">
              <input type="password" inputMode="numeric" pattern="[0-9]*" required autoFocus value={pin} onChange={e => { setPin(e.target.value); setError(false); }} placeholder="••••" className="w-full bg-neutral-900 border border-neutral-800 rounded-2xl py-3 px-4 text-center text-xl tracking-widest text-white focus:border-amber-500 focus:outline-none" />
              <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl text-sm shadow-lg shadow-amber-500/20">تأكيد الدخول</button>
            </form>
          </div>
        );
      }

      const todayStr = new Date().toISOString().slice(0, 10);
      const totalScreens = devices.length;
      const occupiedScreens = devices.filter(d => d.status === 'busy').length;
      const availableScreens = devices.filter(d => d.status === 'available').length;
      const maintenanceScreens = devices.filter(d => d.status === 'maintenance').length;

      const onlineRevenue = bookings.filter(b => b.status === 'confirmed').reduce((sum, b) => sum + (b.totalCost || 0), 0);
      const inStoreRevenue = completedSales.filter(s => s.source === 'in_store').reduce((sum, s) => sum + (s.totalCost || 0), 0);
      const onlineSnacks = bookings.filter(b => b.status === 'confirmed').reduce((sum, b) => sum + (b.snacksCost || 0), 0);
      const inStoreSnacks = completedSales.reduce((sum, s) => sum + (s.snacksCost || 0), 0);
      const totalSnacksRevenue = onlineSnacks + inStoreSnacks;
      const totalExpenses = expenses.reduce((sum, ex) => sum + ex.amount, 0);
      const netDrawerCash = inStoreRevenue - totalExpenses;

      const handleChangePin = () => {
        const newPin = prompt("أدخل الرمز السري الجديد للإدارة (أرقام فقط):");
        if (newPin && newPin.trim().length >= 4) {
          localStorage.setItem('twix_admin_pin_hash', btoa(newPin.trim()));
          alert("تم تغيير الرمز السري بنجاح وتحديث نظام الأمان!");
        } else if (newPin) {
          alert("الرمز يجب ألا يقل عن 4 أرقام.");
        }
      };

      const handleStartWalkIn = (e) => {
        e.preventDefault();
        const dev = devices.find(d => d.id === walkInDevice);
        if (!dev) return alert("اختر جهازاً متاحاً!");

        const newSession = {
          id: `ses-${Date.now()}`,
          deviceId: dev.id,
          devName: dev.name,
          devType: dev.type,
          customerName: walkInCustomerName || 'زبون صالة',
          mode: walkInMode,
          timerType: walkInTimerType,
          targetMins: Number(walkInTargetMins) || 60,
          startTime: new Date().toISOString(),
          snacks: { indomie: 0, tea: 0, coffee: 0 },
          snacksCost: 0,
          source: 'in_store'
        };

        setSessions([newSession, ...sessions]);
        setDevices(devices.map(d => d.id === dev.id ? { ...d, status: 'busy' } : d));
        setShowWalkInModal(false);
        setWalkInDevice('');
      };

      const addSnackToSession = (sessionId, snackId) => {
        const item = SNACKS_MENU.find(s => s.id === snackId);
        setSessions(sessions.map(s => {
          if (s.id === sessionId) {
            const currentQty = (s.snacks && s.snacks[snackId]) || 0;
            return {
              ...s,
              snacks: { ...(s.snacks || {}), [snackId]: currentQty + 1 },
              snacksCost: (s.snacksCost || 0) + item.price
            };
          }
          return s;
        }));
      };

      const executeTransfer = (fromSession, toDeviceId) => {
        const toDev = devices.find(d => d.id === toDeviceId);
        if (!toDev || toDev.status !== 'available') return alert("الجهاز الجديد غير متاح!");

        setDevices(devices.map(d => {
          if (d.id === fromSession.deviceId) return { ...d, status: 'available' };
          if (d.id === toDev.id) return { ...d, status: 'busy' };
          return d;
        }));

        setSessions(sessions.map(s => {
          if (s.id === fromSession.id) {
            return { ...s, deviceId: toDev.id, devName: toDev.name, devType: toDev.type };
          }
          return s;
        }));

        setTransferSessionTarget(null);
      };

      const endSession = (s, discountRewardHours = 0) => {
        const sec = Math.max(0, Math.floor((now - new Date(s.startTime).getTime()) / 1000));
        const minsBilled = Math.max(1, Math.ceil(sec / 60));
        let timeCost = calcPrice(s.devType, s.mode, minsBilled);
        
        if (discountRewardHours > 0) {
          const hourRate = (PRICING[s.devType] || PRICING.PS4)[s.mode === 'multi' ? 'multi' : 'single'].ratePerHour;
          timeCost = Math.max(0, timeCost - (hourRate * discountRewardHours));
        }

        const snacksCost = s.snacksCost || 0;
        const total = timeCost + snacksCost;

        const saleRecord = {
          id: `sale-${Date.now()}`,
          devName: s.devName,
          devType: s.devType,
          customerName: s.customerName,
          mode: s.mode,
          durationMins: minsBilled,
          timeCost,
          snacks: s.snacks,
          snacksCost,
          totalCost: total,
          source: 'in_store',
          date: todayStr
        };

        setCompletedSales([saleRecord, ...completedSales]);
        setSessions(sessions.filter(x => x.id !== s.id));
        setDevices(devices.map(d => d.id === s.deviceId ? { ...d, status: 'available' } : d));
        setReceiptData(saleRecord);
      };

              <button onClick={() => setShowExpenseModal(true)} className="bg-neutral-800 hover:bg-neutral-700 text-rose-300 font-bold px-3 py-2 rounded-xl border border-rose-500/30">📉 تسجيل مصروف</button>

            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">

              <span className="text-[9px] text-neutral-500">مدفوعات الموقع</span>

            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">

              <span>🎮 الجلسات المباشرة (العداد الحي):</span>
              <span className="text-xs text-amber-400 font-mono">{sessions.length} شاشة تعمل الآن</span>
            </h3>
            {sessions.length === 0 ? <p className="text-neutral-500 py-3 text-center">لا توجد أجهزة قيد التشغيل حالياً.</p> : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {sessions.map(s => {
                  const sec = Math.max(0, Math.floor((now - new Date(s.startTime).getTime()) / 1000));
                  const m = Math.floor(sec / 60), ss = sec % 60;
                  const minsBilled = Math.max(1, Math.ceil(sec / 60));
                  const timeCost = calcPrice(s.devType, s.mode, minsBilled);
                  const isExpired = s.timerType === 'fixed' && minsBilled >= s.targetMins;

                  return (
                    <div key={s.id} className={`p-3.5 bg-neutral-950 border rounded-2xl space-y-2.5 transition-all ${isExpired ? 'border-rose-500 animate-pulse bg-rose-500/5' : 'border-emerald-500/40'}`}>
                      <div className="flex justify-between items-center">
                        <div>
                          <strong className="text-white text-xs block">{s.devName}</strong>
                          <span className="text-[10px] text-neutral-400">{s.customerName} — <strong className="text-amber-400">{s.mode === 'multi' ? 'ملتي (4)' : 'فردي (مع صديق)'}</strong></span>
                        </div>
                        <span className={`font-mono font-black text-sm px-2.5 py-0.5 rounded-lg border ${isExpired ? 'bg-rose-500 text-white border-rose-600' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}`}>
                          {m}:{ss < 10 ? '0' : ''}{ss} {s.timerType === 'fixed' && ` / ${s.targetMins}د`}
                        </span>
                      </div>

                      {isExpired && <div className="text-[10px] bg-rose-500/20 text-rose-300 p-1.5 rounded-lg font-bold text-center">⚠️ انتهى الوقت المحدد للزبون!</div>}

                      <div className="flex justify-between text-neutral-400 text-[11px] border-t border-neutral-900 pt-1.5">
                        <span>وقت: {minsBilled} دقيقة ({timeCost} ج)</span>
                        <span>مشاريب: {s.snacksCost || 0} ج</span>
                      </div>

                      {s.snacks && Object.keys(s.snacks).some(k => s.snacks[k] > 0) && (
                        <div className="bg-neutral-900 p-1.5 rounded-xl text-[10px] text-amber-300 flex flex-wrap gap-2">
                          {s.snacks.indomie > 0 && <span>🍜 إندومي x{s.snacks.indomie}</span>}
                          {s.snacks.tea > 0 && <span>☕ شاي x{s.snacks.tea}</span>}
                          {s.snacks.coffee > 0 && <span>☕ قهوة x{s.snacks.coffee}</span>}
                        </div>
                      )}

                      <div className="flex gap-1.5 pt-1">
                        <button type="button" onClick={() => addSnackToSession(s.id, 'indomie')} className="flex-1 py-1 bg-neutral-900 hover:bg-neutral-800 text-neutral-200 border border-neutral-800 rounded-lg text-[10px] font-bold">+🍜 إندومي (20)</button>
                        <button type="button" onClick={() => addSnackToSession(s.id, 'tea')} className="flex-1 py-1 bg-neutral-900 hover:bg-neutral-800 text-neutral-200 border border-neutral-800 rounded-lg text-[10px] font-bold">+☕ شاي (25)</button>
                        <button type="button" onClick={() => addSnackToSession(s.id, 'coffee')} className="flex-1 py-1 bg-neutral-900 hover:bg-neutral-800 text-neutral-200 border border-neutral-800 rounded-lg text-[10px] font-bold">+☕ قهوة (50)</button>
                      </div>

                      <div className="flex items-center justify-between pt-1 gap-2">
                        <button onClick={() => setTransferSessionTarget(s)} className="py-1 px-2.5 bg-neutral-800 hover:bg-neutral-700 text-amber-300 rounded-lg text-[10px] font-bold">🔄 نقل جهاز</button>
                        <button onClick={() => endSession(s, 1)} className="py-1 px-2.5 bg-neutral-800 hover:bg-neutral-700 text-emerald-300 rounded-lg text-[10px] font-bold">🎁 خصم ساعة جوجل</button>
                        <button onClick={() => endSession(s, 0)} className="py-1 px-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-xs">إنهاء وبون</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-3">
            <h3 className="font-bold text-white text-sm">حجوزات الموقع الإلكتروني ({bookings.length}):</h3>
            {bookings.length === 0 ? <p className="text-neutral-500 py-2">لا توجد حجوزات أونلاين حتى الآن.</p> : (
              <div className="space-y-2">{bookings.map(b => (
                <div key={b.id} className="p-3 bg-neutral-950 rounded-2xl flex flex-col sm:flex-row justify-between sm:items-center gap-2 border border-neutral-800">
                  <div>
                    <span className="font-bold text-amber-400 font-mono">{b.ref}</span> — <span className="text-white font-bold">{b.customerName}</span> ({b.phone})
                    <div className="text-[10px] text-neutral-400">{b.date} الساعة {b.time} — المبلغ: {b.totalCost} ج.م</div>
                    {b.snacksSummary && <div className="text-[10px] text-amber-300">مشاريب: {b.snacksSummary}</div>}
                  </div>
                  <div className="flex items-center gap-2">
                    <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${b.status === 'confirmed' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>{b.status === 'confirmed' ? 'مؤكد ✅' : b.status}</span>
                    {b.status !== 'confirmed' && <button onClick={() => setBookings(bookings.map(x => x.id === b.id ? { ...x, status: 'confirmed' } : x))} className="px-2.5 py-1 bg-emerald-500 text-black font-bold rounded text-[10px]">تأكيد</button>}
                    {b.status !== 'rejected' && <button onClick={() => setBookings(bookings.map(x => x.id === b.id ? { ...x, status: 'rejected' } : x))} className="px-2 py-1 bg-rose-500/20 text-rose-400 rounded text-[10px]">رفض</button>}
                  </div>
                </div>
              ))}</div>
            )}
          </div>

          {showWalkInModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <form onSubmit={handleStartWalkIn} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white text-sm">تسجيل زبون بالصالة (Walk-in)</h3><button type="button" onClick={() => setShowWalkInModal(false)} className="text-neutral-400 hover:text-white font-bold">✕</button></div>
                <div className="space-y-3">
                  <input value={walkInCustomerName} onChange={e => setWalkInCustomerName(e.target.value)} placeholder="اسم الزبون" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" />
                  <select required value={walkInDevice} onChange={e => setWalkInDevice(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white font-bold">
                    <option value="">-- اختر جهازاً متاحاً للتشغيل --</option>
                    {devices.filter(d => d.status === 'available').map(d => (<option key={d.id} value={d.id}>{d.name} ({d.type})</option>))}
                  </select>
                  <div className="grid grid-cols-2 gap-2">
                    <select value={walkInMode} onChange={e => setWalkInMode(e.target.value)} className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-xs text-amber-300 font-bold"><option value="single">فردي (مع صديق - ذراعين)</option><option value="multi">ملتي (4 ذراعات)</option></select>
                    <select value={walkInTimerType} onChange={e => setWalkInTimerType(e.target.value)} className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-xs text-white"><option value="open">وقت مفتوح</option><option value="fixed">وقت محدد</option></select>
                  </div>
                  {walkInTimerType === 'fixed' && (
                    <div><label className="text-[10px] text-neutral-400 block mb-1">المدة المحددة بالدقائق:</label><input type="number" min={15} step={15} value={walkInTargetMins} onChange={e => setWalkInTargetMins(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" /></div>
                  )}
                </div>
                <button type="submit" className="w-full py-3 bg-amber-500 text-black font-black rounded-xl text-xs">بدء تشغيل الجهاز وإشغاله فوراً</button>
              </form>
            </div>
          )}

          {showQuickPOS && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white text-sm">بيع كافتيريا سريع (كاش صالة)</h3><button onClick={() => setShowQuickPOS(false)} className="text-neutral-400 hover:text-white font-bold">✕</button></div>
                <div className="space-y-2">{SNACKS_MENU.map(snack => (
                  <button key={snack.id} onClick={() => {
                    setCompletedSales([{ id: `sale-${Date.now()}`, devName: 'كافتيريا خارجية', devType: '-', customerName: 'زبون طاولة', mode: '-', durationMins: 0, timeCost: 0, snacks: { [snack.id]: 1 }, snacksCost: snack.price, totalCost: snack.price, source: 'in_store', date: todayStr }, ...completedSales]);
                    setShowQuickPOS(false);
                    alert(`تم تسجيل بيع [${snack.name}] بـ ${snack.price} ج.م في كاش الصالة!`);
                  }} className="w-full p-3 bg-neutral-950 hover:bg-neutral-800 border border-neutral-800 rounded-xl flex justify-between items-center text-xs text-white">
                    <span>{snack.icon} {snack.name}</span><strong className="text-amber-400">{snack.price} ج.م</strong>
                  </button>
                ))}</div>
              </div>
            </div>
          )}

          {showExpenseModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <form onSubmit={(e) => {
                e.preventDefault();
                const title = e.target.title.value.trim();
                const amount = Number(e.target.amount.value);
                if (title && amount > 0) {
                  setExpenses([{ id: `exp-${Date.now()}`, title, amount, date: todayStr }, ...expenses]);
                  setShowExpenseModal(false);
                }
              }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white text-sm">تسجيل مصروف جديد من الدرج</h3><button type="button" onClick={() => setShowExpenseModal(false)} className="text-neutral-400 hover:text-white font-bold">✕</button></div>
                <input required name="title" placeholder="بند الصرف (مثال: شراء شاي وسكر / بضاعة)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" />
                <input required type="number" min={1} name="amount" placeholder="المبلغ بالجنيه" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" />
                <button type="submit" className="w-full py-2.5 bg-rose-600 text-white font-bold rounded-xl text-xs">خصم من الدرج فوراً</button>
              </form>
            </div>
          )}

          {transferSessionTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white text-sm">نقل الجلسة لشاشة أخرى</h3><button onClick={() => setTransferSessionTarget(null)} className="text-neutral-400 hover:text-white font-bold">✕</button></div>
                <p className="text-neutral-400 text-xs">نقل جلسة: <strong className="text-white">{transferSessionTarget.devName}</strong> مع كامل وقتها ومشاريبها.</p>
                <div className="space-y-2">{devices.filter(d => d.status === 'available').map(d => (
                  <button key={d.id} onClick={() => executeTransfer(transferSessionTarget, d.id)} className="w-full p-2.5 bg-neutral-950 hover:bg-neutral-800 border border-neutral-800 rounded-xl text-right text-xs text-amber-300 font-bold block">
                    ➔ نقل إلى: {d.name}
                  </button>
                ))}</div>
              </div>
            </div>
          )}

          {receiptData && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-white text-black rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                <div id="printable-receipt" className="space-y-3 text-center border-b pb-4">
                  <h2 className="font-black text-xl">TWIX Gaming Lounge</h2>
                  <p className="text-xs text-neutral-600">فاتورة حساب جلسة صالة</p>
                  <div className="text-xs text-right space-y-1 pt-2 border-t border-dashed">
                    <div>الجهاز: <strong>{receiptData.devName}</strong></div>
                    <div>العميل: <strong>{receiptData.customerName}</strong></div>
                    <div>نوع اللعب: <strong>{receiptData.mode === 'multi' ? 'ملتي (4 ذراعات)' : 'فردي (مع صديق)'}</strong></div>
                    <div>مدة اللعب: <strong>{receiptData.durationMins} دقيقة</strong> ({receiptData.timeCost} ج)</div>
                    {receiptData.snacksCost > 0 && <div>المشاريب والكافتيريا: <strong>{receiptData.snacksCost} ج</strong></div>}
                  </div>
                  <div className="text-lg font-black pt-2 border-t border-dashed flex justify-between">
                    <span>الإجمالي المستحق:</span>
                    <span>{receiptData.totalCost} ج.م</span>
                  </div>
                  <p className="text-[10px] text-neutral-500 pt-1">شكراً لزيارتكم TWIX! نتمنى لكم يوماً سعيداً 🎮</p>
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => window.print()} className="flex-1 py-2.5 bg-black text-white font-bold rounded-xl text-xs">🖨️ طباعة البون</button>
                  <button onClick={() => setReceiptData(null)} className="flex-1 py-2.5 bg-neutral-200 text-neutral-800 font-bold rounded-xl text-xs">إغلاق</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
