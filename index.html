    // 15. صفحة حساب العميل والمحفظة (AccountPage)
    // ==========================================
    function AccountPage({ currentCustomer, setCurrentCustomer, bookings, navigate, now }) {
      const [loginPhone, setLoginPhone] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [signupName, setSignupName] = useState('');
      const [signupPhone, setSignupPhone] = useState('');
      const [signupPass, setSignupPass] = useState('');
      const [signupBirthDate, setSignupBirthDate] = useState('');
      const [signupIdCardImage, setSignupIdCardImage] = useState(null);
      const [signupAvatar, setSignupAvatar] = useState(null);
      const [signupReferral, setSignupReferral] = useState('');
      
      const [isSignupMode, setIsSignupMode] = useState(false);
      const [isPendingReview, setIsPendingReview] = useState(false);
      const [showTopupModal, setShowTopupModal] = useState(false);
      const [topupAmount, setTopupAmount] = useState(50);
      const [topupSenderPhone, setTopupSenderPhone] = useState('');
      const [topupSenderName, setTopupSenderName] = useState('');
      const [topupReceipt, setTopupReceipt] = useState(null);

      // تعديل بيانات العميل الشخصية (الاسم والرقم السري فقط)
      const [editName, setEditName] = useState('');
      const [editPass, setEditPass] = useState('');
      const [showEditProfile, setShowEditProfile] = useState(false);

      // تسجيل الدخول بالهاتف والباسوورد
      const handleCustomerLogin = (e) => {
        e.preventDefault();
        if (!validateEgyptianPhone(loginPhone)) {
          return alert('يرجى كتابة رقم هاتف مصري صحيح (010, 011, 012, 015).');
        }

        db.collection('customers').doc(loginPhone.trim()).get().then(doc => {
          if (!doc.exists) {
            return alert('هذا الرقم غير مسجل لدينا! يرجى إنشاء حساب جديد أولاً.');
          }
          const cData = doc.data();
          if (cData.status === 'banned') {
            return alert('عفواً، تم حظر هذا الحساب لمخالفة لوائح الصالة.');
          }
          if (cData.status === 'pending_approval') {
            setIsPendingReview(true);
            return;
          }
          if (cData.password && cData.password !== loginPass.trim()) {
            return alert('الرقم السري غير صحيح، يرجى المحاولة مرة أخرى.');
          }

          setCurrentCustomer(cData);
          localStorage.setItem('twix_customer', JSON.stringify(cData));
          playNotificationSound('cash');
        }).catch(() => {
          alert('تعذر الاتصال بالسحابة حالياً، يرجى المحاولة مجدداً.');
        });
      };

      // إنشاء حساب جديد مع الفحص الصارم للاسم وبصمة الجهاز
      const handleCustomerSignup = async (e) => {
        e.preventDefault();
        const trimmedName = signupName.trim();
        const trimmedPhone = signupPhone.trim();

        if (trimmedName.split(/\s+/).length < 2) {
          return alert('يرجى كتابة اسمك واسم والدك ثنائياً على الأقل.');
        }
        if (!validateEgyptianPhone(trimmedPhone)) {
          return alert('يرجى كتابة رقم هاتف مصري صحيح مكون من 11 رقماً.');
        }
        if (!signupPass.trim() || signupPass.trim().length < 4) {
          return alert('يرجى كتابة رقم سري لحسابك لا يقل عن 4 أرقام/حروف.');
        }

        const fp = getDeviceFingerprint();
        const deviceRegisteredKey = `twix_device_account_${fp}`;
        const previousPhone = localStorage.getItem(deviceRegisteredKey);

        // منع تكرار إنشاء حسابات متعددة لنفس الجهاز لمحاربة الحسابات الوهمية
        if (previousPhone && previousPhone !== trimmedPhone) {
          return alert('تنبيه أمان: تم تسجيل حساب مسبقاً من هذا الهاتف. يسمح بحساب واحد فقط لكل هاتف لمنع استغلال أكواد الإحالة.');
        }

        // فحص فريد للاسم في قاعدة البيانات السحابية لمنع تشابه وتكرار الأسماء
        try {
          const nameCheck = await db.collection('customers').where('name', '==', trimmedName).get();
          if (!nameCheck.empty) {
            return alert('عفواً! هذا الاسم مستخدم مسبقاً من قِبل عميل آخر. يرجى كتابة اسمك الثلاثي أو إضافة لقبك لتفادي تشابه الأسماء.');
          }
        } catch(err) {}

        let initialBonus = 0;
        if (signupReferral.trim()) {
          const usedRefKey = `twix_ref_used_${fp}`;
          if (!localStorage.getItem(usedRefKey)) {
            initialBonus = 5; // مكافأة 5 جنيه رصيد ترحيبي
            localStorage.setItem(usedRefKey, 'true');
          }
        }

        const newCustomerData = {
          name: trimmedName,
          phone: trimmedPhone,
          email: `${trimmedPhone}@twix.local`,
          password: signupPass.trim(),
          birthDate: signupBirthDate || '',
          idCardImage: signupIdCardImage || null,
          avatarUrl: signupAvatar || null,
          walletBalance: initialBonus,
          xp: 50,
          hoursPlayed: 0,
          rewards: [],
          myReferralCode: `TX-${trimmedPhone.slice(-4)}`,
          status: 'pending_approval', // تحت المراجعة من 5 لـ 30 دقيقة
          createdAt: new Date().toISOString()
        };

        db.collection('customers').doc(trimmedPhone).set(newCustomerData).then(() => {
          localStorage.setItem(deviceRegisteredKey, trimmedPhone);
          setIsPendingReview(true);
          playNotificationSound('cash');
        }).catch(() => {
          localStorage.setItem(deviceRegisteredKey, trimmedPhone);
          setIsPendingReview(true);
        });
      };

      // إرسال طلب شحن رصيد المحفظة للأدمن
      const handleTopupSubmit = (e) => {
        e.preventDefault();
        if (!topupReceipt) return alert('يرجى إرفاق سكرين شوت إيصال التحويل لمطابقته!');
        if (!validateEgyptianPhone(topupSenderPhone)) return alert('اكتب رقم المحفظة المحول منها بصيغة مصرية صحيحة.');

        const req = {
          id: `top-${Date.now()}`,
          customerName: currentCustomer.name,
          customerPhone: currentCustomer.phone,
          amount: Number(topupAmount),
          senderPhone: topupSenderPhone.trim(),
          senderName: topupSenderName.trim() || currentCustomer.name,
          receiptImage: topupReceipt,
          status: 'pending',
          createdAt: new Date().toISOString()
        };

        db.collection('wallet_requests').doc(req.id).set(req).then(() => {
          setShowTopupModal(false);
          setTopupReceipt(null);
          playNotificationSound('cash');
          alert('تم إرسال طلب شحن المحفظة للإدارة بنجاح! سيتم مراجعة الإيصال وإيداع الرصيد في محفظتك فوراً.');
        });
      };

      // شاشة انتظار مراجعة الحساب من الإدارة
      if (isPendingReview) {
        return (
          <div className="max-w-md mx-auto py-12 px-4 text-center space-y-4">
            <div className="w-16 h-16 bg-amber-500/20 border-2 border-amber-500 rounded-3xl flex items-center justify-center mx-auto text-3xl">⏳</div>
            <h2 className="text-xl font-black text-white">حسابك حالياً قيد المراجعة والتفعيل</h2>
            <p className="text-xs text-neutral-300 leading-relaxed bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">
              تم استلام بيانات تسجيلك بنجاح! يتم حالياً مراجعة وتأكيد الحساب ومطابقة بيانات الهوية من قِبل إدارة صالة TWIX (يستغرق ذلك عادة من 5 دقائق إلى 30 دقيقة كحد أقصى). يمكنك فتح الموقع لاحقاً برقم هاتفك وباسوردك فور التفعيل!
            </p>
            <button onClick={() => { setIsPendingReview(false); navigate('home'); }} className="px-6 py-2.5 bg-amber-500 text-black font-black rounded-xl text-xs shadow">
              الرجوع للرئيسية كزائر
            </button>
          </div>
        );
     // واجهة تسجيل الدخول أو إنشاء حساب جديد للزائر
      if (!currentCustomer) {
        return (
          <div className="max-w-md mx-auto py-8 space-y-5 text-xs">
            <div className="text-center space-y-1">
              <div className="w-12 h-12 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto text-amber-400 text-xl font-black">
                👤
              </div>
              <h1 className="text-xl font-black text-white">
                {isSignupMode ? 'إنشاء حساب لاعب جديد' : 'تسجيل الدخول ومحفظة TWIX'}
              </h1>
              <p className="text-neutral-400 text-[11px]">
                {isSignupMode ? 'سجل بياناتك الحقيقية لفتح محفظتك ونظام الرتب وهدايا الأعياد' : 'أدخل رقم هاتفك وباسوردك للدخول لمحفظتك وحجوزاتك'}

            <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl space-y-4 shadow-2xl">

                    </div>
                    <div>
                      <label className="text-[10px] text-neutral-400 block mb-1">صورة البطاقة/شهادة الميلاد (اختياري):</label>
                      <input 
                        type="file" 
                        accept="image/*" 
                        onChange={async (e) => {
                          if (e.target.files[0]) setSignupIdCardImage(await compressImageFile(e.target.files[0]));
                        }} 
                        className="w-full text-neutral-400 bg-neutral-950 p-1 rounded-xl border border-neutral-800 text-[10px] file:py-0.5 file:px-2 file:rounded file:border-0 file:bg-neutral-800 file:text-amber-400" 
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-[10px] text-neutral-400 block mb-1">كود الإحالة (إن دعاك صاحبك للحصول على 5ج):</label>
                    <input 
                      value={signupReferral} 
                      onChange={e => setSignupReferral(e.target.value)} 
                      placeholder="TX-XXXX (مسموح مرة واحدة للجهاز)" 
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-amber-300 font-mono uppercase text-left focus:border-amber-500 outline-none" 
                    />
                  </div>
                  <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl text-xs shadow-lg active:scale-95 transition-all">
                    إرسال طلب إنشاء الحساب للمراجعة ➔
                  </button>
                </form>
              )}

              <div className="pt-2 text-center border-t border-neutral-800">
                <button 
                  type="button" 
                  onClick={() => navigate('home')} 
                  className="text-neutral-400 hover:text-white text-[11px] underline">
                  المتابعة كزائر بدون تسجيل حساب الآن
                </button>
              </div>
            </div>
          </div>
        );
      }

      // حساب رتبة وسكور العميل المسجل وهدية الـ 24 ساعة
      const myLevelData = calculateInfiniteLevel(currentCustomer.xp || 50, currentCustomer.hoursPlayed || 0);

      return (
        <div className="max-w-4xl mx-auto py-6 space-y-6 text-xs">
          {/* كارت البروفايل والرتبة والمحفظة */}
          <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-4 text-center md:text-right">
              <div className="w-16 h-16 rounded-2xl bg-amber-500/20 border-2 border-amber-500/40 text-amber-400 flex items-center justify-center text-3xl font-black overflow-hidden shadow">
                {currentCustomer.avatarUrl ? (
                  <img src={currentCustomer.avatarUrl} alt="Avatar" className="w-full h-full object-cover" />
                ) : (
                  myLevelData.badge
                )}
              </div>
              <div>
                <h2 className="text-lg font-black text-white">{currentCustomer.name}</h2>
                <span className="text-[11px] text-neutral-400 font-mono block">{currentCustomer.phone}</span>
                <div className="flex flex-wrap items-center gap-2 mt-1">
                  <span className={`px-2.5 py-0.5 rounded-full font-black text-[10px] bg-black/60 border border-neutral-800 ${myLevelData.color}`}>
                    Level {myLevelData.level} — {myLevelData.title}
                  </span>
                  <span className="text-[10px] font-black px-2.5 py-0.5 rounded-full bg-amber-500 text-black font-mono">
                    💰 محفظتك: {currentCustomer.walletBalance || 0} ج.م
                  </span>
                </div>
              </div>
            </div>

            <div className="flex flex-wrap gap-2">
              <button 
                type="button" 
                onClick={() => setShowTopupModal(true)} 
                className="px-3.5 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-xl shadow active:scale-95 transition-all">
                ➕ اشحن رصيدك
              </button>
              <button 
                type="button" 
                onClick={() => {
                  setEditName(currentCustomer.name);
                  setEditPass(currentCustomer.password || '');
                  setShowEditProfile(true);
                }} 
                className="px-3.5 py-2 bg-neutral-800 hover:bg-neutral-700 text-amber-300 rounded-xl border border-neutral-700 font-bold">
                ✏️ تعديل بياناتي
              </button>
              <button 
                type="button" 
                onClick={() => {
                  setCurrentCustomer(null);
                  localStorage.removeItem('twix_customer');
                  navigate('home');
                }} 
                className="px-3 py-2 bg-neutral-950 text-neutral-400 hover:text-white rounded-xl border border-neutral-800">
                خروج
              </button>
            </div>
          </div>

          {/* شريط تقدم ساعات اللعب وهدية الـ 24 ساعة لعب (نصف ساعة مجانية PS4) */}
          <div className="p-4 bg-neutral-900 border border-neutral-800 rounded-3xl space-y-2 shadow">
            <div className="flex justify-between items-center text-[11px]">
              <strong className="text-white">🚀 مسار هدية الـ 24 ساعة لعب (نصف ساعة PS4 مجاناً):</strong>
              <span className="text-amber-400 font-mono font-bold">{currentCustomer.hoursPlayed || 0} / 24 ساعة</span>
            </div>
            <div className="w-full h-3 bg-neutral-950 rounded-full border border-neutral-800 overflow-hidden">
              <div 
                className="h-full bg-gradient-to-r from-amber-500 to-emerald-400 transition-all duration-500" 
                style={{ width: `${Math.min(100, ((currentCustomer.hoursPlayed || 0) / 24) * 100)}%` }}
              />
            </div>
            <span className="text-[10px] text-neutral-400 block">
              {myLevelData.eligibleFor24hReward 
                ? '🎉 مبروك! حققت 24 ساعة لعب في TWIX، تواصل مع كابتن الصالة لاستلام نصف ساعتك المجانية فوراً!' 
                : `العب ${Math.max(0, 24 - (currentCustomer.hoursPlayed || 0))} ساعات إضافية لفتح نصف ساعة مجانية على PlayStation 4.`}
            </span>
          </div>

          {/* كود الإحالة للمشاركة */}
          <div className="p-4 bg-gradient-to-r from-amber-500/15 via-neutral-900 to-amber-500/10 border border-amber-500/30 rounded-3xl flex justify-between items-center shadow">
            <div>
              <strong className="text-white text-xs block">🎁 كود الإحالة الخاص بك: <span className="text-amber-400 font-mono text-sm">{currentCustomer.myReferralCode || 'TX-VIP'}</span></strong>
              <span className="text-[10px] text-neutral-400">شاركه مع أصحابك ليكسب كل منكما 5 جنيه رصيد ترحيبي في المحفظة!</span>
            </div>
            <button 
              type="button" 
              onClick={() => {
                navigator.clipboard.writeText(currentCustomer.myReferralCode || 'TX-VIP');
                alert('تم نسخ كود الإحالة الخاص بك بنجاح!');
              }} 
              className="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white rounded-xl text-[11px] font-bold border border-neutral-700">
              📋 نسخ الكود
            </button>
          </div>

          {/* نافذة شحن الرصيد المباشرة */}
          {showTopupModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <form onSubmit={handleTopupSubmit} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3.5 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <h3 className="font-bold text-white text-sm">➕ طلب شحن رصيد بمحفظة TWIX</h3>
                  <button type="button" onClick={() => setShowTopupModal(false)} className="text-neutral-400 hover:text-white font-bold">✕</button>
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">المبلغ المراد شحنه (ج.م):</label>
                  <input 
                    type="number" 
                    min={20} 
                    required 
                    value={topupAmount} 
                    onChange={e => setTopupAmount(e.target.value)} 
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-bold text-center font-mono focus:border-amber-500 outline-none" 
                  />
                </div>
                <div className="bg-neutral-950 p-2.5 rounded-xl border border-neutral-800 text-center space-y-1">
                  <span className="text-[10px] text-neutral-400 block">قم بتحويل المبلغ لرقم المحفظة الرسمي للصالة:</span>
                  <strong className="text-amber-400 font-mono text-sm block">{config.phone}</strong>
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">رقم المحفظة التي قمت بالتحويل منها *:</label>
                  <input 
                    required 
                    type="tel" 
                    value={topupSenderPhone} 
                    onChange={e => setTopupSenderPhone(e.target.value)} 
                    placeholder="01xxxxxxxxx" 
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-mono text-left focus:border-amber-500 outline-none" 
                  />
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">التحويل باسم مين؟ (اسم صاحب المحفظة) *:</label>
                  <input 
                    required 
                    value={topupSenderName} 
                    onChange={e => setTopupSenderName(e.target.value)} 
                    placeholder="اسم صاحب المحفظة" 
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white focus:border-amber-500 outline-none" 
                  />
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">إرفاق سكرين شوت التحويل 📸 *:</label>
                  <input 
                    type="file" 
                    accept="image/*" 
                    required 
                    onChange={async (e) => {
                      if (e.target.files[0]) setTopupReceipt(await compressImageFile(e.target.files[0]));
                    }} 
                    className="w-full bg-neutral-950 p-1.5 rounded-xl border border-neutral-800 text-neutral-400 text-[11px] file:py-0.5 file:px-2 file:rounded file:border-0 file:bg-neutral-800 file:text-amber-400" 
                  />
                  {topupReceipt && <img src={topupReceipt} alt="Topup" className="max-h-20 mx-auto rounded-lg border border-emerald-500/50 mt-1" />}
                </div>
                <button type="submit" className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-xl shadow active:scale-95 transition-all">
                  إرسال طلب الشحن للإدارة ➔
                </button>
              </form>
            </div>
          )}
        </div>
      );
                      }
