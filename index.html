function MemoriesPage({ memories, currentCustomer }) {
const [caption, setCaption] = useState(''); const [photo, setPhoto] = useState(null); const [busy, setBusy] = useState(false);
const handleShareMemory = (e) => {
e.preventDefault(); if (busy) return; if (!photo) return alert('اختر صورة تذكارية أولاً!'); if (hasLocalProfanity(caption)) return alert('⚠️ ممنوع استخدام ألفاظ غير لائقة!');
setBusy(true);
const item = { id: "mem-" + Date.now(), author: currentCustomer?.name || 'لاعب بالصالة', authorPhone: currentCustomer?.phone || '', verified: !!currentCustomer, caption: caption.trim() || 'لحظة حماسية في TWIX 🎮', image: photo, moderated: false, date: getCairoDateStr(), createdAt: new Date().toISOString() };
db.collection('memories').doc(item.id).set(item).then(() => { setCaption(''); setPhoto(null); setBusy(false); playNotificationSound('cash'); alert('تم نشر الذكرى في أرشيف الصالة بنجاح!'); }).catch(() => { setBusy(false); alert('حدث خطأ أثناء النشر.'); });
};
return (
<div className="max-w-3xl mx-auto py-6 space-y-6 text-xs">
<div className="text-center space-y-1"><h1 className="text-2xl font-black text-white">📸 نادي الذكريات وأرشيف الصالة</h1><p className="text-neutral-400">مراقب بالذكاء الاصطناعي لحذف أي صور أو كلمات غير لائقة تلقائياً 🛡️</p></div>
<form onSubmit={handleShareMemory} className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-3">
<input value={caption} onChange={e => setCaption(e.target.value)} placeholder="اكتب تعليقاً..." className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
<FilePickerButton onPick={setPhoto} label={photo ? '🔄 تغيير الصورة التذكارية' : '📸 اختيار صورة تذكارية'} />
{photo && <div className="relative w-fit mx-auto"><img src={photo} alt="Preview" className="max-h-40 rounded-xl border border-amber-500/40" /><button type="button" onClick={() => setPhoto(null)} className="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full w-6 h-6 text-xs font-black">✕</button></div>}
<button disabled={busy} type="submit" className="w-full py-2.5 bg-amber-500 text-black font-black rounded-xl">{busy ? 'جاري النشر...' : 'نشر في أرشيف الصالة 📸'}</button>
</form>
{memories.length === 0 ? <p className="text-center text-neutral-500 py-8 bg-neutral-900 rounded-3xl border border-neutral-800">لا توجد صور منشورة بعد.</p> : (
<div className="grid grid-cols-1 sm:grid-cols-2 gap-4">{memories.map(m => (<div key={m.id} className="bg-neutral-900 border border-neutral-800 rounded-3xl overflow-hidden"><img src={m.image} alt="Memory" className="w-full h-52 object-cover" /><div className="p-3 space-y-1"><strong className="text-amber-400 block">{m.author} {m.verified && <span className="text-emerald-400 text-[10px]">✓</span>}</strong><p className="text-neutral-200">{m.caption}</p><span className="text-[10px] text-neutral-500 font-mono">{m.date}</span></div></div>))}</div>
)}
</div>
);
}
