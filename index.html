    function playNotificationSound(type = 'click') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);

        if (type === 'click') {
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.04);
          osc.start(); osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'cash') {
          osc.frequency.setValueAtTime(987, ctx.currentTime);
          osc.frequency.setValueAtTime(1318, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start(); osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'alert') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.setValueAtTime(330, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(); osc.stop(ctx.currentTime + 0.3);
        }
      } catch(e) {}
    }

    function compressImageFile(file, maxDimension = 700) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h && w > maxDimension) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
            else if (h > maxDimension) { w = Math.round((w * maxDimension) / h); h = maxDimension; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function calcDevicePrice(type, mode, minutes) {
      if (!minutes || minutes <= 0) return 0;
      const dev = PRICING[type] || PRICING.PS4;
      const rate = mode === 'multi' ? dev.multi : dev.single;
      const blocks = Math.ceil(minutes / 30);
      return Math.max(1, blocks) * rate.per30;
    }

    function calculateInfiniteLevel(xp = 0, totalHoursPlayed = 0) {
      const level = Math.floor(Math.sqrt(Math.max(0, xp) / 25)) + 1;
      let title = "مبتدئ (Rookie Gamer)";
      let badge = "🥉";
      let color = "text-neutral-400";

      if (level >= 100) { title = "أسطورة TWIX المطلقة (TWIX Deity)"; badge = "👑"; color = "text-amber-400"; }
      else if (level >= 50) { title = "بطل ما وراء الطبيعة (Mythic Master)"; badge = "💎"; color = "text-cyan-400"; }
      else if (level >= 25) { title = "محترف الصالة (Gold Elite)"; badge = "🥇"; color = "text-amber-300"; }
      else if (level >= 10) { title = "مقاتل فضي (Silver Striker)"; badge = "🥈"; color = "text-slate-300"; }

      // فحص هدية الـ 24 ساعة لعب (نصف ساعة مجانية PS4)
      const eligibleFor24hReward = totalHoursPlayed >= 24;

      return { level, title, badge, color, nextLvlXP: Math.pow(level, 2) * 25, eligibleFor24hReward };
    }

              <button onClick={() => navigate('challenges')} className="bg-neutral-900 hover:bg-neutral-800 text-cyan-400 font-bold px-5 py-3.5 rounded-2xl text-xs sm:text-sm border border-cyan-500/30">

              <button onClick={() => navigate('parties')} className="bg-neutral-900 hover:bg-neutral-800 text-pink-400 font-bold px-5 py-3.5 rounded-2xl text-xs sm:text-sm border border-pink-500/30">

            <div className="flex items-center gap-4 text-center md:text-right">

                <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-black">

                </h3>
                <span className="text-xs text-neutral-400 block mt-0.5">

                </span>

            <div className="text-center md:text-left space-y-1.5">
              <span className="text-[11px] text-amber-300 block font-bold">

              <button 
                onClick={() => navigate('challenges')}

          {/* كروت المزايا الأربعة الأساسية للصالة */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl space-y-1 shadow">
              <span className="text-2xl block">⚡</span>
              <h3 className="font-bold text-white text-xs">شاشات 120Hz الأصلية VIP</h3>
              <p className="text-[11px] text-neutral-400">أعلى استجابة وسلاسة لمباريات FIFA وeFootball بدون أي لاج.</p>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl space-y-1 shadow">
              <span className="text-2xl block">💳</span>
              <h3 className="font-bold text-white text-xs">الدفع الهجين ومحفظة الكاش</h3>
              <p className="text-[11px] text-neutral-400">ادفع برصيد محفظتك وكمل الباقي فودافون كاش بكل مرونة وسلاسة.</p>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl space-y-1 shadow">
              <span className="text-2xl block">🛎️</span>
              <h3 className="font-bold text-white text-xs">خدمة كرسيك المتكاملة</h3>
              <p className="text-[11px] text-neutral-400">اطلب إندومي، شاحن موبايل، أو استبدال دراع صامت وأنت في مكانك.</p>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl space-y-1 shadow">
              <span className="text-2xl block">🚀</span>
              <h3 className="font-bold text-white text-xs">نظام الرتب وهدية الـ 24 ساعة</h3>
              <p className="text-[11px] text-neutral-400">كل 24 ساعة لعب تمنحك نصف ساعة مجانية PS4 وسكور لا نهائي.</p>

    // ==========================================
    // 2. صفحة الحجز الكبرى والأجهزة المتعددة (BookingPage)
    // ==========================================
    function BookingPage({ navigate, config, devices, snacksMenu, currentCustomer, setPendingBooking, bookings }) {
      // بيانات العميل الأساسية
      const [name, setName] = useState(currentCustomer ? currentCustomer.name : '');
      const [phone, setPhone] = useState(currentCustomer ? (currentCustomer.phone || '') : '');
      const [email, setEmail] = useState(currentCustomer ? (currentCustomer.email || '') : '');
      const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [time, setTime] = useState('17:00');

      // مصفوفة حجز الأجهزة المتعددة في نفس الحجز (Multi-Device Booking)
      const [bookedDevices, setBookedDevices] = useState([
        { id: 1, type: 'PS5', mode: 'single', duration: 30 }
      ]);

      // طلبات الكافتيريا مع التخصيص
      const [selectedSnacks, setSelectedSnacks] = useState({});
      const [teaSugar, setTeaSugar] = useState('medium');
      const [coffeeSugar, setCoffeeSugar] = useState('medium');
      const [promoCode, setPromoCode] = useState('');
      const [promoDiscount, setPromoDiscount] = useState(0);
      const [policyChecked, setPolicyChecked] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // إضافة جهاز آخر للحجز
      const handleAddAnotherDevice = () => {
        playNotificationSound('click');
        setBookedDevices(prev => [
          ...prev, 
          { id: Date.now(), type: 'PS4', mode: 'single', duration: 30 }
        ]);
      };

      // حذف جهاز من الأجهزة المضافة
      const handleRemoveDevice = (id) => {
        if (bookedDevices.length === 1) return;
        playNotificationSound('click');
        setBookedDevices(prev => prev.filter(d => d.id !== id));
      };

      // تحديث بيانات جهاز محدد
      const handleUpdateDevice = (id, field, value) => {
        setBookedDevices(prev => prev.map(d => d.id === id ? { ...d, [field]: value } : d));
      };

      // زيادة أو نقصان كميات الكافتيريا (من 0 إلى ما لا نهاية)
      const handleUpdateSnackQty = (snackId, delta) => {
        playNotificationSound('click');
        setSelectedSnacks(prev => {
          const current = prev[snackId] || 0;
          const next = Math.max(0, current + delta);
          return { ...prev, [snackId]: next };
        });
      };

      // حساب تكلفة الأجهزة بالكامل تلقائياً
      const totalDevicesCost = bookedDevices.reduce((sum, d) => {
        return sum + calcDevicePrice(d.type, d.mode, d.duration);
      }, 0);

      // حساب تكلفة طلبات الكافتيريا
      const totalSnacksCost = snacksMenu.reduce((sum, s) => {
        return sum + ((selectedSnacks[s.id] || 0) * s.price);
      }, 0);

      const subtotalCost = totalDevicesCost + totalSnacksCost;
      const finalTotalCost = Math.max(0, subtotalCost - promoDiscount);

      return (
        <div className="max-w-3xl mx-auto py-6 space-y-6 text-xs">
          {/* هيدر الحجز بالمواصفات المحددة بالملّي */}
          <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-xl">
            <div>
              <h1 className="text-xl font-black text-white flex items-center gap-2">
                <span>حجز جلسة في {config.loungeName}</span>
                <span className="text-2xl">🎮</span>
              </h1>
              <p className="text-[11px] text-neutral-400 mt-1">
                احجز شاشتك وطلباتك مسبقا وادفع بمحفظتك عن طرق التطبيق او المحفظه الالكترونيه
              </p>
            </div>
            <div className="bg-amber-500/10 border border-amber-500/40 px-3.5 py-1.5 rounded-2xl">
              <span className="text-xs font-black text-amber-400 tracking-wider">
                شاشات VIP 120Hz
              </span>
            </div>
          </div>
          {errorMsg && (
            <div className="p-3 bg-rose-500/10 border border-rose-500/40 text-rose-300 rounded-2xl text-center font-bold">
              ⚠️ {errorMsg}
            </div>
          )}

          <form onSubmit={(e) => {
            e.preventDefault();
            setErrorMsg('');

            // التحقق الصارم من الاسم الثنائي
            const trimmedName = name.trim();
            if (!trimmedName || trimmedName.split(/\s+/).length < 2) {
              return setErrorMsg('يرجى كتابة اسمك واسم والدك ثنائياً على الأقل (مثال: أحمد محمد).');
            }

            // التحقق الصارم من رقم الهاتف المصري
            if (!validateEgyptianPhone(phone)) {
              return setErrorMsg('يرجى كتابة رقم هاتف مصري صحيح مكون من 11 رقماً (010, 011, 012, 015).');
            }

            if (!policyChecked) {
              return setErrorMsg('يجب الموافقة الصريحة على لائحة وشروط صالة TWIX للمتابعة.');
            }

            // ملخص الأجهزة المحجوزة
            const devicesSummaryArr = bookedDevices.map((d, idx) => 
              `جهاز ${idx + 1}: ${d.type} (${d.mode === 'multi' ? 'ملتي 4 دراعات' : 'فردي ذراعين'}) لمدة ${d.duration}د`
            );

            // ملخص طلبات الكافتيريا
            const snacksSummaryArr = [];
            snacksMenu.forEach(s => {
              const qty = selectedSnacks[s.id] || 0;
              if (qty > 0) {
                let note = '';
                if (s.id === 'tea') note = ` [سكر: ${SUGAR_OPTIONS.find(o => o.id === teaSugar)?.label}]`;
                if (s.id.startsWith('coffee')) note = ` [سكر: ${SUGAR_OPTIONS.find(o => o.id === coffeeSugar)?.label}]`;
                snacksSummaryArr.push(`${s.name} (x${qty})${note}`);
              }
            });

            // تجهيز بيانات الحجز والانتقال لشاشة الدفع
            setPendingBooking({
              id: `bk-${Date.now()}`,
              ref: `TX-${Math.floor(100000 + Math.random() * 900000)}`,
              customerName: trimmedName,
              phone: phone.trim(),
              email: email.trim().toLowerCase(),
              date, time,
              bookedDevices,
              totalDevicesCost,
              selectedSnacks,
              teaSugar, coffeeSugar,
              totalSnacksCost,
              promoDiscount,
              totalCost: finalTotalCost,
              devicesSummary: devicesSummaryArr.join(' | '),
              snacksSummary: snacksSummaryArr.join('، ') || 'جلسة فقط بدون طلبات',
              status: 'awaiting_payment'
            });

            navigate('payment');
          }} className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl space-y-5 shadow-2xl">

            {/* بيانات العميل الأساسية */}
            <div className="space-y-3 border-b border-neutral-800 pb-4">
              <span className="text-amber-400 font-bold block text-xs">1. بيانات العميل المسجل *:</span>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">اسم العميل واسم الأب *:</label>
                  <input 
                    required 
                    value={name} 
                    onChange={e => setName(e.target.value)} 
                    placeholder="مثال: يوسف محمود" 
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" 
                  />
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">رقم الهاتف (رقم التحويل للمحفظة) *:</label>
                  <input 
                    required 
                    type="tel" 
                    value={phone} 
                    onChange={e => setPhone(e.target.value)} 
                    placeholder="01xxxxxxxxx" 
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-left focus:border-amber-500 outline-none" 
                  />
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">إيميل جوجل (للسكور وهدية 24س):</label>
                  <input 
                    type="email" 
                    value={email} 
                    onChange={e => setEmail(e.target.value)} 
                    placeholder="name@gmail.com" 
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white text-left font-mono focus:border-amber-500 outline-none" 
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 pt-1">
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">تاريخ الحجز المطلوب:</label>
                  <input 
                    type="date" 
                    value={date} 
                    onChange={e => setDate(e.target.value)} 
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono" 
                  />
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">وقت البدء (الساعة):</label>
                  <input 
                    type="time" 
                    value={time} 
                    onChange={e => setTime(e.target.value)} 
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono" 
                  />
                </div>
              </div>
            </div>

            {/* مصفوفة حجز الأجهزة المتعددة */}
            <div className="space-y-3 border-b border-neutral-800 pb-4">
              <div className="flex justify-between items-center">
                <span className="text-amber-400 font-bold block text-xs">2. تحديد الأجهزة والمدد (من نصف ساعة حتى 12 ساعة):</span>
                <span className="text-[10px] text-neutral-400 font-mono">({bookedDevices.length} أجهزة محددة)</span>
              </div>

              <div className="space-y-3">
                {bookedDevices.map((dev, index) => {
                  const singleDevPrice = calcDevicePrice(dev.type, dev.mode, dev.duration);
                  return (
                    <div key={dev.id} className="p-3.5 bg-neutral-950 rounded-2xl border border-neutral-800 space-y-2.5 relative">
                      <div className="flex justify-between items-center">
                        <strong className="text-white text-xs">الجهاز رقم #{index + 1}</strong>
                        {bookedDevices.length > 1 && (
                          <button 
                            type="button" 
                            onClick={() => handleRemoveDevice(dev.id)} 
                            className="text-rose-400 hover:text-rose-300 text-[10px] font-bold bg-rose-500/10 px-2 py-0.5 rounded-lg border border-rose-500/30">
                            ✕ حذف الجهاز
                          </button>
                        )}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div>
                          <label className="text-[9px] text-neutral-400 block mb-0.5">نوع الجهاز:</label>
                          <select 
                            value={dev.type} 
                            onChange={e => handleUpdateDevice(dev.id, 'type', e.target.value)} 
                            className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-white font-bold">
                            <option value="PS5">PlayStation 5 VIP (شاشة 120Hz)</option>
                            <option value="PS4">PlayStation 4 Pro</option>
                          </select>
                        </div>

                        <div>
                          <label className="text-[9px] text-neutral-400 block mb-0.5">نمط اللعب:</label>
                          <select 
                            value={dev.mode} 
                            onChange={e => handleUpdateDevice(dev.id, 'mode', e.target.value)} 
                            className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-amber-300 font-bold">
                            <option value="single">فردي (ذراعين فقط)</option>
                            <option value="multi">ملتي (4 ذراعات - شلة)</option>
                          </select>
                        </div>

                        <div>
                          <label className="text-[9px] text-neutral-400 block mb-0.5">المدة المطلوبة (السعر أمام كل خيار):</label>
                          <select 
                            value={dev.duration} 
                            onChange={e => handleUpdateDevice(dev.id, 'duration', Number(e.target.value))} 
                            className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-emerald-400 font-bold font-mono">
                            {DURATION_OPTIONS.map(opt => {
                              const priceForThisOpt = calcDevicePrice(dev.type, dev.mode, opt.mins);
                              return (
                                <option key={opt.mins} value={opt.mins}>
                                  {opt.label} — [{priceForThisOpt} ج.م]
                                </option>
                              );
                            })}
                          </select>
                        </div>
                      </div>

                      <div className="text-left text-[11px] font-bold text-amber-400 pt-1 font-mono">
                        حساب هذا الجهاز: {singleDevPrice} ج.م
                      </div>
                    </div>
                  );
                })}
              </div>

              <button 
                type="button" 
                onClick={handleAddAnotherDevice} 
                className="w-full py-2.5 bg-neutral-950 hover:bg-neutral-800 border border-dashed border-amber-500/40 text-amber-300 font-bold rounded-2xl flex items-center justify-center gap-2">
                <span>➕ إضافة جهاز آخر ضمن هذا الحجز</span>
              </button>
            </div>
            {/* طلبات الكافتيريا المفتوحة مع تخصيص السكر */}
            <div className="space-y-3 border-b border-neutral-800 pb-4">
              <div className="flex justify-between items-center">
                <span className="text-amber-400 font-bold block text-xs">3. طلبات الكافتيريا لطاولتك (اختياري - كميات مفتوحة):</span>
                <span className="text-[10px] text-neutral-400 font-mono">حساب الطلبات: {totalSnacksCost} ج.م</span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
                {snacksMenu.map(snack => {
                  const qty = selectedSnacks[snack.id] || 0;
                  return (
                    <div key={snack.id} className="p-2.5 bg-neutral-950 border border-neutral-800 rounded-2xl flex flex-col justify-between space-y-2">
                      <div className="flex justify-between items-center text-[11px]">
                        <span className="text-white truncate font-bold">{snack.icon} {snack.name}</span>
                        <span className="text-amber-400 font-black font-mono">{snack.price}ج</span>
                      </div>

                      <div className="flex items-center justify-between bg-neutral-900 rounded-xl p-1 border border-neutral-800">
                        <button 
                          type="button" 
                          onClick={() => handleUpdateSnackQty(snack.id, -1)} 
                          className="w-6 h-6 bg-neutral-800 hover:bg-neutral-700 text-white rounded-lg flex items-center justify-center font-black text-xs">
                          -
                        </button>
                        <span className="font-bold text-white text-xs font-mono">{qty}</span>
                        <button 
                          type="button" 
                          onClick={() => handleUpdateSnackQty(snack.id, 1)} 
                          className="w-6 h-6 bg-amber-500 hover:bg-amber-400 text-black rounded-lg flex items-center justify-center font-black text-xs">
                          +
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* خيارات تحديد السكر للمشروبات الساخنة في حال تم طلبها */}
              {((selectedSnacks['tea'] || 0) > 0 || (selectedSnacks['coffee_water'] || 0) > 0 || (selectedSnacks['coffee_milk'] || 0) > 0) && (
                <div className="p-3 bg-neutral-950 rounded-2xl border border-amber-500/30 space-y-2 mt-2">
                  <span className="text-amber-300 font-bold block text-[11px]">☕ تحديد نسبة السكر لمشروباتك:</span>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {(selectedSnacks['tea'] || 0) > 0 && (
                      <div>
                        <label className="text-[10px] text-neutral-400 block mb-1">سكر الشاي:</label>
                        <select 
                          value={teaSugar} 
                          onChange={e => setTeaSugar(e.target.value)} 
                          className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-white font-bold text-xs">
                          {SUGAR_OPTIONS.map(opt => <option key={opt.id} value={opt.id}>{opt.label}</option>)}
                        </select>
                      </div>
                    )}
                    {((selectedSnacks['coffee_water'] || 0) > 0 || (selectedSnacks['coffee_milk'] || 0) > 0) && (
                      <div>
                        <label className="text-[10px] text-neutral-400 block mb-1">سكر القهوة:</label>
                        <select 
                          value={coffeeSugar} 
                          onChange={e => setCoffeeSugar(e.target.value)} 
                          className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-white font-bold text-xs">
                          {SUGAR_OPTIONS.map(opt => <option key={opt.id} value={opt.id}>{opt.label}</option>)}
                        </select>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>

            {/* بروموكود الخصم (للاستخدام لمرة واحدة) */}
            <div className="p-3 bg-neutral-950 rounded-2xl border border-neutral-800 flex gap-2">
              <input 
                value={promoCode} 
                onChange={e => setPromoCode(e.target.value)} 
                placeholder="كود الخصم (اختياري - استخدام مرة واحدة)" 
                className="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-white font-mono uppercase text-xs" 
              />
              <button 
                type="button" 
                onClick={() => {
                  const fp = getDeviceFingerprint();
                  if (localStorage.getItem(`twix_promo_used_${fp}`)) {
                    return alert('عفواً! كود الخصم مخصص للاستخدام لمرة واحدة فقط لكل جهاز وحساب.');
                  }
                  if (promoCode.trim().toUpperCase() === 'TWIX5') {
                    const d = Math.round(subtotalCost * 0.05);
                    setPromoDiscount(d);
                    playNotificationSound('cash');
                    alert(`تم تفعيل كود الخصم بنجاح! تم خصم ${d} ج.م (5%).`);
                  } else {
                    alert('كود الخصم غير صحيح أو منتهي.');
                  }
                }} 
                className="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-amber-300 font-bold rounded-xl text-xs">
                تطبيق الكود
              </button>
            </div>

            {/* كارت ملخص الفاتورة الإجمالي */}
            <div className="p-4 bg-neutral-950 border border-neutral-800 rounded-2xl flex justify-between items-center">
              <div>
                <span className="text-neutral-400 block text-xs">إجمالي الحساب المستحق:</span>
                <span className="text-[10px] text-neutral-500 font-mono">
                  أجهزة: {totalDevicesCost}ج | كافتيريا: {totalSnacksCost}ج {promoDiscount > 0 && `| خصم: -${promoDiscount}ج`}
                </span>
              </div>
              <strong className="text-amber-400 text-2xl font-black font-mono">
                {finalTotalCost} ج.م
              </strong>
            </div>

            {/* الإقرار القانوني الصارم للشروط */}
            <label className="flex items-start gap-2.5 p-3.5 bg-amber-500/10 border border-amber-500/30 rounded-2xl cursor-pointer">
              <input 
                type="checkbox" 
                required 
                checked={policyChecked} 
                onChange={e => setPolicyChecked(e.target.checked)} 
                className="mt-0.5"
              />
              <span className="text-[11px] font-bold text-amber-200 leading-relaxed">
                أوافق صراحة على شروط ولوائح صالة {config.loungeName}، وأقر بمسؤوليتي عن سلامة أذرع التحكم والأجهزة، وفي حال حدوث أي كسر متعمد ألتزم بدفع القيمة كاملة أو الإحالة للجهات الأمنية وحظر حسابي نهائياً من التطبيق.
              </span>
            </label>

            <button 
              type="submit" 
              className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-2xl text-sm shadow-xl shadow-amber-500/20 active:scale-95 transition-all">
              المتابعة إلى اختيار طريقة الدفع والتأكيد ({finalTotalCost} ج.م) ➔
            </button>
          </form>
        </div>
      );
    }

    // ==========================================
    // 3. شاشة بوابات الدفع الثلاثية (PaymentPage)
    // ==========================================
    function PaymentPage({ navigate, config, pendingBooking, currentCustomer, setCurrentCustomer, bookings, setBookings }) {
      if (!pendingBooking) {
        return (
          <div className="text-center py-20 space-y-3">
            <p className="text-neutral-400">لا يوجد حجز معلق للدفع حالياً.</p>
            <button onClick={() => navigate('booking')} className="bg-amber-500 text-black font-bold px-4 py-2 rounded-xl text-xs">
              الذهاب لصفحة الحجز 🎮
            </button>
          </div>
        );
      }

      const customerWallet = (currentCustomer && currentCustomer.walletBalance) || 0;
      
      // طرق الدفع الثلاثة المحددة:
      // 'wallet_full' (رصيد التطبيق كامل) | 'cash_full' (محفظة إلكترونية كامل) | 'hybrid' (دفع هجين)
      const [paymentMethod, setPaymentMethod] = useState(() => {
        if (customerWallet >= pendingBooking.totalCost && pendingBooking.totalCost > 0) return 'wallet_full';
        if (customerWallet > 0 && customerWallet < pendingBooking.totalCost) return 'hybrid';
        return 'cash_full';
      });

      const [selectedWalletType, setSelectedWalletType] = useState('vodafone');
      const [senderPhone, setSenderPhone] = useState(pendingBooking.phone || (currentCustomer?.phone || ''));
      const [senderWalletName, setSenderWalletName] = useState(pendingBooking.customerName || '');
      const [receiptScreenshot, setReceiptScreenshot] = useState(null);
      const [copiedNumber, setCopiedNumber] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [paymentDoneSuccess, setPaymentDoneSuccess] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // حسابات الدفع الهجين الدقيقة
      let walletDeduction = 0;
      let remainingCashToTransfer = pendingBooking.totalCost;

      if (paymentMethod === 'wallet_full') {
        walletDeduction = pendingBooking.totalCost;
        remainingCashToTransfer = 0;
      } else if (paymentMethod === 'hybrid') {
        walletDeduction = Math.min(customerWallet, pendingBooking.totalCost);
        remainingCashToTransfer = Math.max(0, pendingBooking.totalCost - walletDeduction);
          }
      // معالجة تأكيد وإرسال الحجز
      const handleExecutePayment = () => {
        setErrorMsg('');

        // التحقق في حالة الدفع الكاش أو الهجين
        if (remainingCashToTransfer > 0) {
          if (!validateEgyptianPhone(senderPhone)) {
            return setErrorMsg('يجب كتابة رقم المحفظة التي قمت بالتحويل منها (010, 011, 012, 015) المكون من 11 رقماً.');
          }
          if (!receiptScreenshot) {
            return setErrorMsg('إلزامي: يرجى إرفاق سكرين شوت إيصال التحويل لتأكيد الحجز ومطابقته.');
          }
        }

        setIsSubmitting(true);

        const newCustomerWalletBalance = Math.max(0, customerWallet - walletDeduction);
        const finalBookingData = {
          ...pendingBooking,
          paymentMethod,
          walletDeduction,
          remainingCashToTransfer,
          senderPhone: remainingCashToTransfer > 0 ? senderPhone.trim() : (currentCustomer?.phone || 'محفظة داخلية'),
          senderWalletName: remainingCashToTransfer > 0 ? senderWalletName.trim() : (currentCustomer?.name || 'محفظة داخلية'),
          selectedWalletType: remainingCashToTransfer > 0 ? selectedWalletType : 'internal_wallet',
          receiptScreenshot: receiptScreenshot || null,
          status: remainingCashToTransfer === 0 ? 'confirmed' : 'awaiting_admin_approval',
          createdAt: new Date().toISOString()
        };

        // الحفظ السحابي في Firebase Firestore
        db.collection('bookings').doc(finalBookingData.id).set(finalBookingData).then(() => {
          // تحديث رصيد محفظة العميل محلياً وسحابياً إن تم خصم رصيد
          if (currentCustomer && walletDeduction > 0) {
            db.collection('customers').doc(currentCustomer.phone).set({
              walletBalance: newCustomerWalletBalance,
              usedPromo: pendingBooking.promoDiscount > 0 ? true : (currentCustomer.usedPromo || false)
            }, { merge: true });
            
            const updated = { ...currentCustomer, walletBalance: newCustomerWalletBalance };
            setCurrentCustomer(updated);
            localStorage.setItem('twix_customer', JSON.stringify(updated));
          }

          if (pendingBooking.promoDiscount > 0) {
            localStorage.setItem(`twix_promo_used_${getDeviceFingerprint()}`, 'true');
          }

          setBookings([finalBookingData, ...bookings]);
          playNotificationSound('cash');
          setPaymentDoneSuccess(true);
          setIsSubmitting(false);
        }).catch(() => {
          // حفظ احتياطي في حال بطء النت
          setBookings([finalBookingData, ...bookings]);
          playNotificationSound('cash');
          setPaymentDoneSuccess(true);
          setIsSubmitting(false);
        });
      };

      // نص رسالة الواتساب المجهزة المجمعة في رسالة واحدة
      const whatsappBookingMessage = encodeURIComponent(
        `السلام عليكم، حجز جديد في ${config.loungeName} 🎮\n` +
        `--------------------------\n` +
        `• كود الحجز: ${pendingBooking.ref}\n` +
        `• العميل: ${pendingBooking.customerName} (${pendingBooking.phone})\n` +
        `• الميعاد: ${pendingBooking.date} الساعة ${pendingBooking.time}\n` +
        `• الأجهزة: ${pendingBooking.devicesSummary}\n` +
        `• الكافتيريا: ${pendingBooking.snacksSummary}\n` +
        `• طريقة الدفع: ${paymentMethod === 'wallet_full' ? 'محفظة التطبيق كاملة' : (paymentMethod === 'hybrid' ? `هجين (مخصوم محفظة: ${walletDeduction}ج | محول كاش: ${remainingCashToTransfer}ج)` : `محفظة كاش كاملة (${pendingBooking.totalCost}ج)`)}\n` +
        (remainingCashToTransfer > 0 ? `• محول من رقم: ${senderPhone} (باسم: ${senderWalletName})\n` : '') +
        `• الإجمالي المستحق: ${pendingBooking.totalCost} ج.م\n` +
        `--------------------------\n` +
        `يرجى تأكيد الاستلام وتجهيز الشاشات والطلبات!`
      );

      return (
        <div className="max-w-md mx-auto py-6 space-y-5 text-xs">
          {!paymentDoneSuccess ? (
            <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl space-y-4 shadow-2xl">
              <div className="text-center space-y-1 border-b border-neutral-800 pb-3">
                <span className="text-[10px] bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full font-black">
                  بوابة الدفع الإلكتروني المعتمدة
                </span>
                <h2 className="text-xl font-black text-white mt-1">تأكيد الحجز والدفع</h2>
                <span className="text-neutral-400 font-mono text-[11px] block">كود الحجز: {pendingBooking.ref}</span>
              </div>

              {/* اختيار طريقة الدفع من الخيارات الثلاثة المحددة */}
              <div className="space-y-2">
                <label className="text-neutral-300 font-bold block text-xs">اختر طريقة الدفع المناسبة لك:</label>
                <div className="grid grid-cols-1 gap-2">
                  {/* الخيار 1: المحفظة الإلكترونية بالكامل */}
                  <button 
                    type="button" 
                    onClick={() => setPaymentMethod('cash_full')} 
                    className={`p-3 rounded-2xl border text-right transition-all flex justify-between items-center ${paymentMethod === 'cash_full' ? 'bg-amber-500/10 border-amber-500 text-amber-400 shadow-md' : 'bg-neutral-950 border-neutral-800 text-neutral-300'}`}>
                    <div>
                      <strong className="block text-xs">1. دفع الحساب بالكامل بمحفظة كاش</strong>
                      <span className="text-[10px] text-neutral-400">تحويل خارجي (فودافون كاش، أورانج، اتصالات، وي)</span>
                    </div>
                    <span className="font-mono font-black text-sm">{pendingBooking.totalCost} ج</span>
                  </button>

                  {/* الخيار 2: رصيد محفظة التطبيق بالكامل */}
                  <button 
                    type="button" 
                    disabled={customerWallet < pendingBooking.totalCost} 
                    onClick={() => setPaymentMethod('wallet_full')} 
                    className={`p-3 rounded-2xl border text-right transition-all flex justify-between items-center ${customerWallet < pendingBooking.totalCost ? 'opacity-40 cursor-not-allowed bg-neutral-950 border-neutral-900 text-neutral-500' : (paymentMethod === 'wallet_full' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-400 shadow-md' : 'bg-neutral-950 border-neutral-800 text-neutral-300')}`}>
                    <div>
                      <strong className="block text-xs">2. الدفع الكامل من رصيد محفظتك بالتطبيق</strong>
                      <span className="text-[10px] text-neutral-400">رصيدك المتاح حالياً: {customerWallet} ج.م</span>
                    </div>
                    <span className="font-mono font-black text-sm text-emerald-400">خصم فوري</span>
                  </button>

                  {/* الخيار 3: الدفع الهجين */}
                  <button 
                    type="button" 
                    disabled={customerWallet === 0} 
                    onClick={() => setPaymentMethod('hybrid')} 
                    className={`p-3 rounded-2xl border text-right transition-all flex justify-between items-center ${customerWallet === 0 ? 'opacity-40 cursor-not-allowed bg-neutral-950 border-neutral-900 text-neutral-500' : (paymentMethod === 'hybrid' ? 'bg-cyan-500/10 border-cyan-500 text-cyan-400 shadow-md' : 'bg-neutral-950 border-neutral-800 text-neutral-300')}`}>
                    <div>
                      <strong className="block text-xs">3. الدفع الهجين (رصيد التطبيق + محفظة كاش)</strong>
                      <span className="text-[10px] text-neutral-400">خصم الرصيد المتوفر وتحويل الباقي بالمحفظة</span>
                    </div>
                    <span className="font-mono font-black text-sm text-cyan-400">هجين</span>
                  </button>
                </div>
              </div>

              {/* الشرح التوضيحي البارز للدفع الهجين كما طلبته بالملّي */}
              {paymentMethod === 'hybrid' && (
                <div className="p-3.5 bg-cyan-500/10 border border-cyan-500/40 rounded-2xl space-y-1.5 text-[11px] text-cyan-200 leading-relaxed">
                  <strong className="text-white block text-xs">💡 شرح الدفع الهجين لحسابك:</strong>
                  <div className="flex justify-between border-b border-cyan-500/20 pb-1">
                    <span>إجمالي الفاتورة المطلوبة:</span>
                    <strong className="font-mono text-white">{pendingBooking.totalCost} ج.م</strong>
                  </div>
                  <div className="flex justify-between border-b border-cyan-500/20 pb-1">
                    <span>سيُسحب من رصيد محفظتك:</span>
                    <strong className="font-mono text-emerald-400">-{walletDeduction} ج.م</strong>
                  </div>
                  <div className="flex justify-between pt-0.5">
                    <span>المتبقي المطلوب تحويله كاش:</span>
                    <strong className="font-mono text-amber-400 text-xs">{remainingCashToTransfer} ج.م</strong>
                  </div>
                </div>
              )}

              {/* بيانات التحويل عند وجود مبلغ كاش متبقٍ */}
              {remainingCashToTransfer > 0 ? (
                <div className="space-y-3 pt-1">
                  {/* رقم الصالة المعتمد للتحويل */}
                  <div className="bg-neutral-950 p-3.5 rounded-2xl border border-neutral-800 text-center space-y-1">
                    <span className="text-[10px] text-neutral-400 block">قم بتحويل المبلغ المطلوب ({remainingCashToTransfer} ج) للرقم الرسمي:</span>
                    <div className="flex items-center justify-center gap-2">
                      <span className="font-mono text-base font-black text-amber-400">{config.phone}</span>
                      <button 
                        type="button" 
                        onClick={() => {
                          navigator.clipboard.writeText(config.phone);
                          setCopiedNumber(true);
                          setTimeout(() => setCopiedNumber(false), 2000);
                        }} 
                        className="px-2.5 py-1 bg-neutral-800 hover:bg-neutral-700 text-white rounded-lg text-[10px] border border-neutral-700 font-bold">
                        {copiedNumber ? '✓ تم النسخ' : 'نسخ الرقم'}
                      </button>
                    </div>
                  </div>

                  {/* نوع المحفظة المحول إليها */}
                  <div className="grid grid-cols-2 gap-2">
                    {[
                      { id: 'vodafone', name: 'فودافون كاش', color: 'text-rose-400' },
                      { id: 'orange', name: 'أورانج كاش', color: 'text-orange-400' },
                      { id: 'etisalat', name: 'اتصالات كاش', color: 'text-emerald-400' },
                      { id: 'wepay', name: 'وي باي (WE)', color: 'text-purple-400' }
                    ].map(w => (
                      <button 
                        key={w.id} 
                        type="button" 
                        onClick={() => setSelectedWalletType(w.id)} 
                        className={`p-2 rounded-xl border text-center font-bold text-xs transition-all ${selectedWalletType === w.id ? 'bg-amber-500 text-black border-amber-500' : `bg-neutral-950 border-neutral-800 ${w.color}`}`}>
                        {w.name}
                      </button>
                    ))}
                  </div>

                  {/* رقم المحفظة المحول منها */}
                  <div>
                    <label className="text-[10px] text-neutral-400 block mb-1">رقم المحفظة التي قمت بالتحويل منها *:</label>
                    <input 
                      type="tel" 
                      required 
                      value={senderPhone} 
                      onChange={e => setSenderPhone(e.target.value)} 
                      placeholder="01xxxxxxxxx" 
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-left focus:border-amber-500 outline-none" 
                    />
                  </div>

                  {/* التحويل باسم مين */}
                  <div>
                    <label className="text-[10px] text-neutral-400 block mb-1">التحويل باسم مين؟ (اسم صاحب المحفظة) *:</label>
                    <input 
                      type="text" 
                      required 
                      value={senderWalletName} 
                      onChange={e => setSenderWalletName(e.target.value)} 
                      placeholder="اسم صاحب المحفظة المحوّل منها" 
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" 
                    />
                  </div>

                  {/* إرفاق سكرين شوت التحويل */}
                  <div>
                    <label className="text-[10px] text-neutral-400 block mb-1">إرفاق سكرين شوت إيصال التحويل 📸 *:</label>
                    <input 
                      type="file" 
                      accept="image/*" 
                      required 
                      onChange={async (e) => {
                        if (e.target.files[0]) {
                          const compressed = await compressImageFile(e.target.files[0]);
                          setReceiptScreenshot(compressed);
                        }
                      }} 
                      className="w-full text-neutral-400 file:mr-2 file:py-1 file:px-2.5 file:rounded-xl file:border-0 file:bg-neutral-800 file:text-amber-400 bg-neutral-950 p-1.5 rounded-xl border border-neutral-800 text-[11px]" 
                    />
                    {receiptScreenshot && (
                      <img src={receiptScreenshot} alt="Receipt" className="max-h-24 mx-auto rounded-xl border border-emerald-500/50 object-contain mt-1.5 shadow" />
                    )}
                  </div>
                </div>
              ) : (
                <div className="p-3 bg-emerald-500/10 border border-emerald-500/40 rounded-2xl text-center space-y-1">
                  <span className="text-emerald-400 font-bold block">✓ رصيد محفظتك يغطي كامل الفاتورة!</span>
                  <span className="text-[10px] text-neutral-400">سيتم الدفع فورياً بدون تحويل خارجي أو انتظار.</span>
                </div>
              )}

              {errorMsg && (
                <div className="p-2.5 bg-rose-500/10 border border-rose-500/40 text-rose-300 rounded-xl text-center font-bold text-[11px]">
                  ⚠️ {errorMsg}
                </div>
              )}

              <button 
                type="button" 
                disabled={isSubmitting} 
                onClick={handleExecutePayment} 
                className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-2xl text-xs shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                {isSubmitting ? 'جاري إرسال وتأكيد الحجز...' : (remainingCashToTransfer > 0 ? `تأكيد وإرسال الحجز (${remainingCashToTransfer} ج كاش)` : `دفع فوري من المحفظة (${walletDeduction} ج)`)}
              </button>
            </div>
          ) : (
            /* شاشة "تم" بعد نجاح الدفع والحجز */
            <div className="bg-neutral-900 border border-emerald-500/50 p-6 rounded-3xl text-center space-y-4 shadow-2xl">
              <div className="text-5xl animate-bounce">🎉</div>
              <div>
                <h2 className="text-xl font-black text-white">تم استلام حجزك بنجاح!</h2>
                <span className="text-amber-400 font-mono text-sm font-black block mt-1">كود الحجز: {pendingBooking.ref}</span>
              </div>

              <p className="text-xs text-neutral-300 leading-relaxed bg-neutral-950 p-3 rounded-2xl border border-neutral-800">
                {paymentMethod === 'wallet_full' 
                  ? 'تم تأكيد حجزك فورياً بالخصم المباشر من رصيد محفظتك! شاشتك وطلباتك بانتظارك في الصالة.' 
                  : 'تم استلام بيانات التحويل وإيصالك، وجاري مراجعة الدفع من قِبل الإدارة وتأكيد الحجز فوراً.'}
              </p>

              {/* زر الواتساب بالرسالة المجهزة المجمعة في رسالة واحدة */}
              <a 
                href={`https://wa.me/${config.whatsappNumber}?text=${whatsappBookingMessage}`} 
                target="_blank" 
                className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 transition-all">
                <span>💬 إرسال تفاصيل الحجز كاملة لكابتن الصالة على واتساب</span>
              </a>

              {/* زر لوكيشن الصالة على Google Maps تحته مباشرة كما طلبت */}
              <a 
                href={config.mapsUrl} 
                target="_blank" 
                className="w-full py-2.5 bg-neutral-800 hover:bg-neutral-700 text-amber-300 border border-amber-500/40 rounded-2xl text-xs font-black flex items-center justify-center gap-2 transition-all">
                <span>📍 فتح موقع الصالة على خرائط Google Maps (GPS)</span>
              </a>

              <div className="flex gap-2 pt-2">
                <button onClick={() => navigate('account')} className="flex-1 py-2.5 bg-neutral-800 text-white font-bold rounded-xl text-xs">
                  عرض في حسابي
                </button>
                <button onClick={() => navigate('home')} className="flex-1 py-2.5 bg-amber-500 text-black font-black rounded-xl text-xs">
                  الرئيسية
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }
      // ==========================================
    // 4. صفحة باقات التوفير الـ 8 (BundlesPage)
    // ==========================================
    function BundlesPage({ navigate, bundles, snacksMenu, setPendingBooking, currentCustomer }) {
      const [selectedDevType, setSelectedDevType] = useState('PS5');

      const handleBookBundle = (bundle) => {
        playNotificationSound('click');
        const devPricePerHour = (PRICING[selectedDevType] || PRICING.PS5)[bundle.mode].ratePerHour;
        const rawTimeCost = devPricePerHour * bundle.hours;
        const discountAmount = Math.round(rawTimeCost * (bundle.discountPercent / 100));
        const finalBundleCost = rawTimeCost - discountAmount;

        setPendingBooking({
          id: `bk-${Date.now()}`,
          ref: `TX-BNDL-${Math.floor(1000 + Math.random() * 9000)}`,
          customerName: currentCustomer ? currentCustomer.name : 'عميل باقة تويكس',
          phone: currentCustomer ? (currentCustomer.phone || '') : '',
          email: currentCustomer ? (currentCustomer.email || '') : '',
          date: new Date().toISOString().slice(0, 10),
          time: '18:00',
          bookedDevices: [{ id: 1, type: selectedDevType, mode: bundle.mode, duration: bundle.hours * 60 }],
          devicesSummary: `${bundle.name} (${selectedDevType} - ${bundle.hours} ساعات)`,
          snacksSummary: `شرط الباقة الإجباري: ${bundle.cafeteriaCondition}`,
          totalDevicesCost: rawTimeCost,
          totalSnacksCost: 0,
          promoDiscount: discountAmount,
          totalCost: finalBundleCost,
          status: 'awaiting_payment'
        });

        navigate('payment');
      };

      return (
        <div className="max-w-4xl mx-auto py-6 space-y-6 text-xs">
          {/* هيدر الصفحة */}
          <div className="text-center space-y-1">
            <span className="text-[10px] bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full font-black">
              قسم التوفير الذكي المعتمد
            </span>
            <h1 className="text-2xl font-black text-white">🎁 باقات التوفير الـ 8 الأساسية</h1>
            <p className="text-neutral-400 text-xs">العب لساعات أطول واستمتع بطلبات الكافتيريا بأعلى نسبة توفير وخصم حقيقي</p>
          </div>

          {/* صندوق الشرح التوضيحي للعميل */}
          <div className="p-4 bg-gradient-to-r from-amber-500/10 via-neutral-900 to-amber-500/10 border border-amber-500/30 rounded-3xl space-y-2">
            <strong className="text-amber-300 block text-xs flex items-center gap-1.5">
              <span>💡</span><span>كيف تعمل باقات التوفير في صالتنا؟</span>
            </strong>
            <p className="text-neutral-300 text-[11px] leading-relaxed">

          </div>

          {/* محدد نوع الجهاز المفضل للباقة */}
          <div className="flex justify-center items-center gap-3 bg-neutral-900 p-2.5 rounded-2xl border border-neutral-800 w-fit mx-auto">
            <span className="text-neutral-400 font-bold">اختر نوع الجهاز المفضل:</span>
            <button 
              type="button" 
              onClick={() => setSelectedDevType('PS5')} 
              className={`px-4 py-1.5 rounded-xl font-black transition-all ${selectedDevType === 'PS5' ? 'bg-amber-500 text-black shadow-md' : 'text-neutral-400 hover:text-white'}`}>
              PlayStation 5 VIP (شاشات 120Hz)

            <button 
              type="button" 
              onClick={() => setSelectedDevType('PS4')} 
              className={`px-4 py-1.5 rounded-xl font-black transition-all ${selectedDevType === 'PS4' ? 'bg-amber-500 text-black shadow-md' : 'text-neutral-400 hover:text-white'}`}>

          {/* شبكة عرض الباقات الـ 8 الموفرة */}
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3.5">

              const devPricePerHour = (PRICING[selectedDevType] || PRICING.PS5)[b.mode].ratePerHour;
              const originalCost = devPricePerHour * b.hours;
              const discountVal = Math.round(originalCost * (b.discountPercent / 100));
              const finalPrice = originalCost - discountVal;

                <div key={b.id} className="p-4 bg-neutral-900 border border-neutral-800 hover:border-amber-500/40 rounded-3xl flex flex-col justify-between space-y-3 shadow-xl transition-all">

                      <span className="text-[10px] text-neutral-400 font-mono">
                        {b.mode === 'multi' ? 'ملتي (4 دراعات)' : 'فردي (ذراعين)'}

                      <span className="text-amber-400 font-black text-base font-mono">{finalPrice} ج.م</span>

                      type="button" 
                      onClick={() => handleBookBundle(b)}

                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

    // ==========================================
    // 5. صفحة حجز الحفلات والمناسبات بالصالة (PartiesPage)
    // ==========================================
    function PartiesPage({ navigate, config, devices, partyBookings, setPartyBookings, currentCustomer }) {
      const [partyName, setPartyName] = useState(currentCustomer ? currentCustomer.name : '');
      const [partyPhone, setPartyPhone] = useState(currentCustomer ? (currentCustomer.phone || '') : '');
      const [partyDate, setPartyDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [partyStartTime, setPartyStartTime] = useState('18:00');
      const [partyDurationHours, setPartyDurationHours] = useState(3);
      const [partyReason, setPartyReason] = useState('');
      const [attendeesCount, setAttendeesCount] = useState(10);
      const [errorMsg, setErrorMsg] = useState('');

      // حساب تكلفة حجز كافة أجهزة الصالة بالكامل
      // السعر يحسب: إجمالي ساعات كافة الأجهزة + 200 ج ضريبة ورسوم تنظيم الحفلة
      const totalLoungeHourlyRate = devices.reduce((sum, d) => {
        const rate = (PRICING[d.type] || PRICING.PS4).multi.ratePerHour;
        return sum + rate;
      }, 0);

      const devicesTotalCost = totalLoungeHourlyRate * partyDurationHours;
      const partyTax = config.partyTax || 200;
      const finalPartyTotal = devicesTotalCost + partyTax;

      const handleProceedPartyBooking = (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!validateEgyptianPhone(partyPhone)) {
          return setErrorMsg('يرجى كتابة رقم هاتف مصري صحيح مكون من 11 رقماً (010, 011, 012, 015).');
        }

        if (!partyReason.trim()) {
          return setErrorMsg('يرجى توضيح سبب الحفلة وما تود إقامته داخل الصالة.');
        }

        // إرسال الحجز لشاشة الدفع بالخيارات الثلاثة
        setPendingBooking({
          id: `party-${Date.now()}`,
          ref: `TX-PARTY-${Math.floor(1000 + Math.random() * 9000)}`,
          customerName: partyName.trim(),
          phone: partyPhone.trim(),
          date: partyDate,
          time: partyStartTime,
          duration: partyDurationHours * 60,
          devicesSummary: `حجز الصالة بالكامل (${devices.length} شاشات) لمدة ${partyDurationHours} ساعات`,
          snacksSummary: `حفلة ومناسبة خاصة (${partyReason.trim()}) - عدد الحضور: ${attendeesCount} أفراد`,
          totalDevicesCost: devicesTotalCost,
          totalSnacksCost: partyTax,
          promoDiscount: 0,
          totalCost: finalPartyTotal,
          status: 'awaiting_payment'
        });

        navigate('payment');
      };
      return (
        <div className="max-w-2xl mx-auto py-6 space-y-6 text-xs">
          {/* هيدر الصفحة وصندوق الشرح التوضيحي */}
          <div className="text-center space-y-1">
            <span className="text-[10px] bg-pink-500/20 text-pink-300 px-3 py-1 rounded-full font-black">
              قسم المناسبات وأعياد الميلاد VIP
            </span>
            <h1 className="text-2xl font-black text-white">🎉 حجز الصالة بالكامل لحفلة خاصة</h1>
            <p className="text-neutral-400 text-xs">احجز المكان بالكامل لك ولأصحابك للاحتفال بيوم مميز بدون أي مقاطعة</p>
          </div>

          <div className="p-4 bg-gradient-to-r from-pink-500/10 via-neutral-900 to-pink-500/10 border border-pink-500/30 rounded-3xl space-y-2">
            <strong className="text-pink-300 block text-xs flex items-center gap-1.5">
              <span>💡</span><span>شروط وضوابط حجز الحفلة في الصالة:</span>
            </strong>
            <p className="text-neutral-300 text-[11px] leading-relaxed">
              لحجز الحفلة يتم حجز كافة شاشات وأجهزة الصالة بالكامل ({devices.length} أجهزة) لعدد الساعات التي تحددها لضمان الخصوصية التامة للمكان، وتضاف ضريبة ورسوم تنظيم بقيمة {partyTax} ج.م. لا يسمح بتعارض ميعاد الحفلة مع أي حجز آخر مسجل، ويتم تأكيد الحفلة فورياً عبر لوحة الإدارة.
            </p>
          </div>

          {errorMsg && (
            <div className="p-3 bg-rose-500/10 border border-rose-500/40 text-rose-300 rounded-2xl text-center font-bold">
              ⚠️ {errorMsg}
            </div>
          )}

          <form onSubmit={handleProceedPartyBooking} className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl space-y-4 shadow-2xl">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="text-[10px] text-neutral-400 block mb-1">اسم المسؤول عن الحفلة *:</label>
                <input 
                  required 
                  value={partyName} 
                  onChange={e => setPartyName(e.target.value)} 
                  placeholder="اسمك بالكامل" 
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white focus:border-pink-500 outline-none" 
                />
              </div>
              <div>
                <label className="text-[10px] text-neutral-400 block mb-1">رقم الهاتف للتواصل والتحويل *:</label>
                <input 
                  required 
                  type="tel" 
                  value={partyPhone} 
                  onChange={e => setPartyPhone(e.target.value)} 
                  placeholder="01xxxxxxxxx" 
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-left focus:border-pink-500 outline-none" 
                />
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label className="text-[10px] text-neutral-400 block mb-1">تاريخ الحفلة:</label>
                <input 
                  type="date" 
                  value={partyDate} 
                  onChange={e => setPartyDate(e.target.value)} 
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono" 
                />
              </div>
              <div>
                <label className="text-[10px] text-neutral-400 block mb-1">وقت البدء (الساعة):</label>
                <input 
                  type="time" 
                  value={partyStartTime} 
                  onChange={e => setPartyStartTime(e.target.value)} 
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono" 
                />
              </div>
              <div>
                <label className="text-[10px] text-neutral-400 block mb-1">مدة الحفلة بالكامل:</label>
                <select 
                  value={partyDurationHours} 
                  onChange={e => setPartyDurationHours(Number(e.target.value))} 
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-bold">
                  <option value={2}>ساعتان (2 ساعة)</option>
                  <option value={3}>3 ساعات</option>
                  <option value={4}>4 ساعات</option>
                  <option value={5}>5 ساعات</option>
                  <option value={6}>6 ساعات</option>
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div className="sm:col-span-2">
                <label className="text-[10px] text-neutral-400 block mb-1">سبب ومناسبة الحفلة (عيد ميلاد / تخرج / بطولة أصحاب) *:</label>
                <input 
                  required 
                  value={partyReason} 
                  onChange={e => setPartyReason(e.target.value)} 
                  placeholder="مثال: الاحتفال بعيد ميلاد صديقنا وعمل بطولة بلايستيشن" 
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white focus:border-pink-500 outline-none" 
                />
              </div>
              <div>
                <label className="text-[10px] text-neutral-400 block mb-1">عدد الأفراد المتوقع:</label>
                <input 
                  type="number" 
                  min={1} 
                  value={attendeesCount} 
                  onChange={e => setAttendeesCount(Number(e.target.value))} 
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-center" 
                />
              </div>
            </div>

            {/* تفصيل حساب تكلفة الحفلة */}
            <div className="p-3.5 bg-neutral-950 rounded-2xl border border-neutral-800 space-y-1.5 text-[11px]">
              <div className="flex justify-between text-neutral-400">
                <span>ساعات الصالة بالكامل ({devices.length} شاشات × {partyDurationHours} ساعات):</span>
                <strong className="font-mono text-white">{devicesTotalCost} ج.م</strong>
              </div>
              <div className="flex justify-between text-neutral-400">
                <span>ضريبة ورسوم تنظيم وتنظيف الحفلة:</span>
                <strong className="font-mono text-pink-400">+{partyTax} ج.م</strong>
              </div>
              <div className="flex justify-between pt-1 border-t border-neutral-800 text-sm">
                <span className="font-bold text-white">إجمالي حجز الحفلة المستحق:</span>
                <strong className="font-mono text-amber-400 font-black">{finalPartyTotal} ج.م</strong>
              </div>
            </div>

            <button 
              type="submit" 
              className="w-full py-3 bg-gradient-to-r from-pink-600 to-amber-500 hover:from-pink-500 hover:to-amber-400 text-black font-black rounded-2xl text-xs shadow-xl active:scale-95 transition-all">
              المتابعة إلى دفع وتأكيد حجز الحفلة ({finalPartyTotal} ج.م) ➔
            </button>
          </form>
        </div>
      );
    }

            <strong className="text-cyan-300 block text-xs flex items-center gap-1.5">
              <span>💡</span><span>كيف يعمل نظام التحديات ومنصة الزعيم؟</span>

            <p className="text-neutral-300 text-[11px] leading-relaxed">

    // ==========================================
    // 8. صفحة عجلة الحظ الدوارة (LuckyWheelPage)
    // ==========================================
    function LuckyWheelPage({ wheelSegments, currentCustomer, setCurrentCustomer }) {
      const [isSpinning, setIsSpinning] = useState(false);
      const [spinOutcome, setSpinOutcome] = useState(null);

      // لف عجلة الحظ بالنسب الدقيقة المعتمدة
      const handleTriggerSpin = () => {
        if (!currentCustomer) {
          return alert("يرجى تسجيل الدخول أولاً لحفظ هداياك وكوبوناتك في حسابك بالعد التنازلي!");
        }

        const fp = getDeviceFingerprint();
        const spinKey = `twix_last_spin_${fp}`;
        const lastSpinTimestamp = Number(localStorage.getItem(spinKey) || 0);
        const cooldownMs = 24 * 60 * 60 * 1000; // 24 ساعة كاملة بين كل لفة

        if (Date.now() - lastSpinTimestamp < cooldownMs) {
          const remHours = Math.ceil((cooldownMs - (Date.now() - lastSpinTimestamp)) / (1000 * 60 * 60));
          return alert(`عفواً! لقد استخدمت لفتك اليومية بالفعل. متبقي ${remHours} ساعة لتتمكن من اللف مرة أخرى.`);
        }

        setIsSpinning(true);
        setSpinOutcome(null);

        // حساب النتيجة بالاحتمالات الدقيقة المعتمدة (Weighted Probability)
        const rand = Math.random() * 100;
        let cumulative = 0;
        let picked = wheelSegments[0];

        for (const seg of wheelSegments) {
          cumulative += seg.prob;
          if (rand <= cumulative) {
            picked = seg;
            break;
          }
        }

        setTimeout(() => {
          setIsSpinning(false);
          setSpinOutcome(picked);
          localStorage.setItem(spinKey, Date.now().toString());

          if (picked.type !== 'none') {
            playNotificationSound('cash');
            const newGift = {
              id: `rew-${Date.now()}`,
              title: picked.label,
              rewardType: picked.type,
              createdAt: Date.now(),
              validDays: 7, // صالحة لمدة 7 أيام بالعد التنازلي
              status: 'active'
            };

            const updatedRewards = [...(currentCustomer.rewards || []), newGift];
            const updatedProfile = { ...currentCustomer, rewards: updatedRewards };
            setCurrentCustomer(updatedProfile);
            localStorage.setItem('twix_customer', JSON.stringify(updatedProfile));
            db.collection('customers').doc(currentCustomer.phone).set({ rewards: updatedRewards }, { merge: true });
          } else {
            playNotificationSound('click');
          }
        }, 3000);
      };
      return (
        <div className="max-w-md mx-auto py-6 space-y-6 text-xs text-center">
          {/* هيدر الصفحة وصندوق الشرح */}
          <div className="space-y-1">
            <span className="text-[10px] bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full font-black">
              قسم الجوائز والمكافآت اليومية
            </span>
            <h1 className="text-2xl font-black text-white">🎡 عجلة حظ TWIX الدوارة</h1>
            <p className="text-neutral-400 text-xs">لف العجلة مرة كل 24 ساعة واكسب مشروبات وساعات لعب صالحة لمدة 7 أيام</p>
          </div>

          <div className="p-3.5 bg-gradient-to-r from-amber-500/10 via-neutral-900 to-amber-500/10 border border-amber-500/30 rounded-3xl text-right space-y-1">
            <strong className="text-amber-300 block text-xs flex items-center gap-1.5">
              <span>💡</span><span>كيف تعمل عجلة الحظ وصلاحية الـ 7 أيام؟</span>
            </strong>
            <p className="text-neutral-300 text-[11px] leading-relaxed">
              لك لفة واحدة مجانية كل 24 ساعة مرتبطة بحسابك وهاتفك. أي جائزة تكسبها تودع في صندوق جوائزك بالأسفل بعد تنازلي لمدة 7 أيام، وتستطيع الضغط على "تفعيل الهدية" ليوافق عليها الأدمن وتخصم من فاتورتك بالصالة فوراً!
            </p>
          </div>

          {/* هيكل العجلة الدوارة مع مؤشر السهم */}
          <div className="relative w-64 h-64 mx-auto flex items-center justify-center">
            <div className="absolute -top-3.5 z-20 text-3xl text-amber-400 drop-shadow">▼</div>
            
            <div className={`w-full h-full rounded-full border-4 border-amber-500/50 bg-neutral-900 shadow-2xl flex items-center justify-center relative overflow-hidden transition-all duration-1000 ${isSpinning ? 'animate-spin' : ''}`}>
              <div className="grid grid-cols-2 grid-rows-3 w-full h-full text-[10px] font-black text-white p-2">
                {wheelSegments.map((seg, idx) => (
                  <div key={idx} className={`flex items-center justify-center text-center p-1 border border-neutral-800 ${idx % 2 === 0 ? 'bg-neutral-950 text-neutral-300' : 'bg-neutral-900 text-amber-400'}`}>
                    <span>{seg.label}</span>
                  </div>
                ))}
              </div>
            </div>

            <button 
              type="button" 
              disabled={isSpinning} 
              onClick={handleTriggerSpin} 
              className="absolute z-10 w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-black text-xs shadow-2xl flex items-center justify-center border-4 border-black active:scale-95 transition-all">
              {isSpinning ? '⏳' : 'دَوّر!'}
            </button>
          </div>

          {spinOutcome && (
            <div className={`p-4 rounded-3xl border shadow-xl ${spinOutcome.type === 'none' ? 'bg-neutral-900 border-neutral-800 text-neutral-400' : 'bg-amber-500/10 border-amber-500/50 text-amber-300'}`}>
              <h3 className="text-base font-black text-white">{spinOutcome.label}</h3>
              <p className="text-[11px] mt-1">
                {spinOutcome.type === 'none' 
                  ? 'حظك المرة القادمة! العجلة ستفتح لك مجدداً بعد 24 ساعة.' 
                  : '🎉 مبروك! تم حفظ الجائزة في حسابك بنجاح، صالحة للاستخدام لمدة 7 أيام بالعد التنازلي بالأسفل.'}
              </p>
            </div>
          )}

          {/* صندوق جوائز العميل بالعد التنازلي التفاعلي لـ 7 أيام */}
          {currentCustomer && currentCustomer.rewards && currentCustomer.rewards.length > 0 && (
            <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-3 text-right shadow-xl">
              <h3 className="font-bold text-white text-xs border-b border-neutral-800 pb-2 flex justify-between items-center">
                <span>🎁 صندوق جوائزي وكوبوناتي النشطة:</span>
                <span className="text-amber-400 font-mono text-[11px]">{currentCustomer.rewards.length} جوائز</span>
              </h3>

              <div className="space-y-2">
                {currentCustomer.rewards.map((rew, index) => {
                  const expiresAtMs = rew.createdAt + ((rew.validDays || 7) * 24 * 60 * 60 * 1000);
                  const diffMs = expiresAtMs - Date.now();
                  const isExpired = diffMs <= 0;
                  const daysLeft = Math.floor(Math.max(0, diffMs) / (1000 * 60 * 60 * 24));
                  const hoursLeft = Math.floor((Math.max(0, diffMs) % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

                  return (
                    <div key={rew.id || index} className={`p-3 rounded-2xl border flex justify-between items-center ${isExpired ? 'bg-neutral-950 border-neutral-900 text-neutral-600' : 'bg-neutral-950 border-amber-500/30 text-amber-300'}`}>
                      <div>
                        <strong className="text-white block text-xs">{rew.title}</strong>
                        <span className="text-[10px] text-neutral-400 block font-mono">
                          {isExpired ? 'انتهت صلاحية الجائزة ✕' : `⏳ باقي: ${daysLeft} يوم و ${hoursLeft} ساعة`}
                        </span>
                      </div>

                      {!isExpired && (
                        <button 
                          type="button" 
                          onClick={() => {
                            playNotificationSound('cash');
                            alert(`تم إرسال طلب تفعيل جائزة [${rew.title}] للأدمن! سيتم اعتمادها وخصمها من فاتورتك في الصالة.`);
                          }} 
                          className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl text-[10px] shadow active:scale-95 transition-all">
                          تفعيل في الصالة ➔
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // 13. صفحة التقييمات وصندوق المقترحات (ReviewsPage)
    // ==========================================
    function ReviewsPage({ reviews, setReviews, suggestions, setSuggestions, currentCustomer }) {
      const [reviewTab, setReviewTab] = useState('reviews'); // 'reviews' | 'suggestions'
      const [authorName, setAuthorName] = useState(currentCustomer ? currentCustomer.name : '');
      const [starRating, setStarRating] = useState(5);
      const [commentText, setCommentText] = useState('');
      const [wishText, setWishText] = useState('');

      const handleAddRealReview = (e) => {
        e.preventDefault();
        if (!commentText.trim()) return;

        const newRev = {
          id: `rev-${Date.now()}`,
          author: authorName.trim() || 'لاعب بالصالة',
          rating: Number(starRating),
          comment: commentText.trim(),
          date: new Date().toISOString().slice(0, 10)
        };

        const updated = [newRev, ...reviews];
        setReviews(updated);
        localStorage.setItem('twix_reviews', JSON.stringify(updated));
        db.collection('reviews').doc(newRev.id).set(newRev);

        setCommentText('');
        playNotificationSound('cash');
        alert('شكراً لك! تم نشر تقييمك الحقيقي في مجتمع الصالة بنجاح.');
      };

      const handleAddSuggestion = (e) => {
        e.preventDefault();

    // 14. الذكاء الاصطناعي للبلايستيشن فقط (GamingAI)
    // ==========================================
    function GamingAIAssistant() {
      const [isOpen, setIsOpen] = useState(false);
      const [aiQuery, setAiQuery] = useState('');
      const [chatLog, setChatLog] = useState([
        { sender: 'ai', text: 'أهلاً بك يا بطل! أنا مساعد الجيمنج الذكي في صالة TWIX 🎮 اسألني عن خطط فيفا، تكتيكات eFootball، أو كومبوهات تكن ومورتال كومبات!' }
      ]);

      const handleAskAI = (e) => {
        e.preventDefault();
        if (!aiQuery.trim()) return;

        const q = aiQuery.trim().toLowerCase();
        let reply = "بخصوص هذا السؤال في الجيمنج: أنصحك بتجربة خطة 4-2-3-1 للسيطرة على وسط الملعب، أو استخدام التمريرات السريعة والتسديد بالـ R1+O لإتقان الـ Finesse Shot!";

        // قفل أمني صارم ضد الاستفسارات الإدارية والسرية
        if (q.includes('ادمن') || q.includes('إدارة') || q.includes('رمز') || q.includes('باسورد') || q.includes('ارباح') || q.includes('كاش') || q.includes('فلوس') || q.includes('شفت')) {
          reply = "🔒 عذراً! أنا مساعد ذكي مبرمج للإجابة عن ألعاب البلايستيشن والخطط والكومبوهات فقط. للاستفسارات الإدارية يرجى التحدث مع كابتن الصالة مباشرة.";
        }

        setChatLog(prev => [...prev, { sender: 'user', text: aiQuery }, { sender: 'ai', text: reply }]);
        setAiQuery('');
      };

      return (
        <div className="fixed bottom-4 left-4 z-40 text-xs">
          {!isOpen ? (
            <button 
              type="button" 
              onClick={() => setIsOpen(true)} 
              className="bg-amber-500 hover:bg-amber-400 text-black font-black px-3.5 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border-2 border-black active:scale-95 transition-all">
              <span className="text-base">🤖</span>
              <span>مساعد الجيمنج الذكي</span>
            </button>
          ) : (
            <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-4 w-80 space-y-3 shadow-2xl">
              <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                <span className="text-amber-400 font-bold flex items-center gap-1.5">
                  <span>🤖</span><span>مساعد بلايستيشن TWIX</span>
                </span>
                <button type="button" onClick={() => setIsOpen(false)} className="text-neutral-400 hover:text-white font-bold">✕</button>
              </div>

              <div className="h-44 overflow-y-auto space-y-2 p-2 bg-neutral-950 rounded-2xl border border-neutral-800 no-scrollbar">
                {chatLog.map((c, i) => (
                  <div key={i} className={`p-2 rounded-xl text-[11px] leading-relaxed ${c.sender === 'ai' ? 'bg-neutral-900 text-neutral-200 border border-neutral-800' : 'bg-amber-500 text-black font-bold mr-auto'}`}>
                    {c.text}
                  </div>
                ))}
              </div>

              <form onSubmit={handleAskAI} className="flex gap-1.5">
                <input 
                  value={aiQuery} 
                  onChange={e => setAiQuery(e.target.value)} 
                  placeholder="اسأل عن خطة أو لعبة..." 
                  className="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-2.5 py-1.5 text-white text-[11px] outline-none" 
                />
                <button type="submit" className="px-3 py-1.5 bg-amber-500 text-black font-black rounded-xl">إرسال</button>
              </form>
            </div>
          )}
        </div>
      );
          }
