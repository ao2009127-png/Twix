    function calcPrice(type, mode, minutes) {
      if (minutes <= 0) return 0;
      const blocks = Math.ceil(minutes / 30);
      const dev = PRICING[type] || PRICING.PS4;
      const m = mode === 'multi' ? dev.multi : dev.single;
      return Math.max(1, blocks) * m.ratePer30;
    }

    function validateEgyptianPhone(p) {

    function calculateLevel(xp = 0) {
      const level = Math.floor(Math.sqrt((xp || 0) / 25)) + 1;
      let title = "مبتدئ (Rookie)";
      let badge = "🥉";
      let color = "text-neutral-400";
      if (level >= 50) { title = "أسطورة TWIX الخالدة (TWIX God)"; badge = "👑"; color = "text-amber-400"; }
      else if (level >= 30) { title = "بطل ماسي (Diamond Master)"; badge = "💎"; color = "text-cyan-400"; }
      else if (level >= 15) { title = "نخبة ذهبية (Gold Elite)"; badge = "🥇"; color = "text-amber-300"; }
      else if (level >= 6)  { title = "مقاتل فضي (Silver Striker)"; badge = "🥈"; color = "text-slate-300"; }
      return { level, title, badge, color, nextLvlXP: Math.pow(level, 2) * 25 };
    }

    function playSound(type = 'click') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start(); osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'win') {
          osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start(); osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) {}
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const max = 700;
            if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
            else if (h > max) { w = Math.round((w * max) / h); h = max; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function PaymentPage({ pendingBooking, bookings, setBookings, currentCustomer, setCurrentCustomer, navigate }) {
      if (!pendingBooking) return <div className="text-center py-20"><button onClick={() => navigate('booking')} className="bg-amber-500 text-black font-bold px-4 py-2 rounded-xl text-xs">الذهاب لصفحة الحجز</button></div>;

      const customerBalance = (currentCustomer && currentCustomer.walletBalance) || 0;
      const [useWallet, setUseWallet] = useState(customerBalance > 0);
      const [selectedWallet, setSelectedWallet] = useState('vodafone');
      const [senderPhone, setSenderPhone] = useState(currentCustomer ? (currentCustomer.phone || '') : '');
      const [receiptImage, setReceiptImage] = useState(null);
      const [copied, setCopied] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [paidSuccess, setPaidSuccess] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const walletDeduction = useWallet ? Math.min(customerBalance, pendingBooking.totalCost) : 0;
      const remainingCash = Math.max(0, pendingBooking.totalCost - walletDeduction);
      const isFullWalletPaid = remainingCash === 0;

      const handleCopyNumber = () => {
        navigator.clipboard.writeText("01289333316");
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const comp = await compressImage(file);
          setReceiptImage(comp);
          setErrorMsg('');
        } catch(err) {
          setErrorMsg('تعذر معالجة الصورة، يرجى اختيار سكرين شوت أخرى.');
        }
      };

      const handleExecutePayment = () => {
        setErrorMsg('');
        if (!isFullWalletPaid) {
          if (!validateEgyptianPhone(senderPhone)) return setErrorMsg('يجب كتابة رقم محفظة التحويل (010, 011, 012, 015) المكون من 11 رقماً.');
          if (!receiptImage) return setErrorMsg('إلزامي: يرجى إرفاق سكرين شوت إيصال التحويل لتأكيد الحجز.');
        }

        setUploading(true);

        const newCustomerBalance = customerBalance - walletDeduction;
        const finalBooking = {
          ...pendingBooking,
          walletDeduction,
          remainingCash,
          paymentMethod: isFullWalletPaid ? 'twix_wallet_full' : `hybrid_${selectedWallet}`,
          senderPhone: isFullWalletPaid ? (currentCustomer?.phone || 'محفظة داخلية') : senderPhone.trim(),
          receiptImage: receiptImage || null,
          status: isFullWalletPaid ? 'confirmed' : 'awaiting_admin_approval',
          createdAt: new Date().toISOString()
        };

        db.collection('bookings').doc(finalBooking.id).set(finalBooking).then(() => {
          if (currentCustomer && walletDeduction > 0) {
            db.collection('customers').doc(currentCustomer.phone || currentCustomer.email).update({
              walletBalance: newCustomerBalance,
              usedPromo: pendingBooking.promoDiscount > 0 ? true : (currentCustomer.usedPromo || false)
            });
            const updated = { ...currentCustomer, walletBalance: newCustomerBalance, usedPromo: pendingBooking.promoDiscount > 0 ? true : (currentCustomer.usedPromo || false) };
            setCurrentCustomer(updated);
            localStorage.setItem('twix_customer', JSON.stringify(updated));
          }
          if (pendingBooking.promoDiscount > 0) {
            localStorage.setItem(`twix_promo_used_${getDeviceFingerprint()}`, 'true');
          }
          setBookings([finalBooking, ...bookings]);
          playSound('win');
          setPaidSuccess(true);
          setUploading(false);
        }).catch(() => {
          if (currentCustomer && walletDeduction > 0) {
            const updated = { ...currentCustomer, walletBalance: newCustomerBalance };
            setCurrentCustomer(updated);
            localStorage.setItem('twix_customer', JSON.stringify(updated));
          }
          setBookings([finalBooking, ...bookings]);
          playSound('win');
          setPaidSuccess(true);
          setUploading(false);
        });
      };

      return (

              <div className="flex justify-between border-b border-neutral-800 pb-2">
                <span>إجمالي الفاتورة المطلوب:</span>

              </div>

              {customerBalance > 0 && (
                <div className="p-3 bg-emerald-500/10 border border-emerald-500/40 rounded-2xl space-y-2">
                  <div className="flex justify-between items-center text-emerald-300 font-bold">
                    <span>رصيد محفظتك المتاح: {customerBalance} ج.م</span>
                    <label className="flex items-center gap-1.5 cursor-pointer bg-black/40 px-2 py-1 rounded-lg border border-emerald-500/30">

    function LuckyWheelPage({ currentCustomer, setCurrentCustomer, navigate }) {
      const [spinning, setSpinning] = useState(false);
      const [wheelResult, setWheelResult] = useState(null);
      const wheelRef = useRef(null);

      const segments = [
        { label: "😅 حظ أوفر القادمة", weight: 65, type: 'none', val: 0 },
        { label: "☕ كوب شاي مجاناً", weight: 20, type: 'snack', val: 'شاي فاخر مجاني' },
        { label: "🥔 خصم 5ج على شيبسي", weight: 10, type: 'discount', val: 5 },
        { label: "🥤 كانز بنصف السعر", weight: 3.5, type: 'discount', val: 12 },
        { label: "⚡ 15د لعب مجانية", weight: 1.0, type: 'time', val: 15 },
        { label: "🏆 نصف ساعة PS5 مجاناً", weight: 0.5, type: 'time', val: 30 }
      ];

      const handleSpin = () => {
        if (!currentCustomer) return alert("يرجى تسجيل الدخول أولاً لحفظ هداياك وكوبوناتك في محفظتك!");
        const fp = getDeviceFingerprint();
        const lastSpinKey = `twix_last_spin_${fp}`;
        const lastSpinTime = Number(localStorage.getItem(lastSpinKey) || 0);
        const cooldown = 24 * 60 * 60 * 1000; // لفة واحدة كل 24 ساعة لكل جهاز وحساب
        if (Date.now() - lastSpinTime < cooldown) {
          const remHours = Math.ceil((cooldown - (Date.now() - lastSpinTime)) / (1000 * 60 * 60));
          return alert(`عفواً! لقد استخدمت لفتك اليومية بالفعل. متبقي ${remHours} ساعة لتتمكن من اللف مرة أخرى.`);
        }

        setSpinning(true);
        setWheelResult(null);

        // حساب النتيجة بالنسب المخفضة المحددة (Weighted Probability)
        const rand = Math.random() * 100;
        let cumulative = 0;
        let selected = segments[0];
        for (const seg of segments) {
          cumulative += seg.weight;
          if (rand <= cumulative) {
            selected = seg;
            break;
          }
        }

        setTimeout(() => {
          setSpinning(false);
          setWheelResult(selected);
          localStorage.setItem(lastSpinKey, Date.now().toString());

          if (selected.type !== 'none') {
            playSound('win');
            const newReward = {
              title: selected.label,
              createdAt: Date.now(),
              validDays: 7,
              used: false
            };
            const updatedRewards = [...(currentCustomer.rewards || []), newReward];
            const updated = { ...currentCustomer, rewards: updatedRewards };
            setCurrentCustomer(updated);
            localStorage.setItem('twix_customer', JSON.stringify(updated));
            db.collection('customers').doc(currentCustomer.phone || currentCustomer.email).set({ rewards: updatedRewards }, { merge: true });
          } else {
            playSound('click');
          }
        }, 3000);
      };

      return (
        <div className="max-w-md mx-auto py-6 space-y-6 text-xs text-center">
          <div className="space-y-1">
            <span className="text-[10px] bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full font-bold">عجلة الجوائز اليومية</span>
            <h1 className="text-2xl font-black text-white">عجلة حظ TWIX الدوارة 🎡</h1>
            <p className="text-neutral-400 text-xs">لف العجلة مرة كل 24 ساعة واكسب مشروبات وساعات لعب صالحة لمدة 7 أيام!</p>
          </div>

          <div className="relative w-64 h-64 mx-auto flex items-center justify-center">
            {/* مؤشر السهم */}
            <div className="absolute -top-3 z-20 text-3xl text-amber-400">▼</div>
            
            {/* جسم العجلة */}
            <div className={`w-full h-full rounded-full border-4 border-amber-500/40 bg-neutral-900 shadow-2xl flex items-center justify-center relative overflow-hidden transition-all duration-1000 ${spinning ? 'animate-spin-wheel' : ''}`}>
              <div className="grid grid-cols-2 grid-rows-3 w-full h-full text-[10px] font-black text-white p-2">
                {segments.map((seg, i) => (
                  <div key={i} className={`flex items-center justify-center text-center p-1 border border-neutral-800 ${i % 2 === 0 ? 'bg-neutral-950 text-neutral-300' : 'bg-neutral-900 text-amber-400'}`}>
                    <span>{seg.label}</span>
                  </div>
                ))}
              </div>
            </div>

            <button disabled={spinning} onClick={handleSpin} className="absolute z-10 w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-black font-black text-xs shadow-xl flex items-center justify-center border-2 border-black active:scale-95 transition-all">
              {spinning ? '⏳' : 'دَوّر!'}
            </button>
          </div>

          {wheelResult && (
            <div className={`p-4 rounded-3xl border shadow-xl ${wheelResult.type === 'none' ? 'bg-neutral-900 border-neutral-800 text-neutral-400' : 'bg-amber-500/10 border-amber-500/40 text-amber-300'}`}>
              <h3 className="text-base font-black text-white">{wheelResult.label}</h3>
              <p className="text-[11px] mt-1">{wheelResult.type === 'none' ? 'حظك المرة الجاية! تقدر تلف العجلة بكرة من جديد.' : 'تم إضافة الجائزة لحسابك صالحة لمدة 7 أيام للاستخدام بالصالة!'}</p>
            </div>
          )}

      );

                e.preventDefault();
                const title = e.target.expTitle.value.trim();
                const amount = Number(e.target.expAmount.value);
                if (title && amount > 0) {
                  setExpenses([{ id: `exp-${Date.now()}`, title, amount, date: todayStr }, ...expenses]);
                  setShowExpenseModal(false);
                  playSound('click');
                  alert(`تم خصم مصروف [${title}] بقيمة ${amount} ج.م من الدرج فوراً!`);
                }
              }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3.5 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <h3 className="font-bold text-white">📉 تسجيل مصروف جديد من الدرج</h3>
                  <button type="button" onClick={() => setShowExpenseModal(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                <input required name="expTitle" placeholder="بند الصرف (كرتونة شيبسي / شاي وسكر / لمبة)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
                <input required type="number" min={1} name="expAmount" placeholder="المبلغ بالجنيه *" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono" />
                <button type="submit" className="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-black rounded-xl shadow">خصم من الدرج الآن</button>
              </form>
            </div>
          )}

          {/* نافذة دفتر الشكك والحسابات المعلقة */}
          {showDebtModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl text-xs max-h-[85vh] overflow-y-auto no-scrollbar">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <h3 className="font-bold text-white">📝 دفتر الشكك والحسابات المعلقة ({totalDebts} ج)</h3>
                  <button type="button" onClick={() => setShowDebtModal(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const cName = e.target.dName.value.trim();
                  const cPhone = e.target.dPhone.value.trim();
                  const amount = Number(e.target.dAmount.value);
                  if (cName && amount > 0) {
                    setDebts([{ id: `debt-${Date.now()}`, customerName: cName, phone: cPhone, amount, paid: false, date: todayStr }, ...debts]);
                    e.target.reset();
                    playSound('click');
                    alert(`تم قيد مبلغ ${amount} ج.م على الزبون (${cName}) في الدفتر!`);
                  }
                }} className="space-y-2 p-3 bg-neutral-950 rounded-2xl border border-neutral-800">
                  <span className="text-amber-400 font-bold block">قيد حساب معلق جديد:</span>
                  <div className="grid grid-cols-2 gap-2">
                    <input required name="dName" placeholder="اسم الزبون *" className="bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-white" />
                    <input name="dPhone" placeholder="رقم الهاتف" className="bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-white font-mono" />
                  </div>
                  <div className="flex gap-2">
                    <input required type="number" min={1} name="dAmount" placeholder="المبلغ المتبقي عليه *" className="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-white font-mono" />
                    <button type="submit" className="px-4 py-2 bg-amber-500 text-black font-black rounded-xl">قيد بالدفتر</button>
                  </div>
                </form>

                <div className="space-y-2">
                  {debts.map(d => (
                    <div key={d.id} className="p-3 bg-neutral-950 border border-neutral-800 rounded-xl flex justify-between items-center">
                      <div>
                        <strong className="text-white block">{d.customerName} {d.phone && `(${d.phone})`}</strong>
                        <span className="text-amber-400 font-mono font-bold">{d.amount} ج.م</span> — <span className="text-[10px] text-neutral-500">{d.date}</span>
                      </div>
                      {!d.paid ? (
                        <button type="button" onClick={() => {
                          setDebts(debts.map(x => x.id === d.id ? { ...x, paid: true } : x));
                          setCompletedSales([{ id: `sale-${Date.now()}`, devName: 'تسديد شكك', customerName: d.customerName, totalCost: d.amount, source: 'in_store', date: todayStr }, ...completedSales]);
                          playSound('win');
                          alert(`تم سداد مبلغ ${d.amount} ج.م ونزوله في كاش الصالة بنجاح!`);
                        }} className="px-2.5 py-1 bg-emerald-500 text-black font-black rounded-lg text-[10px]">
                          ✓ تم السداد
                        </button>
                      ) : (
                        <span className="text-emerald-400 font-bold text-[10px]">مسدد ✓</span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
          {/* نافذة إنشاء وتفعيل حساب عميل يدوي لزبائن الشارع */}
          {showCreateCustomerModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <form onSubmit={(e) => {
                e.preventDefault();
                const name = e.target.cName.value.trim();
                const phone = e.target.cPhone.value.trim();
                const initBalance = Number(e.target.cBalance.value || 0);
                if (!validateEgyptianPhone(phone)) return alert("يرجى كتابة رقم هاتف مصري صحيح (010, 011, 012, 015) مكون من 11 رقماً.");

                const newCustomer = {
                  name: name || `لاعب TWIX`,
                  phone: phone,
                  email: `${phone}@twix.local`,
                  walletBalance: initBalance,
                  xp: 100,
                  rewards: [],
                  myReferralCode: `TX-${phone.slice(-4)}`
                };

                db.collection('customers').doc(phone).set(newCustomer).then(() => {
                  setShowCreateCustomerModal(false);
                  playSound('win');
                  alert(`تم إنشاء وتفعيل حساب الزبون (${name}) بنجاح!\nالزبون يقدر يفتح الموقع ويكتب رقمه (${phone}) ويلاقي حسابه ومحفظته جاهزة فوراً.`);
                });
              }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <h3 className="font-bold text-white">👤 تفعيل حساب زائر صالة جديد</h3>
                  <button type="button" onClick={() => setShowCreateCustomerModal(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">اسم الزبون:</label>
                  <input required name="cName" placeholder="مثال: يوسف أحمد" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">رقم هاتف الزبون (01xxxxxxxxx) *:</label>
                  <input required type="tel" name="cPhone" placeholder="01012345678" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-left" />
                </div>
                <div>
                  <label className="text-[10px] text-neutral-400 block mb-1">رصيد افتتاحي في محفظته (اختياري ج.م):</label>
                  <input type="number" min={0} defaultValue={0} name="cBalance" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-mono text-center" />
                </div>
                <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl shadow">حفظ وتفعيل الحساب سحابياً</button>
              </form>
            </div>
          )}

          {/* نافذة تشغيل جلسة زبون صالة مباشر (Walk-in) مع تسجيل الدراعات */}
          {showWalkInModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <form onSubmit={(e) => {
                e.preventDefault();
                const devId = e.target.wDev.value;
                const dev = devices.find(d => d.id === devId);
                if (!dev) return alert("اختر جهازاً متاحاً!");

                const newSes = {
                  id: `ses-${Date.now()}`,
                  deviceId: dev.id,
                  devName: dev.name,
                  devType: dev.type,
                  customerName: e.target.wName.value.trim() || 'زبون صالة',
                  mode: e.target.wMode.value,
                  controllers: e.target.wControllers.value.trim() || 'C1, C2',
                  startTime: new Date().toISOString(),
                  snacksCost: 0,
                  source: 'in_store'
                };

                setSessions([newSes, ...sessions]);
                setDevices(devices.map(d => d.id === dev.id ? { ...d, status: 'busy' } : d));
                setShowWalkInModal(false);
                playSound('win');
              }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <h3 className="font-bold text-white">تسجيل زبون صالة مباشر (Walk-in)</h3>
                  <button type="button" onClick={() => setShowWalkInModal(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                <input required name="wName" placeholder="اسم الزبون" defaultValue="زبون صالة" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
                <select required name="wDev" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-bold">
                  <option value="">-- اختر شاشة متاحة للتشغيل --</option>
                  {devices.filter(d => d.status === 'available').map(d => (
                    <option key={d.id} value={d.id}>{d.name} ({d.type} VIP)</option>
                  ))}
                </select>
                <div className="grid grid-cols-2 gap-2">
                  <select name="wMode" className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-amber-300 font-bold">
                    <option value="single">فردي (ذراعين)</option>
                    <option value="multi">ملتي (4 ذراعات)</option>
                  </select>
                  <input name="wControllers" placeholder="أكواد الدراعات (C1, C2)" defaultValue="C1, C2" className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-cyan-300 font-mono font-bold" />
                </div>
                <button type="submit" className="w-full py-3 bg-amber-500 text-black font-black rounded-xl shadow-lg">بدء تشغيل الشاشة فوراً 🎮</button>
              </form>
            </div>
          )}

          {/* تقرير الوردية المنظم لمشاركته عبر الواتساب */}
          {showShiftReport && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3.5 shadow-2xl text-xs text-center">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <h3 className="font-bold text-white">📊 ملخص تقفيل الوردية</h3>
                  <button type="button" onClick={() => setShowShiftReport(false)} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                <div className="p-3 bg-neutral-950 rounded-2xl border border-neutral-800 text-right space-y-1 text-[11px] leading-relaxed">
                  <div>🏢 الصالة: <strong>TWIX Gaming Lounge</strong></div>
                  <div>📅 التاريخ: <strong>{todayStr}</strong></div>
                  <div>💵 كاش الصالة المحصل: <strong className="text-emerald-400">{inStoreRevenue} ج.م</strong></div>
                  <div>🌐 إيرادات الأونلاين المعتمدة: <strong className="text-blue-400">{onlineRevenue} ج.م</strong></div>
                  <div>📉 المصاريف والخوارج: <strong className="text-rose-400">-{totalExpenses} ج.م</strong></div>
                  <div className="border-t border-neutral-800 pt-1 text-xs">
                    <strong className="text-amber-400">💵 صافي الدرج المطلوب بالجنيه: {netDrawerCash} ج.م</strong>
                  </div>
                </div>
                <a href={`https://wa.me/${SITE_CONFIG.whatsappNumber}?text=${encodeURIComponent(
                  `📊 تقرير وردية صالة TWIX (${todayStr}):\n- كاش الصالة: ${inStoreRevenue} ج\n- إيرادات الأونلاين: ${onlineRevenue} ج\n- المصاريف: ${totalExpenses} ج\n- صافي كاش الدرج المطلوب: ${netDrawerCash} ج.م`
                )}`} target="_blank" className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-xl flex items-center justify-center gap-1.5 shadow-lg">
                  📲 إرسال التقرير لواتساب صاحب الصالة
                </a>
              </div>
            </div>
          )}

          {/* نافذة معاينة صورة الإيصال أو بطاقة العيد ميلاد بحجم كبير */}
          {viewReceiptImg && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm p-4">
              <div className="bg-neutral-900 border border-neutral-700 rounded-3xl p-5 max-w-md w-full space-y-3 text-center">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <h3 className="font-bold text-white text-xs">معاينة المستند المرفوع</h3>
                  <button type="button" onClick={() => setViewReceiptImg(null)} className="text-neutral-400 hover:text-white font-bold">✕</button>
                </div>
                <img src={viewReceiptImg} alt="Proof" className="max-h-[65vh] mx-auto rounded-xl object-contain border border-neutral-800 shadow-md" />
                <button type="button" onClick={() => setViewReceiptImg(null)} className="w-full py-2 bg-neutral-800 text-white rounded-xl text-xs font-bold">إغلاق المعاينة</button>
              </div>
            </div>
          )}

          {/* الفاتورة الحرارية المخصصة للطابعات 80mm */}
          {printableReceipt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="bg-white text-black rounded-3xl p-6 max-w-xs w-full space-y-3 shadow-2xl text-xs">
                <div id="printable-receipt" className="space-y-2 text-center border-b pb-3 text-black">
                  <h2 className="font-black text-lg">TWIX Gaming Lounge</h2>
                  <p className="text-[10px] text-neutral-600">بون حساب معتمد — ت: {SITE_CONFIG.phone}</p>
                  <div className="text-[11px] text-right space-y-1 pt-2 border-t border-dashed">
                    <div>الجهاز: <strong>{printableReceipt.devName}</strong></div>
                    <div>العميل: <strong>{printableReceipt.customerName}</strong></div>
                    <div>المدة: <strong>{printableReceipt.durationMins || 30} دقيقة</strong></div>
                    {printableReceipt.controllersCondition && <div>حالة الدراعات: <strong>{printableReceipt.controllersCondition}</strong></div>}
                  </div>
                  <div className="text-base font-black pt-2 border-t border-dashed flex justify-between">
                    <span>الإجمالي المستحق:</span>
                    <span>{printableReceipt.totalCost} ج.م</span>
                  </div>
                  <p className="text-[9px] text-neutral-500 pt-1 font-mono">شكراً لزيارتكم TWIX! نتمنى لكم يوماً سعيداً 🎮</p>
                </div>
                <div className="flex gap-2 pt-1">
                  <button type="button" onClick={() => window.print()} className="flex-1 py-2 bg-black text-white font-bold rounded-xl text-xs">🖨️ طباعة البون</button>
                  <button type="button" onClick={() => setPrintableReceipt(null)} className="flex-1 py-2 bg-neutral-200 text-neutral-800 font-bold rounded-xl text-xs">إغلاق</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
