if (rec) { setRec(false); try { srRef.current?.stop(); } catch {} try { mrRef.current?.stop(); } catch {} return; }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) { try { const r = new SR(); r.lang = 'ar-EG'; r.interimResults = false; r.onresult = (ev) => { const txt = ev.results?.[0]?.[0]?.transcript; if (txt) onTranscript(txt); setRec(false); }; r.onerror = () => { setRec(false); startMedia(); }; r.onend = () => setRec(false); srRef.current = r; setRec(true); r.start(); return; } catch {} }
startMedia();
};

try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true }), mr = new MediaRecorder(stream), chunks = [];
mr.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); const rd = new FileReader(); rd.onloadend = () => { if (rd.result) onAudioData(rd.result); }; rd.readAsDataURL(new Blob(chunks, { type: mr.mimeType || 'audio/webm' })); };

} catch { alert('اسمح للمتصفح بالميكروفون.'); setRec(false); }
};

} catch { pushAi({ sender: 'ai', text: '⚠️ تعذر الاتصال بالمساعد.' }); } finally { setAiLoading(false); }
};

);

</div>
