    function calcPrice(type, mode, minutes) {
      if (minutes <= 0) return 0;
      const blocks = Math.ceil(minutes / 30);
      const dev = PRICING[type] || PRICING.PS4;
      const m = mode === 'multi' ? dev.multi : dev.single;
      return Math.max(1, blocks) * m.ratePer30;
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const max = 700;
            if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
            else if (h > max) { w = Math.round((w * max) / h); h = max; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function playAlertChime(freq1 = 587, freq2 = 880) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(freq1, ctx.currentTime);
        osc.frequency.setValueAtTime(freq2, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.7);
        osc.start(); osc.stop(ctx.currentTime + 0.7);
      } catch(e) {}
    }

    function BookingPage({ devices, bookings, sessions, currentCustomer, setPendingBooking, navigate, setShowQuickMenu, setSplitBillModal }) {
      const [name, setName] = useState(currentCustomer ? currentCustomer.name : '');
      const [email, setEmail] = useState(currentCustomer ? currentCustomer.email : '');
      const [phone, setPhone] = useState('');
      const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [time, setTime] = useState('16:00');
      const [policyChecked, setPolicyChecked] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      
      const [items, setItems] = useState([{ deviceType: 'PS5', mode: 'single', duration: 30 }]);
      const [snacks, setSnacks] = useState({});

      const updateSnackQty = (id, delta) => setSnacks(prev => ({ ...prev, [id]: Math.max(0, (prev[id] || 0) + delta) }));
      const addItem = () => setItems([...items, { deviceType: 'PS4', mode: 'single', duration: 30 }]);
      const removeItem = (idx) => items.length > 1 && setItems(items.filter((_, i) => i !== idx));
      const updateItem = (idx, field, val) => { const next = [...items]; next[idx][field] = val; setItems(next); setErrorMsg(null); };

      const devicesTotal = items.reduce((sum, itm) => sum + calcPrice(itm.deviceType, itm.mode, itm.duration), 0);
      const snacksTotal = SNACKS_MENU.reduce((sum, s) => sum + ((snacks[s.id] || 0) * s.price), 0);
      const grandTotal = devicesTotal + snacksTotal;

      const validateCapacity = () => {
        const reqStart = new Date(`${date}T${time}:00`).getTime();
        for (const itm of items) {
          const type = itm.deviceType;
          const totalInLounge = devices.filter(d => d.type === type && d.status !== 'maintenance').length;
          if (totalInLounge === 0) return { valid: false, error: `للأسف جميع أجهزة ${type} في الصيانة حالياً.` };
          
          let bookedCount = 0, latestEndMs = 0;
          bookings.forEach(b => {
            if (b.status === 'rejected' || b.status === 'cancelled' || b.date !== date) return;
            b.items && b.items.forEach(bItem => {
              if (bItem.deviceType === type) {
                const bStart = new Date(`${b.date}T${b.time}:00`).getTime();
                const bEnd = bStart + ((bItem.duration || 30) * 60 * 1000);
                if (reqStart < bEnd && (reqStart + itm.duration * 60 * 1000) > bStart) { 
                  bookedCount++; 
                  if (bEnd > latestEndMs) latestEndMs = bEnd; 
                }
              }
            });
          });

          const todayStr = new Date().toISOString().slice(0, 10);
          if (date === todayStr) {
            sessions.forEach(s => { if (s.devType === type) bookedCount++; });
          }

          const requestedInOrder = items.filter(x => x.deviceType === type).length;
          if ((bookedCount + requestedInOrder - 1) >= totalInLounge) {
            const nextFree = latestEndMs > 0 ? new Date(latestEndMs).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : 'لاحقاً';
            return { valid: false, error: `عفواً! أجهزة (${type}) مشغولة بالكامل في هذا التوقيت (${totalInLounge} أجهزة). أقرب وقت متاح تقريباً هو الساعة ${nextFree}.` };
          }
        }
        return { valid: true };
      };

      const handleProceed = (e) => {
        e.preventDefault(); setErrorMsg(null);
        if (!name.trim()) return setErrorMsg("يرجى كتابة اسم العميل.");
        if (!validateEgyptianPhone(phone)) return setErrorMsg("يرجى كتابة رقم هاتف مصري صحيح (010, 011, 012, 015) مكون من 11 رقم.");
        if (!policyChecked) return setErrorMsg("يجب الموافقة الصريحة على شروط وسياسة الحجز.");
        const check = validateCapacity();
        if (!check.valid) return setErrorMsg(check.error);

        const snacksSummaryArr = [];
        SNACKS_MENU.forEach(s => { if ((snacks[s.id] || 0) > 0) snacksSummaryArr.push(`${s.name} x${snacks[s.id]}`); });

        setPendingBooking({
          id: `bk-${Date.now()}`, ref: `TWIX-${Math.floor(100000 + Math.random() * 900000)}`,
          customerName: name, email: email.trim().toLowerCase(), phone, date, time, items, snacks,
          source: 'online', snacksCost: snacksTotal, devicesCost: devicesTotal, snacksSummary: snacksSummaryArr.join('، '),
          totalCost: grandTotal, status: 'awaiting_payment'
        });
        navigate('payment');
      };

      return (

              <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="إيميل Google (للسكور والمكافآت)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-[10px] text-neutral-400 block mb-1">تاريخ الحجز:</label><input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" /></div>
              <div><label className="text-[10px] text-neutral-400 block mb-1">وقت البدء:</label><input type="time" value={time} onChange={e => setTime(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white" /></div>
            </div>

            <div className="space-y-3 pt-2">
              <div className="flex justify-between items-center"><span className="text-xs font-bold text-amber-400">🎮 اختيار الأجهزة ونمط اللعب:</span><button type="button" onClick={addItem} className="text-xs bg-neutral-800 hover:bg-neutral-700 text-amber-400 px-3 py-1 rounded-lg font-bold">+ جهاز إضافي</button></div>
              {items.map((itm, i) => (
                <div key={i} className="p-3 bg-neutral-950 border border-neutral-800 rounded-2xl flex flex-wrap items-center justify-between gap-2">
                  <select value={itm.deviceType} onChange={e => updateItem(i, 'deviceType', e.target.value)} className="bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-xs text-white font-bold">
                    <option value="PS5">PlayStation 5 VIP</option>
                    <option value="PS4">PlayStation 4 Pro</option>

                  <select value={itm.mode} onChange={e => updateItem(i, 'mode', e.target.value)} className="bg-neutral-900 border border-neutral-800 rounded-xl p-2 text-xs text-amber-300 font-bold">
                    <option value="single">فردي (مع صديق - ذراعين)</option>
                    <option value="multi">ملتي (4 ذراعات - شلة)</option>
                  </select>

                  {items.length > 1 && <button type="button" onClick={() => removeItem(i)} className="text-rose-400 text-xs px-2">حذف</button>}
                </div>
              ))}
            </div>

            <div className="space-y-3 pt-2 border-t border-neutral-800">
              <div className="flex justify-between items-center"><span className="text-xs font-bold text-amber-400">☕ الكافتيريا والسناكس (اختياري لطاولتك):</span><span className="text-[11px] text-neutral-400">إجمالي الطلبات: {snacksTotal} ج.م</span></div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">

                      <span className="text-xs font-bold text-white">{snacks[snack.id] || 0}</span>
                      <button type="button" onClick={() => updateSnackQty(snack.id, 1)} className="w-6 h-6 bg-amber-500 text-black rounded-lg flex items-center justify-center font-bold text-xs">+</button>

              <div><span className="text-neutral-400 block">إجمالي الحجز الشامل:</span><span className="text-[10px] text-neutral-500">أجهزة: {devicesTotal} ج | طلبات: {snacksTotal} ج</span></div>
              <div className="flex items-center gap-3">
                <button type="button" onClick={() => setSplitBillModal({ total: grandTotal })} className="px-2.5 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-amber-300 font-bold rounded-xl text-[11px] border border-amber-500/30">👥 قطية الشلة</button>

              <span className="text-[11px] font-bold text-amber-200">أوافق صراحة على شروط وسياسة الحجز المعتمدة بـ TWIX</span>

            <button type="submit" className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl text-sm shadow-lg shadow-amber-500/20">المتابعة إلى الدفع والتأكيد ({grandTotal} ج.م)</button>

              }
    function PaymentPage({ pendingBooking, bookings, setBookings, currentCustomer, setCurrentCustomer, navigate }) {
      if (!pendingBooking) return <div className="text-center py-20"><button onClick={() => navigate('booking')} className="bg-amber-500 text-black font-bold px-4 py-2 rounded-xl text-xs">الذهاب للحجز</button></div>;
      
      const [selectedWallet, setSelectedWallet] = useState('vodafone');
      const [senderPhone, setSenderPhone] = useState('');
      const [copied, setCopied] = useState(false);
      const [receiptImage, setReceiptImage] = useState(null);
      const [paid, setPaid] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const canPayWithWallet = currentCustomer && (currentCustomer.walletBalance || 0) >= pendingBooking.totalCost;

      const handleCopyNumber = () => {
        navigator.clipboard.writeText("01289333316");
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const compressed = await compressImage(file);
          setReceiptImage(compressed);
          setErrorMsg('');
        } catch(err) {
          setErrorMsg('تعذر معالجة الصورة، اختر صورة أخرى.');
        }
      };

      const handleWalletPayment = () => {
        if (!canPayWithWallet) return;
        setUploading(true);
        const newBalance = currentCustomer.walletBalance - pendingBooking.totalCost;
        const finalBooking = {
          ...pendingBooking,
          paymentMethod: 'twix_wallet',
          senderPhone: currentCustomer.email,
          status: 'confirmed',
          createdAt: new Date().toISOString()
        };

        db.collection('bookings').doc(pendingBooking.id).set(finalBooking).then(() => {
          db.collection('customers').doc(currentCustomer.email).update({ walletBalance: newBalance });
          const updatedCustomer = { ...currentCustomer, walletBalance: newBalance };
          setCurrentCustomer(updatedCustomer);
          localStorage.setItem('twix_customer', JSON.stringify(updatedCustomer));
          setBookings([finalBooking, ...bookings]);
          setPaid(true);
          setUploading(false);
        }).catch(err => {
          console.error(err);
          setUploading(false);
        });
      };

      const handleSubmitPayment = () => {
        setErrorMsg('');
        if (!validateEgyptianPhone(senderPhone)) {
          return setErrorMsg("يجب إدخال رقم المحفظة التي قمت بالتحويل منها (010, 011, 012, 015) مكون من 11 رقماً.");
        }
        if (!receiptImage) {
          return setErrorMsg("إلزامي: يرجى إرفاق صورة/سكرين شوت إيصال التحويل لتأكيد الحجز.");
        }
        setUploading(true);
        const finalBooking = {
          ...pendingBooking,
          paymentMethod: selectedWallet,
          senderPhone: senderPhone.trim(),
          receiptImage: receiptImage,
          status: 'awaiting_admin_approval',
          createdAt: new Date().toISOString()
        };

        db.collection('bookings').doc(pendingBooking.id).set(finalBooking).then(() => {
          setBookings([finalBooking, ...bookings]);
          setPaid(true);
          setUploading(false);
        }).catch(err => {
          setBookings([finalBooking, ...bookings]);
          setPaid(true);
          setUploading(false);
        });
      };

      return (
        <div className="max-w-md mx-auto py-8 px-4 space-y-6">
          <div className="text-center space-y-1">
            <span className="text-[10px] bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full font-bold">بوابة الدفع والتأكيد الرسمية</span>
            <h1 className="text-2xl font-black text-white">إتمام الحجز والدفع</h1>
          </div>

          {!paid ? (
            <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl space-y-4 text-xs shadow-xl">
              <div className="flex justify-between border-b border-neutral-800 pb-2">
                <span>الرقم المرجعي للحجز:</span>
                <strong className="text-amber-400 font-mono text-sm">{pendingBooking.ref}</strong>
              </div>
              <div className="flex justify-between border-b border-neutral-800 pb-2">
                <span>المبلغ المطلوب سداده:</span>
                <strong className="text-white text-base">{pendingBooking.totalCost} ج.م</strong>
              </div>

              {canPayWithWallet && (
                <div className="p-3 bg-emerald-500/10 border border-emerald-500/40 rounded-2xl space-y-2">
                  <div className="flex justify-between items-center text-emerald-300 font-bold">
                    <span>رصيدك في TWIX: {currentCustomer.walletBalance} ج</span>
                    <span>✓ يكفي للدفع الفوري</span>
                  </div>
                  <button type="button" disabled={uploading} onClick={handleWalletPayment} className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-xl text-xs shadow-lg transition-all">
                    ⚡ دفع فوري بخصم من رصيد محفظتي ({pendingBooking.totalCost} ج)
                  </button>
                </div>
              )}

              {canPayWithWallet && <div className="text-center text-[11px] text-neutral-500 font-bold">— أو الدفع عبر محافظ الكاش —</div>}

              <div className="space-y-2">
                <span className="text-neutral-300 font-bold block">1. اختر محفظة التحويل:</span>
                <div className="grid grid-cols-2 gap-2">
                  {[
                    { id: 'vodafone', name: 'فودافون كاش', color: 'border-rose-500/50 text-rose-400' },
                    { id: 'orange', name: 'أورانج كاش', color: 'border-orange-500/50 text-orange-400' },
                    { id: 'etisalat', name: 'اتصالات كاش', color: 'border-emerald-500/50 text-emerald-400' },
                    { id: 'wepay', name: 'وي باي (WE)', color: 'border-purple-500/50 text-purple-400' }
                  ].map(w => (
                    <button key={w.id} type="button" onClick={() => setSelectedWallet(w.id)} className={`p-2.5 rounded-xl border font-bold text-center transition-all ${selectedWallet === w.id ? 'bg-amber-500 text-black border-amber-500 shadow-md' : `bg-neutral-950 ${w.color}`}`}>
                      {w.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-neutral-950 p-3.5 rounded-2xl border border-neutral-800 space-y-1.5 text-center">
                <span className="text-[11px] text-neutral-400 block">2. حوّل المبلغ ({pendingBooking.totalCost} ج) لرقم المحفظة الرسمي:</span>
                <div className="flex items-center justify-center gap-2">
                  <span className="font-mono text-lg font-black text-amber-400 tracking-wider">01289333316</span>
                  <button type="button" onClick={handleCopyNumber} className="px-2.5 py-1 bg-neutral-800 hover:bg-neutral-700 text-white rounded-lg text-[11px] font-bold border border-neutral-700">
                    {copied ? '✓ تم النسخ' : '📋 نسخ الرقم'}
                  </button>
                </div>
              </div>

              <div className="space-y-1.5">
                <span className="text-neutral-300 font-bold block">3. رقم محفظتك التي قمت بالتحويل منها *:</span>
                <input required type="tel" value={senderPhone} onChange={e => setSenderPhone(e.target.value)} placeholder="رقم المحفظة (010, 011, 012, 015)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white text-left font-mono" />
              </div>

              <div className="space-y-1.5">
                <span className="text-neutral-300 font-bold block">4. إرفاق صورة/سكرين شوت التحويل (إجباري) 📸:</span>
                <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full text-xs text-neutral-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-neutral-800 file:text-amber-400 cursor-pointer bg-neutral-950 p-1.5 rounded-xl border border-neutral-800" />
                {receiptImage && <img src={receiptImage} alt="Receipt" className="max-h-28 mx-auto rounded-xl border border-emerald-500/40 object-contain shadow-md mt-1" />}
              </div>

              {errorMsg && <div className="p-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs rounded-xl text-center">⚠️ {errorMsg}</div>}

              <button type="button" disabled={uploading} onClick={handleSubmitPayment} className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-xl text-xs shadow-lg shadow-emerald-500/20 transition-all">
                {uploading ? 'جاري إرسال الحجز...' : `تأكيد وإرسال الحجز (${pendingBooking.totalCost} ج.م)`}
              </button>
            </div>
          ) : (
            <div className="bg-neutral-900 border border-emerald-500/40 p-6 rounded-3xl text-center space-y-4 shadow-2xl">
              <div className="text-5xl">🎉</div>
              <h2 className="text-xl font-black text-white">تم إرسال حجزك بنجاح!</h2>
              <p className="text-xs text-neutral-300 leading-relaxed">
                رقم الحجز: <strong className="text-amber-400 font-mono">{pendingBooking.ref}</strong><br />
                تم استلام بيانات التحويل وسيتم تأكيد الحجز فوراً من الإدارة.
              </p>
              <a href={SITE_CONFIG.mapsUrl} target="_blank" className="w-full py-2.5 bg-neutral-800 hover:bg-neutral-700 text-amber-300 border border-amber-500/30 rounded-xl text-xs font-black flex items-center justify-center gap-2">
                📍 فتح موقع الصالة على Google Maps (GPS)
              </a>
              <div className="flex gap-2 pt-1">
                <button onClick={() => navigate('account')} className="flex-1 py-2.5 bg-neutral-800 text-white font-bold rounded-xl text-xs">عرض في حسابي</button>
                <button onClick={() => navigate('home')} className="flex-1 py-2.5 bg-amber-500 text-black font-black rounded-xl text-xs">الرئيسية</button>
              </div>
            </div>
          )}
        </div>
      );
              }
    function WalletTopupModal({ showTopupModal, setShowTopupModal, currentCustomer }) {
      if (!showTopupModal || !currentCustomer) return null;
      const [amount, setAmount] = useState(100);
      const [wallet, setWallet] = useState('vodafone');
      const [phone, setPhone] = useState('');
      const [receipt, setReceipt] = useState(null);
      const [copied, setCopied] = useState(false);
      const [loading, setLoading] = useState(false);
      const [msg, setMsg] = useState('');

      const handleUpload = async (e) => {
        if (!e.target.files[0]) return;
        const comp = await compressImage(e.target.files[0]);
        setReceipt(comp);
      };

      const handleSendTopup = () => {
        if (!validateEgyptianPhone(phone)) return setMsg("يرجى كتابة رقم محفظة مصري صحيح (010, 011, 012, 015).");
        if (!receipt) return setMsg("إلزامي: يرجى إرفاق سكرين شوت إيصال التحويل.");
        setLoading(true);

        const reqData = {
          id: `top-${Date.now()}`,
          customerName: currentCustomer.name,
          customerEmail: currentCustomer.email,
          amount: Number(amount),
          wallet,
          senderPhone: phone.trim(),
          receiptImage: receipt,
          status: 'pending',
          createdAt: new Date().toISOString()
        };

        db.collection('wallet_requests').doc(reqData.id).set(reqData).then(() => {
          alert("تم إرسال طلب شحن الرصيد للإدارة بنجاح! سيتم مراجعة الإيصال وإيداع المبلغ في محفظتك فوراً.");
          setLoading(false);
          setShowTopupModal(false);
        }).catch(() => {
          alert("حدث خطأ أثناء الإرسال، تأكد من اتصالك بالإنترنت.");
          setLoading(false);
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
          <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3.5 shadow-2xl text-xs max-h-[90vh] overflow-y-auto no-scrollbar">
            <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
              <h3 className="font-bold text-white text-sm">➕ طلب شحن رصيد في محفظة TWIX</h3>
              <button onClick={() => setShowTopupModal(false)} className="text-neutral-400 hover:text-white font-bold">✕</button>
            </div>
            <div>
              <label className="text-[11px] text-neutral-400 block mb-1">المبلغ المطلوب شحنه (ج.م):</label>
              <div className="grid grid-cols-4 gap-1.5 mb-2">
                {[50, 100, 200, 500].map(amt => (
                  <button key={amt} type="button" onClick={() => setAmount(amt)} className={`py-1.5 rounded-lg font-bold ${amount === amt ? 'bg-amber-500 text-black' : 'bg-neutral-950 text-neutral-300 border border-neutral-800'}`}>{amt}ج</button>
                ))}
              </div>
              <input type="number" min={20} value={amount} onChange={e => setAmount(Number(e.target.value))} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-bold text-center" />
            </div>
            <div>
              <label className="text-[11px] text-neutral-400 block mb-1">اختر محفظة التحويل:</label>
              <div className="grid grid-cols-2 gap-1.5">
                {['vodafone:فودافون كاش', 'orange:أورانج كاش', 'etisalat:اتصالات كاش', 'wepay:وي باي'].map(w => {
                  const [id, label] = w.split(':');
                  return <button key={id} type="button" onClick={() => setWallet(id)} className={`p-2 rounded-xl font-bold ${wallet === id ? 'bg-amber-500 text-black' : 'bg-neutral-950 text-neutral-300 border border-neutral-800'}`}>{label}</button>;
                })}
              </div>
            </div>
            <div className="bg-neutral-950 p-2.5 rounded-xl border border-neutral-800 text-center space-y-1">
              <span className="text-[10px] text-neutral-400 block">حوّل ({amount} ج) للرقم الرسمي:</span>
              <div className="flex items-center justify-center gap-2">
                <span className="font-mono text-sm font-black text-amber-400">01289333316</span>
                <button type="button" onClick={() => { navigator.clipboard.writeText("01289333316"); setCopied(true); setTimeout(() => setCopied(false), 2000); }} className="px-2 py-0.5 bg-neutral-800 text-white rounded text-[10px]">{copied ? '✓ تم' : 'نسخ'}</button>
              </div>
            </div>
            <input required type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="رقم محفظتك المحول منها (010, 011..)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-mono text-left" />
            <div>
              <span className="text-[10px] text-neutral-400 block mb-1">إرفاق سكرين شوت التحويل 📸:</span>
              <input type="file" accept="image/*" onChange={handleUpload} className="w-full bg-neutral-950 p-1 rounded-xl border border-neutral-800 text-[10px] text-neutral-400 file:bg-neutral-800 file:text-amber-400 file:border-0 file:rounded-lg file:px-2 file:py-1 cursor-pointer" />
              {receipt && <img src={receipt} className="max-h-20 mx-auto rounded-lg border border-emerald-500/40 mt-1" />}
            </div>
            {msg && <div className="text-rose-400 text-[11px] text-center font-bold">⚠️ {msg}</div>}

    }

    const DEFAULT_HASH = "MTQ3MA==";
    function verifyPass(input) {
      const savedHash = localStorage.getItem('twix_admin_pin_hash') || DEFAULT_HASH;
      try {
        return btoa(input.trim()) === savedHash;
      } catch(e) {
        return false;
      }
    }

    function AdminPage({ devices, setDevices, bookings, setBookings, sessions, setSessions, completedSales, setCompletedSales, expenses, setExpenses, reviews, setReviews, now }) {
      const [authed, setAuthed] = useState(() => sessionStorage.getItem('twix_admin_auth') === 'true');
      const [pin, setPin] = useState('');
      const [error, setError] = useState(false);

      const [showWalkInModal, setShowWalkInModal] = useState(false);
      const [showQuickPOS, setShowQuickPOS] = useState(false);
      const [showExpenseModal, setShowExpenseModal] = useState(false);
      const [receiptData, setReceiptData] = useState(null);
      const [viewReceiptImg, setViewReceiptImg] = useState(null);
      const [editingBooking, setEditingBooking] = useState(null);

      const [topupRequests, setTopupRequests] = useState([]);
      const [viewTopupReceipt, setViewTopupReceipt] = useState(null);

      const [walkInDevice, setWalkInDevice] = useState('');
      const [walkInCustomerName, setWalkInCustomerName] = useState('زبون صالة');
      const [walkInMode, setWalkInMode] = useState('single');
      const [walkInTimerType, setWalkInTimerType] = useState('open');
      const [walkInTargetMins, setWalkInTargetMins] = useState(30);

      const [transferSessionTarget, setTransferSessionTarget] = useState(null);

      useEffect(() => {
        const unsub = db.collection('wallet_requests').where('status', '==', 'pending').onSnapshot(snap => {
          const list = [];
          snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setTopupRequests(list);
        }, () => {});
        return () => unsub();
      }, []);

      if (!authed) {
        return (
          <div className="max-w-sm mx-auto py-16 px-4 space-y-5">
            <div className="w-12 h-12 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto text-amber-400 text-xl font-black">🔒</div>
            <h1 className="text-xl font-black text-white text-center">لوحة تحكم الإدارة السرية</h1>
            <p className="text-xs text-neutral-400 text-center">منطقة مخصصة لإدارة الصالة ومتابعة الشيفت والدرج</p>
            {error && <div className="p-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-center rounded-xl font-bold">الرمز السري غير صحيح، حاول مرة أخرى.</div>}
            <form onSubmit={(e) => { 
              e.preventDefault(); 
              if (verifyPass(pin)) { 
                setAuthed(true); 
                sessionStorage.setItem('twix_admin_auth', 'true'); 
                setError(false); 
              } else { 
                setError(true); 
                setPin(''); 
              } 
            }} className="space-y-4">
              <input type="password" inputMode="numeric" pattern="[0-9]*" required autoFocus value={pin} onChange={e => { setPin(e.target.value); setError(false); }} placeholder="••••" className="w-full bg-neutral-900 border border-neutral-800 rounded-2xl py-3 px-4 text-center text-xl tracking-widest text-white focus:border-amber-500 focus:outline-none" />
              <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl text-sm shadow-lg shadow-amber-500/20">تأكيد الدخول</button>
            </form>
          </div>
        );
      }
      const todayStr = new Date().toISOString().slice(0, 10);
      const totalScreens = devices.length;
      const occupiedScreens = devices.filter(d => d.status === 'busy').length;
      const availableScreens = devices.filter(d => d.status === 'available').length;
      const maintenanceScreens = devices.filter(d => d.status === 'maintenance').length;

      const onlineRevenue = bookings.filter(b => b.status === 'confirmed').reduce((sum, b) => sum + (b.totalCost || 0), 0);
      const inStoreRevenue = completedSales.filter(s => s.source === 'in_store').reduce((sum, s) => sum + (s.totalCost || 0), 0);
      const onlineSnacks = bookings.filter(b => b.status === 'confirmed').reduce((sum, b) => sum + (b.snacksCost || 0), 0);
      const inStoreSnacks = completedSales.reduce((sum, s) => sum + (s.snacksCost || 0), 0);
      const totalSnacksRevenue = onlineSnacks + inStoreSnacks;
      const totalExpenses = expenses.reduce((sum, ex) => sum + ex.amount, 0);
      const netDrawerCash = inStoreRevenue - totalExpenses;

      const handleChangePin = () => {
        const newPin = prompt("أدخل الرمز السري الجديد للإدارة (أرقام فقط):");
        if (newPin && newPin.trim().length >= 4) {
          localStorage.setItem('twix_admin_pin_hash', btoa(newPin.trim()));
          alert("تم تغيير الرمز السري وتحديث أمان الصالة بنجاح!");
        } else if (newPin) {
          alert("الرمز يجب ألا يقل عن 4 أرقام.");
        }
      };

      const handleStartWalkIn = (e) => {
        e.preventDefault();
        const dev = devices.find(d => d.id === walkInDevice);
        if (!dev) return alert("اختر جهازاً متاحاً للتشغيل!");

        const newSession = {
          id: `ses-${Date.now()}`,
          deviceId: dev.id,
          devName: dev.name,
          devType: dev.type,
          customerName: walkInCustomerName || 'زبون صالة',
          mode: walkInMode,
          timerType: walkInTimerType,
          targetMins: Number(walkInTargetMins) || 30,
          startTime: new Date().toISOString(),
          snacks: {},
          snacksCost: 0,
          source: 'in_store'
        };

        setSessions([newSession, ...sessions]);
        setDevices(devices.map(d => d.id === dev.id ? { ...d, status: 'busy' } : d));
        setShowWalkInModal(false);
        setWalkInDevice('');
      };

      const addSnackToSession = (sessionId, snackId) => {
        const item = SNACKS_MENU.find(s => s.id === snackId);
        setSessions(sessions.map(s => {
          if (s.id === sessionId) {
            const currentQty = (s.snacks && s.snacks[snackId]) || 0;
            return {
              ...s,
              snacks: { ...(s.snacks || {}), [snackId]: currentQty + 1 },
              snacksCost: (s.snacksCost || 0) + item.price
            };
          }
          return s;
        }));
      };

      const executeTransfer = (fromSession, toDeviceId) => {
        const toDev = devices.find(d => d.id === toDeviceId);
        if (!toDev || toDev.status !== 'available') return alert("الجهاز المختار غير متاح!");

        setDevices(devices.map(d => {
          if (d.id === fromSession.deviceId) return { ...d, status: 'available' };
          if (d.id === toDev.id) return { ...d, status: 'busy' };
          return d;
        }));

        setSessions(sessions.map(s => {
          if (s.id === fromSession.id) {
            return { ...s, deviceId: toDev.id, devName: toDev.name, devType: toDev.type };
          }
          return s;
        }));

        setTransferSessionTarget(null);
      };

      // إنهاء الجلسة العادي
      const endSession = (s, discountRewardHours = 0) => {
        const sec = Math.max(0, Math.floor((now - new Date(s.startTime).getTime()) / 1000));
        const minsBilled = Math.max(1, Math.ceil(sec / 60));
        let timeCost = calcPrice(s.devType, s.mode, minsBilled);
        
        if (discountRewardHours > 0) {
          const hourRate = (PRICING[s.devType] || PRICING.PS4)[s.mode === 'multi' ? 'multi' : 'single'].ratePerHour;
          timeCost = Math.max(0, timeCost - (hourRate * discountRewardHours));
        }

        const snacksCost = s.snacksCost || 0;
        const total = timeCost + snacksCost;

        const saleRecord = {
          id: `sale-${Date.now()}`,
          devName: s.devName,
          devType: s.devType,
          customerName: s.customerName,
          mode: s.mode,
          durationMins: minsBilled,
          timeCost,
          snacks: s.snacks,
          snacksCost,
          totalCost: total,
          source: 'in_store',
          date: todayStr
        };

        setCompletedSales([saleRecord, ...completedSales]);
        setSessions(sessions.filter(x => x.id !== s.id));
        setDevices(devices.map(d => d.id === s.deviceId ? { ...d, status: 'available' } : d));
        setReceiptData(saleRecord);
      };

      // ⚡ الإنهاء الطارئ بالدقيقة الفعلية مع حساب استرداد الفارق
      const emergencyEndSession = (s) => {
        const sec = Math.max(0, Math.floor((now - new Date(s.startTime).getTime()) / 1000));
        const minsBilled = Math.max(1, Math.ceil(sec / 60));
        const hourRate = (PRICING[s.devType] || PRICING.PS4)[s.mode === 'multi' ? 'multi' : 'single'].ratePerHour;
        const timeCost = Math.ceil(minsBilled * (hourRate / 60));
        const snacksCost = s.snacksCost || 0;
        const actualCost = timeCost + snacksCost;

        const saleRecord = {
          id: `sale-emg-${Date.now()}`,
          devName: s.devName,
          devType: s.devType,
          customerName: s.customerName,
          mode: s.mode,
          durationMins: minsBilled,
          timeCost,
          snacks: s.snacks,
          snacksCost,
          totalCost: actualCost,
          isEmergency: true,
          source: 'in_store',
          date: todayStr
        };

        setCompletedSales([saleRecord, ...completedSales]);
        setSessions(sessions.filter(x => x.id !== s.id));
        setDevices(devices.map(d => d.id === s.deviceId ? { ...d, status: 'available' } : d));
        setReceiptData(saleRecord);
      };

      const updateBookingStatus = (bId, newStatus) => {
        setBookings(bookings.map(x => x.id === bId ? { ...x, status: newStatus } : x));
        db.collection('bookings').doc(bId).update({ status: newStatus }).catch(console.error);
      };

      // الموافقة الفورية على شحن محفظة العميل وإيداع الرصيد سحابياً
      const handleApproveTopup = (req) => {
        db.collection('customers').doc(req.customerEmail).update({
          walletBalance: firebase.firestore.FieldValue.increment(req.amount)
        }).then(() => {
          db.collection('wallet_requests').doc(req.id).update({ status: 'approved' });
          alert(`تم تأكيد استلام التحويل وإيداع ${req.amount} ج.م في محفظة العميل (${req.customerName}) بنجاح!`);
        });
      };

      const handleRejectTopup = (req) => {
        if (!confirm("هل أنت متأكد من رفض طلب الشحن هذا؟")) return;
        db.collection('wallet_requests').doc(req.id).update({ status: 'rejected' });
      };

      // حذف أي تقييم سيء من الفايربيس
      const deleteReview = (revId) => {
        if (!confirm("هل تريد حذف هذا التقييم نهائياً من الموقع؟")) return;
        db.collection('reviews').doc(revId).delete().then(() => {
          setReviews(reviews.filter(r => r.id !== revId));
        });
      };
      return (
        <div className="max-w-6xl mx-auto py-6 px-4 space-y-6 text-xs">
          {/* شريط الإدارة وأزرار العمليات السريعة */}
          <div className="flex flex-wrap justify-between items-center bg-neutral-900 p-4 rounded-3xl border border-neutral-800 gap-3 shadow-xl">
            <div>
              <h2 className="font-black text-white text-base">لوحة تحكم وإدارة TWIX المركزية</h2>
              <span className="text-[10px] text-emerald-400 font-bold">الوردية الحالية: نشطة والدرج متزامن سحابياً 🟢</span>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setShowWalkInModal(true)} className="bg-amber-500 hover:bg-amber-400 text-black font-black px-3 py-2 rounded-xl">+ زبون صالة (Walk-in)</button>
              <button onClick={() => setShowQuickPOS(true)} className="bg-neutral-800 hover:bg-neutral-700 text-amber-300 font-bold px-3 py-2 rounded-xl border border-amber-500/30">☕ كافتيريا وسناكس</button>
              <button onClick={() => setShowExpenseModal(true)} className="bg-neutral-800 hover:bg-neutral-700 text-rose-300 font-bold px-3 py-2 rounded-xl border border-rose-500/30">📉 تسجيل مصروف</button>
              <button onClick={handleChangePin} className="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-bold px-3 py-2 rounded-xl border border-neutral-700">🔑 تغيير الرمز</button>
              <button onClick={() => { if(confirm("هل تريد تقفيل الوردية وطباعة الملخص؟")) alert(`تم تقفيل الوردية بنجاح!\nصافي كاش الدرج الفعلي المطلوب: ${netDrawerCash} ج.م`); }} className="bg-rose-600 hover:bg-rose-500 text-white font-black px-3 py-2 rounded-xl">🔒 تقفيل الوردية</button>
            </div>
          </div>

          {/* كروت الإيرادات وكاش الدرج الصافي */}
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">
              <span className="text-[10px] text-neutral-400 block font-bold">🌐 إيرادات الويبسايت</span>
              <strong className="text-lg font-black text-blue-400 block mt-1">{onlineRevenue} ج.م</strong>
              <span className="text-[9px] text-neutral-500">حجوزات مؤكدة</span>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">
              <span className="text-[10px] text-neutral-400 block font-bold">🏪 كاش الصالة المباشر</span>
              <strong className="text-lg font-black text-emerald-400 block mt-1">{inStoreRevenue} ج.م</strong>
              <span className="text-[9px] text-neutral-500">لعب وسناكس صالة</span>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">
              <span className="text-[10px] text-neutral-400 block font-bold">🍜 إجمالي الكافتيريا</span>
              <strong className="text-lg font-black text-amber-400 block mt-1">{totalSnacksRevenue} ج.م</strong>
              <span className="text-[9px] text-neutral-500">إندومي وشيبسي ومشاريب</span>
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">
              <span className="text-[10px] text-rose-300 block font-bold">📉 المصاريف والخوارج</span>
              <strong className="text-lg font-black text-rose-400 block mt-1">{totalExpenses} ج.م</strong>
              <span className="text-[9px] text-neutral-500">مشتريات وبضاعة</span>
            </div>
            <div className="bg-gradient-to-br from-amber-500/20 to-neutral-900 border-2 border-amber-500/40 p-4 rounded-2xl col-span-2 sm:col-span-1 shadow-lg">
              <span className="text-[10px] text-amber-300 block font-black">💵 صافي كاش الدرج</span>
              <strong className="text-xl font-black text-amber-400 block mt-1">{netDrawerCash} ج.م</strong>
              <span className="text-[9px] text-neutral-400 font-bold">المطلوب استلامه بالدرج</span>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3 text-center">
            <div className="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-2xl"><span className="text-[10px] text-amber-300 block font-bold">شاشات مشغولة</span><strong className="text-base text-amber-400 font-mono">{occupiedScreens} / {totalScreens}</strong></div>
            <div className="bg-emerald-500/10 border border-emerald-500/30 p-2.5 rounded-2xl"><span className="text-[10px] text-emerald-300 block font-bold">شاشات متاحة</span><strong className="text-base text-emerald-400 font-mono">{availableScreens}</strong></div>
            <div className="bg-rose-500/10 border border-rose-500/30 p-2.5 rounded-2xl"><span className="text-[10px] text-rose-300 block font-bold">صيانة</span><strong className="text-base text-rose-400 font-mono">{maintenanceScreens}</strong></div>
          </div>

          {/* الجلسات المباشرة والعداد الحي والإنهاء الطارئ */}
          <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-3 shadow-xl">
            <h3 className="font-bold text-white text-sm flex justify-between items-center">
              <span>🎮 الجلسات المباشرة بالصالة (العداد الحي):</span>
              <span className="text-xs text-amber-400 font-mono">{sessions.length} شاشة تعمل الآن</span>
            </h3>
            {sessions.length === 0 ? <p className="text-neutral-500 py-3 text-center">لا توجد أجهزة قيد التشغيل حالياً بالصالة.</p> : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {sessions.map(s => {
                  const sec = Math.max(0, Math.floor((now - new Date(s.startTime).getTime()) / 1000));
                  const m = Math.floor(sec / 60), ss = sec % 60;
                  const minsBilled = Math.max(1, Math.ceil(sec / 60));
                  const timeCost = calcPrice(s.devType, s.mode, minsBilled);
                  const isExpired = s.timerType === 'fixed' && minsBilled >= s.targetMins;

                  return (
                    <div key={s.id} className={`p-3.5 bg-neutral-950 border rounded-2xl space-y-2.5 transition-all ${isExpired ? 'border-rose-500 animate-pulse bg-rose-500/10' : 'border-emerald-500/40'}`}>
                      <div className="flex justify-between items-center">
                        <div>
                          <strong className="text-white text-xs block">{s.devName}</strong>
                          <span className="text-[10px] text-neutral-400">{s.customerName} — <strong className="text-amber-400">{s.mode === 'multi' ? 'ملتي (4)' : 'فردي'}</strong></span>
                        </div>
                        <span className={`font-mono font-black text-sm px-2.5 py-0.5 rounded-lg border ${isExpired ? 'bg-rose-500 text-white' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}`}>
                          {m}:{ss < 10 ? '0' : ''}{ss} {s.timerType === 'fixed' && ` / ${s.targetMins}د`}
                        </span>
                      </div>
                      <div className="flex justify-between text-neutral-400 text-[11px] border-t border-neutral-900 pt-1.5">
                        <span>وقت: {minsBilled} دقيقة ({timeCost} ج)</span>
                        <span>طلبات: {s.snacksCost || 0} ج</span>
                      </div>
                      <div className="flex gap-1.5 pt-1">
                        <button type="button" onClick={() => addSnackToSession(s.id, 'chips_med')} className="flex-1 py-1 bg-neutral-900 text-neutral-200 border border-neutral-800 rounded-lg text-[10px]">+🥔 شيبسي (15)</button>
                        <button type="button" onClick={() => addSnackToSession(s.id, 'indomie_beef')} className="flex-1 py-1 bg-neutral-900 text-neutral-200 border border-neutral-800 rounded-lg text-[10px]">+🥩 إندومي (25)</button>
                        <button type="button" onClick={() => addSnackToSession(s.id, 'tea')} className="flex-1 py-1 bg-neutral-900 text-neutral-200 border border-neutral-800 rounded-lg text-[10px]">+☕ شاي (20)</button>
                      </div>
                      <div className="flex flex-wrap items-center justify-between pt-1 gap-1.5 border-t border-neutral-900">
                        <button onClick={() => setTransferSessionTarget(s)} className="py-1 px-2 bg-neutral-800 text-amber-300 rounded text-[10px] font-bold">🔄 نقل</button>
                        <button onClick={() => emergencyEndSession(s)} className="py-1 px-2.5 bg-amber-500 hover:bg-amber-400 text-black rounded text-[10px] font-black" title="حساب الدقائق الفعلية بالقرش واسترداد الفارق للزبون">⚡ إنهاء طارئ بالدقيقة</button>
                        <button onClick={() => endSession(s, 0)} className="py-1 px-3 bg-rose-600 hover:bg-rose-500 text-white font-black rounded text-xs">إنهاء وبون</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* طلبات شحن المحافظ المعلقة */}
          {topupRequests.length > 0 && (
            <div className="bg-neutral-900 border-2 border-emerald-500/40 p-4 rounded-3xl space-y-3 shadow-xl">
              <h3 className="font-bold text-white text-xs flex justify-between items-center">
                <span className="text-emerald-400 font-black">🔔 طلبات شحن المحافظ المعلقة ({topupRequests.length}):</span>
                <span className="text-[10px] text-neutral-400">راجع الإيصال واضغط إيداع</span>
              </h3>
              <div className="space-y-2">{topupRequests.map(req => (
                <div key={req.id} className="p-3 bg-neutral-950 rounded-2xl flex flex-col sm:flex-row justify-between sm:items-center gap-2 border border-neutral-800">
                  <div>
                    <strong className="text-white text-xs block">{req.customerName}</strong>
                    <span className="text-[10px] text-neutral-400">محفظة: <strong className="text-amber-400 font-mono">{req.senderPhone}</strong> | المبلغ: <strong className="text-emerald-400 font-mono text-sm">{req.amount} ج.م</strong></span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    {req.receiptImage && <button onClick={() => setViewTopupReceipt(req.receiptImage)} className="px-2.5 py-1 bg-neutral-800 text-amber-300 rounded text-[10px] font-bold">📸 الإيصال</button>}
                    <button onClick={() => handleApproveTopup(req)} className="px-2.5 py-1 bg-emerald-500 text-black font-black rounded text-[10px]">✅ إيداع بالمحفظة</button>
                    <button onClick={() => handleRejectTopup(req)} className="px-2 py-1 bg-rose-600/30 text-rose-400 rounded text-[10px]">❌ رفض</button>
                  </div>
                </div>
              ))}</div>
            </div>
          )}

          {/* حجوزات الموقع الإلكتروني */}
          <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-3 shadow-xl">
            <h3 className="font-bold text-white text-sm">حجوزات الموقع الإلكتروني ({bookings.length}):</h3>
            {bookings.length === 0 ? <p className="text-neutral-500 py-2">لا توجد حجوزات أونلاين بعد.</p> : (
              <div className="space-y-2.5">{bookings.map(b => (
                <div key={b.id} className="p-3 bg-neutral-950 rounded-2xl flex flex-col md:flex-row justify-between md:items-center gap-3 border border-neutral-800">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-amber-400 font-mono">{b.ref}</span>
                      <strong className="text-white">{b.customerName}</strong>
                      <span className="text-neutral-400 text-[10px] font-mono">({b.phone})</span>
                    </div>
                    <div className="text-[10px] text-neutral-400 mt-0.5">{b.date} الساعة {b.time} — المبلغ: <strong className="text-amber-300 font-mono">{b.totalCost} ج</strong> | دفع: {b.paymentMethod || 'كاش'}</div>
                    {b.snacksSummary && <div className="text-[10px] text-amber-300">طلبات: {b.snacksSummary}</div>}
                  </div>
                  <div className="flex flex-wrap items-center gap-1.5">
                    {b.receiptImage && <button onClick={() => setViewReceiptImg(b.receiptImage)} className="px-2 py-1 bg-neutral-800 text-amber-300 rounded text-[10px] font-bold">📸 الإيصال</button>}
                    <button onClick={() => setEditingBooking(b)} className="px-2 py-1 bg-blue-600 text-white font-bold rounded text-[10px]">✏️ تعديل</button>
                    <button onClick={() => setReceiptData({ ...b, devName: b.items?.[0]?.deviceType || 'PS5 VIP', timeCost: b.devicesCost || 0, durationMins: b.items?.[0]?.duration || 30, mode: b.items?.[0]?.mode || 'single' })} className="px-2 py-1 bg-neutral-800 text-white rounded text-[10px] font-bold">🖨️ بون حراري</button>
                    <span className={`text-[10px] px-2 py-0.5 rounded font-black ${b.status === 'confirmed' ? 'bg-emerald-500/20 text-emerald-400' : (b.status === 'rejected' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400')}`}>
                      {b.status === 'confirmed' ? 'مؤكد ✅' : (b.status === 'rejected' ? 'مرفوض ❌' : 'قيد الانتظار ⏳')}
                    </span>
                    {b.status !== 'confirmed' && <button onClick={() => updateBookingStatus(b.id, 'confirmed')} className="px-2.5 py-1 bg-emerald-500 text-black font-black rounded text-[10px]">تأكيد</button>}
                    {b.status !== 'rejected' && <button onClick={() => updateBookingStatus(b.id, 'rejected')} className="px-2 py-1 bg-rose-500/20 text-rose-400 rounded text-[10px]">رفض</button>}
                  </div>
                </div>
              ))}</div>
            )}
          </div>
          {/* قسم مراقبة وحذف التقييمات للإدارة */}
          <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-3 shadow-xl">
            <h3 className="font-bold text-white text-sm flex justify-between items-center">
              <span>🌟 إدارة التقييمات العامة ({reviews.length}):</span>
              <span className="text-[10px] text-neutral-400">احذف أي تقييم مسيء بضغطة زر</span>
            </h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-48 overflow-y-auto no-scrollbar">
              {reviews.map(r => (
                <div key={r.id} className="p-3 bg-neutral-950 rounded-2xl border border-neutral-800 flex justify-between items-center text-xs">
                  <div>
                    <div className="flex items-center gap-1.5"><strong className="text-white">{r.author}</strong><span className="text-amber-400 text-[10px]">{'⭐'.repeat(r.rating || 5)}</span></div>
                    <p className="text-neutral-400 text-[11px] line-clamp-1">{r.comment}</p>
                  </div>
                  <button onClick={() => deleteReview(r.id)} className="px-2 py-1 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 rounded-lg text-[10px] font-bold shrink-0">🗑️ حذف</button>
                </div>
              ))}
            </div>
          </div>

          {/* النوافذ المنبثقة للإدارة */}
          {showWalkInModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <form onSubmit={handleStartWalkIn} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">تسجيل زبون صالة مباشر (Walk-in)</h3><button type="button" onClick={() => setShowWalkInModal(false)} className="text-neutral-400 hover:text-white">✕</button></div>
                <input value={walkInCustomerName} onChange={e => setWalkInCustomerName(e.target.value)} placeholder="اسم الزبون" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
                <select required value={walkInDevice} onChange={e => setWalkInDevice(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-bold">
                  <option value="">-- اختر جهازاً متاحاً للتشغيل --</option>
                  {devices.filter(d => d.status === 'available').map(d => (<option key={d.id} value={d.id}>{d.name} ({d.type})</option>))}
                </select>
                <div className="grid grid-cols-2 gap-2">
                  <select value={walkInMode} onChange={e => setWalkInMode(e.target.value)} className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-amber-300 font-bold"><option value="single">فردي (ذراعين)</option><option value="multi">ملتي (4 ذراعات)</option></select>
                  <select value={walkInTimerType} onChange={e => setWalkInTimerType(e.target.value)} className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white"><option value="open">وقت مفتوح</option><option value="fixed">وقت محدد</option></select>
                </div>
                {walkInTimerType === 'fixed' && <div><label className="text-[10px] text-neutral-400 block mb-1">المدة بالدقائق:</label><input type="number" min={15} step={15} value={walkInTargetMins} onChange={e => setWalkInTargetMins(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white" /></div>}
                <button type="submit" className="w-full py-3 bg-amber-500 text-black font-black rounded-xl shadow-lg shadow-amber-500/20">بدء تشغيل الجهاز فوراً</button>
              </form>
            </div>
          )}

          {showQuickPOS && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">بيع كافتيريا سريع (كاش صالة)</h3><button onClick={() => setShowQuickPOS(false)} className="text-neutral-400 hover:text-white">✕</button></div>
                <div className="space-y-1.5 max-h-60 overflow-y-auto no-scrollbar">{SNACKS_MENU.map(snack => (
                  <button key={snack.id} onClick={() => {
                    setCompletedSales([{ id: `sale-${Date.now()}`, devName: 'كافتيريا خارجية', devType: '-', customerName: 'زبون طاولة', mode: '-', durationMins: 0, timeCost: 0, snacks: { [snack.id]: 1 }, snacksCost: snack.price, totalCost: snack.price, source: 'in_store', date: todayStr }, ...completedSales]);
                    setShowQuickPOS(false);
                    alert(`تم تسجيل بيع [${snack.name}] بـ ${snack.price} ج.م في كاش الصالة!`);
                  }} className="w-full p-2.5 bg-neutral-950 hover:bg-neutral-800 border border-neutral-800 rounded-xl flex justify-between items-center text-white">
                    <span>{snack.icon} {snack.name}</span><strong className="text-amber-400">{snack.price} ج.م</strong>
                  </button>
                ))}</div>
              </div>
            </div>
          )}

          {showExpenseModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <form onSubmit={(e) => {
                e.preventDefault();
                const title = e.target.title.value.trim();
                const amount = Number(e.target.amount.value);
                if (title && amount > 0) {
                  setExpenses([{ id: `exp-${Date.now()}`, title, amount, date: todayStr }, ...expenses]);
                  setShowExpenseModal(false);
                }
              }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">تسجيل مصروف جديد من الدرج</h3><button type="button" onClick={() => setShowExpenseModal(false)} className="text-neutral-400 hover:text-white">✕</button></div>
                <input required name="title" placeholder="بند الصرف (مثال: كرتونة شيبسي / شاي وسكر)" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" />
                <input required type="number" min={1} name="amount" placeholder="المبلغ بالجنيه" className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono" />
                <button type="submit" className="w-full py-2.5 bg-rose-600 text-white font-black rounded-xl">خصم من الدرج فوراً</button>
              </form>
            </div>
          )}

          {transferSessionTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">نقل الجلسة لشاشة أخرى</h3><button onClick={() => setTransferSessionTarget(null)} className="text-neutral-400 hover:text-white">✕</button></div>
                <p className="text-neutral-400">نقل جلسة: <strong className="text-white">{transferSessionTarget.devName}</strong> مع كامل وقتها ومشاريبها.</p>
                <div className="space-y-1.5">{devices.filter(d => d.status === 'available').map(d => (
                  <button key={d.id} onClick={() => executeTransfer(transferSessionTarget, d.id)} className="w-full p-2.5 bg-neutral-950 hover:bg-neutral-800 border border-neutral-800 rounded-xl text-right text-amber-300 font-bold block">
                    ➔ نقل إلى: {d.name}
                  </button>
                ))}</div>
              </div>
            </div>
          )}

          {(viewReceiptImg || viewTopupReceipt) && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm p-4">
              <div className="bg-neutral-900 border border-neutral-700 rounded-3xl p-5 max-w-md w-full space-y-3 shadow-2xl text-center">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2">
                  <h3 className="font-bold text-white text-xs">📸 إيصال التحويل المرفوع من العميل</h3>
                  <button onClick={() => { setViewReceiptImg(null); setViewTopupReceipt(null); }} className="text-neutral-400 hover:text-white font-bold text-sm">✕</button>
                </div>
                <img src={viewReceiptImg || viewTopupReceipt} alt="Receipt" className="max-h-[65vh] mx-auto rounded-xl object-contain border border-neutral-800 shadow-md" />
                <button onClick={() => { setViewReceiptImg(null); setViewTopupReceipt(null); }} className="w-full py-2 bg-neutral-800 text-white rounded-xl text-xs font-bold">إغلاق المعاينة</button>
              </div>
            </div>
          )}

          {/* نافذة تعديل الحجز الشاملة للإدارة */}
          {editingBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <form onSubmit={(e) => {
                e.preventDefault();
                const updated = {
                  ...editingBooking,
                  customerName: e.target.cName.value.trim(),
                  phone: e.target.cPhone.value.trim(),
                  date: e.target.cDate.value,
                  time: e.target.cTime.value,
                  items: [{ deviceType: e.target.cDev.value, mode: e.target.cMode.value, duration: Number(e.target.cDur.value) }],
                  totalCost: Number(e.target.cCost.value),
                  status: e.target.cStatus.value
                };
                setBookings(bookings.map(x => x.id === updated.id ? updated : x));
                db.collection('bookings').doc(updated.id).update(updated).catch(console.error);
                setEditingBooking(null);
                alert("تم حفظ وتحديث الحجز سحابياً بنجاح!");
              }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-2.5 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><h3 className="font-bold text-white text-xs">✏️ تعديل بيانات الحجز ({editingBooking.ref})</h3><button type="button" onClick={() => setEditingBooking(null)} className="text-neutral-400 hover:text-white">✕</button></div>
                <div><label className="text-[10px] text-neutral-400 block mb-0.5">اسم العميل ورقم الهاتف:</label><div className="grid grid-cols-2 gap-1.5"><input required name="cName" defaultValue={editingBooking.customerName} className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white" /><input required name="cPhone" defaultValue={editingBooking.phone} className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-mono" /></div></div>
                <div><label className="text-[10px] text-neutral-400 block mb-0.5">التاريخ والوقت:</label><div className="grid grid-cols-2 gap-1.5"><input type="date" required name="cDate" defaultValue={editingBooking.date} className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white" /><input type="time" required name="cTime" defaultValue={editingBooking.time} className="bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white" /></div></div>
                <div><label className="text-[10px] text-neutral-400 block mb-0.5">تعديل الجهاز ونمط اللعب:</label><div className="grid grid-cols-3 gap-1.5">
                  <select name="cDev" defaultValue={editingBooking.items?.[0]?.deviceType || 'PS5'} className="bg-neutral-950 border border-neutral-800 rounded-xl p-1.5 text-white font-bold"><option value="PS5">PS5 VIP</option><option value="PS4">PS4 Pro</option></select>
                  <select name="cMode" defaultValue={editingBooking.items?.[0]?.mode || 'single'} className="bg-neutral-950 border border-neutral-800 rounded-xl p-1.5 text-amber-300 font-bold"><option value="single">فردي</option><option value="multi">ملتي</option></select>
                  <select name="cDur" defaultValue={editingBooking.items?.[0]?.duration || 30} className="bg-neutral-950 border border-neutral-800 rounded-xl p-1.5 text-white font-bold"><option value={30}>30د</option><option value={60}>ساعة</option><option value={120}>ساعتان</option></select>
                </div></div>
                <div className="grid grid-cols-2 gap-1.5">
                  <div><label className="text-[10px] text-neutral-400 block mb-0.5">المبلغ (ج.م):</label><input type="number" required min={0} name="cCost" defaultValue={editingBooking.totalCost} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-bold font-mono" /></div>
                  <div><label className="text-[10px] text-neutral-400 block mb-0.5">حالة الحجز:</label><select name="cStatus" defaultValue={editingBooking.status} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-white font-bold"><option value="awaiting_admin_approval">قيد الانتظار ⏳</option><option value="confirmed">مؤكد ✅</option><option value="rejected">مرفوض ❌</option></select></div>
                </div>
                <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl mt-1">حفظ وتحديث الحجز سحابياً</button>
              </form>
            </div>
          )}

          {/* الفاتورة الحرارية المخصصة للطابعات 80mm */}
          {receiptData && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="bg-white text-black rounded-3xl p-6 max-w-xs w-full space-y-3 shadow-2xl text-xs">
                <div id="printable-receipt" className="space-y-2 text-center border-b pb-3">
                  <h2 className="font-black text-lg">TWIX Gaming Lounge</h2>
                  <p className="text-[10px] text-neutral-600">بون حساب معتمد — ت: {SITE_CONFIG.phone}</p>
                  <div className="text-[11px] text-right space-y-1 pt-2 border-t border-dashed">
                    <div>الجهاز: <strong>{receiptData.devName}</strong></div>
                    <div>العميل: <strong>{receiptData.customerName}</strong></div>
                    <div>النمط: <strong>{receiptData.mode === 'multi' ? 'ملتي (4 ذراعات)' : 'فردي'}</strong></div>
                    <div>مدة اللعب: <strong>{receiptData.durationMins || 30} دقيقة</strong> ({receiptData.timeCost || 0} ج)</div>
                    {receiptData.snacksCost > 0 && <div>الطلبات والكافتيريا: <strong>{receiptData.snacksCost} ج</strong></div>}
                    {receiptData.isEmergency && (
                      <div className="p-1.5 bg-neutral-100 rounded text-center border border-black/10 mt-1">
                        <span className="block font-bold">⚡ إنهاء طارئ بالدقيقة الفعلية</span>
                        {receiptData.refundAmount > 0 && <span className="block font-black text-emerald-700">المتبقي استرداده للعميل: {receiptData.refundAmount} ج.م</span>}
                      </div>
                    )}
                  </div>
                  <div className="text-base font-black pt-2 border-t border-dashed flex justify-between">
                    <span>الإجمالي المستحق:</span>
                    <span>{receiptData.totalCost} ج.م</span>
                  </div>
                  <p className="text-[9px] text-neutral-500 pt-1 font-mono">شكراً لزيارتكم TWIX! نتمنى لكم يوماً سعيداً 🎮</p>
                </div>
                <div className="flex gap-2 pt-1">
                  <button onClick={() => window.print()} className="flex-1 py-2 bg-black text-white font-bold rounded-xl text-xs">🖨️ طباعة البون الحراري</button>
                  <button onClick={() => setReceiptData(null)} className="flex-1 py-2 bg-neutral-200 text-neutral-800 font-bold rounded-xl text-xs">إغلاق</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
