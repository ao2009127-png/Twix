es[0])); }} className="w-full bg-neutral-950 p-1 rounded-xl border border-neutral-800 text-[10px]" />{topRec && <img src={topRec} className="max-h-20 mx-auto rounded-lg" />}<button className="w-full py-2.5 bg-emerald-500 text-black font-black rounded-xl">إرسال ➔</button></form></div>}

              await db.collection('inventory').doc('snacks').set({ menu: nextM });
            } else if (t === 'PUBLISH_OFFER' && p.title) {
              const id = `off-${Date.now()}`;
              await db.collection('offers').doc(id).set({ id, title: p.title, detail: p.detail || '', date: todayStr, createdAt: new Date().toISOString() });
              if (p.sendPush && adminSecret) fetch(`${AI_WORKER_URL}/send-notification`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ adminSecret, title: p.title, message: p.detail || p.title }) }).catch(()=>{});
            } else if (t === 'DELETE_OFFER' && p.offerId) {
              await db.collection('offers').doc(p.offerId).delete();
            } else if (t === 'EDIT_BOOKING' && p.bookingId) {
              const upd = {}; ['date','time','status','incidentNote'].forEach(k => { if (p[k] !== undefined) upd[k] = p[k]; });
              if (p.totalCost !== undefined) upd.totalCost = Number(p.totalCost);
              if (p.duration !== undefined) upd.duration = Number(p.duration);
              if (p.damageFee !== undefined) upd.damageFee = Number(p.damageFee);
              await db.collection('bookings').doc(p.bookingId).update(upd);
            } else if (t === 'COMPLETE_TABLE_REQUESTS') {
              const targets = p.requestId === 'ALL' ? inLoungeRequests.filter(r => r.status !== 'done') : inLoungeRequests.filter(r => r.id === p.requestId);
              targets.forEach(r => db.collection('in_lounge_requests').doc(r.id).update({ status: 'done' }));
            } else if ((t === 'SET_CUSTOMER_STATUS' || t === 'APPROVE_CUSTOMER' || t === 'BAN_CUSTOMER') && p.phone) {
              const st = t === 'APPROVE_CUSTOMER' ? 'active' : (t === 'BAN_CUSTOMER' ? 'banned' : p.status);
              await db.collection('customers').doc(p.phone).update({ status: st });
            } else if (t === 'ADJUST_WALLET' && p.phone) {
              await db.collection('customers').doc(p.phone).set({ walletBalance: firebase.firestore.FieldValue.increment(Number(p.delta || 0)) }, { merge: true });
            } else if (t === 'RECORD_INCIDENT' && p.phone) {
              await db.collection('customers').doc(p.phone).set({ incidents: firebase.firestore.FieldValue.arrayUnion({ note: p.note || 'تلف جهاز/ذراع', damageFee: Number(p.damageFee || 0), bookingRef: p.bookingRef || '', date: todayStr }) }, { merge: true });
            } else if (t === 'ADD_EXPENSE' && p.title) {
              const id = `exp-${Date.now()}`; await db.collection('expenses').doc(id).set({ id, title: p.title, amount: Number(p.amount || 0), shiftId: adminShift, date: todayStr, createdAt: new Date().toISOString() });
            } else if (t === 'ADD_DEBT' && p.customerName) {
              const id = `dbt-${Date.now()}`; await db.collection('debts').doc(id).set({ id, customerName: p.customerName, amount: Number(p.amount || 0), note: p.note || '', paid: false, shiftId: adminShift, date: todayStr, createdAt: new Date().toISOString() });
            } else if (t === 'SETTLE_DEBT' && p.debtId) {
              await db.collection('debts').doc(p.debtId).update({ paid: true });
            } else if (t === 'TOGGLE_FREEZE') {
              await db.collection('site_settings').doc('runtime').set({ globalFrozen: !!p.frozen }, { merge: true });

              const id = `m-${Date.now()}`; await db.collection('matches').doc(id).set({ id, teamA: p.teamA, teamB: p.teamB, time: p.time || 'الليلة', status: 'open', scoreA: 0, scoreB: 0, predictions: {}, createdAt: new Date().toISOString() });
            } else if (t === 'SET_BOSS' && p.challengeId) {
              await db.collection('challenges').doc(p.challengeId).update({ isBoss: !!p.isBoss });
            } else if (t === 'ADD_HALL_RECORD' && p.title) {
              const id = `hof-${Date.now()}`; await db.collection('hall_of_fame').doc(id).set({ id, title: p.title, holder: p.holder || 'بطل', score: p.score || '', game: p.game || 'PS5' });
            } else if (t === 'DELETE_MEMORY' && p.memoryId) { await db.collection('memories').doc(p.memoryId).delete();
            } else if (t === 'DELETE_REVIEW' && p.reviewId) { await db.collection('reviews').doc(p.reviewId).delete();
            } else if (t === 'UPDATE_CONFIG') {

              const id = `mem-${Date.now()}`; await db.collection('ai_memory').doc(id).set({ id, lesson: p.lesson, createdAt: new Date().toISOString() });
            }
            logSystemEvent(sourceLabel, t, JSON.stringify(p).slice(0, 120));
          } catch (e) {}
        }
      };
      useEffect(() => {
        if (!adminShift || !aiPilotMode || !adminSecret) return;

            const d = await res.json();
            if (d && d.safe === false) {
              await db.collection('memories').doc(m.id).delete();

          } catch (e) {}
        });
        reviews.filter(r => !r.moderated).forEach(async (r) => {
          if (modRef.current[r.id]) return; modRef.current[r.id] = true;

          if (lowStock.length > 0) localAlerts.push(`📦 نواقص مخزون: ${lowStock.map(s => `${s.name}(${s.stock})`).join('، ')}`);
          setPilotAlerts(localAlerts);
          if (pendingCusts.length === 0 && lowStock.length === 0) return;
          try {
            const res = await fetch(`${AI_WORKER_URL}/autopilot`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ adminSecret, pilotContext: { pendingCustomers: pendingCusts.map(c => ({ name: c.name, phone: c.phone, birthDate: c.birthDate })), lowStock, pendingBookingsCount: pendingBks.length, pendingTableRequestsCount: pendingTbls.length, aiMemory: aiMemory.slice(0, 10).map(m => m.lesson) } }) });
            const d = await res.json();
            if (Array.isArray(d?.actions) && d.actions.length > 0) {
              const safeActs = d.actions.filter(a => ['APPROVE_CUSTOMER','BAN_CUSTOMER','LEARN_MEMORY'].includes(a.type));
              await executeAIActions(safeActs, 'AI التلقائي');
            }
            if (Array.isArray(d?.alertsForManager) && d.alertsForManager.length > 0) setPilotAlerts(p => [...new Set([...localAlerts, ...d.alertsForManager])]);
          } catch (e) {}
        };
        runPilot();
        const iv = setInterval(runPilot, 60000);
        return () => clearInterval(iv);
      }, [adminShift, aiPilotMode, adminSecret, allCustomers.length, allBookings.length, inLoungeRequests.length]);

              <span className="text-amber-200 font-bold">🔑 أدخل كلمة سر الـ AI السرية (`ADMIN_AI_SECRET`) مرة واحدة على جهازك لتفعيل AI المدير والرقابة التلقائية:</span>
              <form onSubmit={e => { e.preventDefault(); const v = e.target.sec.value.trim(); if (v) { localStorage.setItem('twix_admin_ai_secret', v); setAdminSecret(v); playNotificationSound('cash'); } }} className="flex gap-2"><input name="sec" type="password" placeholder="ADMIN_AI_SECRET" className="bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-1.5 text-white font-mono" /><button className="px-3 py-1.5 bg-amber-500 text-black font-black rounded-xl">حفظ</button></form>
            </div>
          )}
          <div className="flex flex-wrap justify-between items-center bg-neutral-900 p-4 rounded-3xl border border-neutral-800 gap-3">
            <div><div className="flex items-center gap-2"><h2 className="font-black text-white text-base">لوحة تحكم {config.loungeName}</h2><span className="px-2.5 py-0.5 rounded-full font-black text-[10px] bg-amber-500 text-black font-mono">{adminShift === 'shift_1' ? 'شِفت 1' : 'شِفت 2'}</span></div><span className="text-[10px] text-emerald-400 font-bold block">🟢 متزامن سحابياً | {config.openingHours}</span></div>
            <div className="flex flex-wrap items-center gap-1.5">

              <button onClick={() => setShowWalkIn(true)} className="bg-amber-500/20 text-amber-300 border border-amber-500/40 font-black px-3 py-2 rounded-xl">+ زبون صالة</button>

            </div>
          </div>
          {pilotAlerts.length > 0 && <div className="p-3.5 bg-rose-500/15 border border-rose-500/40 rounded-2xl space-y-1">{pilotAlerts.map((a, i) => <div key={i} className="text-rose-200 font-bold">{a}</div>)}</div>}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">{sessions.map(s => {
                const sec = Math.max(0, Math.floor((now - new Date(s.startTime).getTime()) / 1000));
                const mins = Math.max(1, Math.ceil(sec / 60)), tCost = calcDevicePrice(pricing, s.devType, s.mode, mins);
                return (<div key={s.id} className="p-4 bg-neutral-950 border border-emerald-500/40 rounded-2xl space-y-2.5"><div className="flex justify-between items-center"><div><strong className="text-white block">{s.devName}</strong><span className="text-[10px] text-neutral-400">{s.customerName} — {s.mode === 'multi' ? 'ملتي' : 'فردي'} | {s.controllers || 'C1,C2'}</span></div><span className="font-mono font-black text-sm px-2.5 py-1 rounded-xl bg-emerald-500/10 text-emerald-400">{Math.floor(sec/60)}:{(sec%60)<10?'0':''}{sec%60}</span></div><div className="flex justify-between text-[11px]"><span>وقت: {mins}د ({tCost}ج)</span><span>كافتيريا: {s.snacksCost || 0}ج</span></div><div className="flex gap-1.5 flex-wrap">{snacksMenu.slice(0, 4).map(sn => <button key={sn.id} onClick={() => addSnackToSes(s, sn.id)} className="px-2 py-1 bg-neutral-900 border border-neutral-800 rounded-lg text-[10px]">+{sn.icon} {sn.name.split(' ')[0]} ({sn.price})</button>)}</div><div className="flex gap-2 pt-2 border-t border-neutral-900"><button onClick={() => { const hr = (pricing[s.devType] || DEFAULT_PRICING.PS4)[s.mode === 'multi' ? 'multi' : 'single'].perHour; finishSes(s, Math.ceil(mins * (hr / 60)) + (s.snacksCost || 0), mins, 'إنهاء بالدقيقة'); }} className="py-1.5 px-2.5 bg-amber-500 text-black font-black rounded-lg text-[10px]">⚡ بالدقيقة</button><button onClick={() => { const ok = confirm('هل الدراعات سليمة؟'); const fee = ok ? 0 : Number(prompt('قيمة غرامة التلف (ج):', '50') || 0); finishSes(s, tCost + (s.snacksCost || 0), mins, ok ? 'سليمة' : `تلف +${fee}ج`, fee); }} className="flex-1 py-1.5 bg-rose-600 text-white font-black rounded-lg">إنهاء وبون 🖨️</button></div></div>);
              })}</div>
            )}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-3xl space-y-2.5">
              <h3 className="font-bold text-white text-sm">🛎️ طلبات الطاولة الواردة ({inLoungeRequests.filter(r => r.status !== 'done').length}):</h3>
              {inLoungeRequests.filter(r => r.status !== 'done').length === 0 ? <p className="text-neutral-500 text-center py-3">لا توجد طلبات طاولة جديدة.</p> : inLoungeRequests.filter(r => r.status !== 'done').map(r => (
                <div key={r.id} className="p-3 bg-neutral-950 rounded-2xl border border-amber-500/30 flex justify-between items-center gap-2">
                  <div><strong className="text-amber-400">{r.screenName}</strong> — <span className="text-white font-bold">{r.customerName}</span><p className="text-neutral-300 text-[11px]">{r.detail} ({r.time})</p></div>
                  <button onClick={() => { db.collection('in_lounge_requests').doc(r.id).update({ status: 'done' }); logSystemEvent(adminShift, 'TABLE_DONE', r.detail); playNotificationSound('click'); }} className="px-3 py-1.5 bg-emerald-500 text-black font-black rounded-xl text-[11px]">تم ✓</button>
                </div>
              ))}
            </div>
            <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-3xl space-y-2.5">
              <h3 className="font-bold text-white text-sm">💳 طلبات شحن المحافظ ({walletRequests.filter(w => w.status === 'pending').length}):</h3>

                const dType = f.bDevType.value, mode = f.bMode.value, dur = Number(f.bDur.value);
                const inc = f.bIncident.value.trim(), fee = Number(f.bDmgFee.value || 0);
                const upd = { customerName: f.bName.value.trim(), phone: f.bPhone.value.trim(), date: f.bDate.value, time: f.bTime.value, duration: dur, bookedDevices: [{ id: 1, type: dType, mode, duration: dur }], devicesSummary: `جهاز 1: ${dType} (${mode==='multi'?'ملتي':'فردي'}) لمدة ${dur}د`, snacksSummary: f.bSnacks.value.trim(), totalCost: Number(f.bCost.value), status: f.bStatus.value, incidentNote: inc, damageFee: fee };
                db.collection('bookings').doc(showEditBooking.id).update(upd);
                if ((inc || fee > 0) && upd.phone) db.collection('customers').doc(upd.phone).set({ incidents: firebase.firestore.FieldValue.arrayUnion({ note: inc || 'مشكلة بالذراع/الجهاز', damageFee: fee, bookingRef: showEditBooking.ref, date: todayStr }) }, { merge: true });
                logSystemEvent(adminShift, 'EDIT_BOOKING', `${showEditBooking.ref}: ${dType} | ${upd.totalCost}ج`); setShowEditBooking(null); playNotificationSound('cash'); alert('✓ تم تعديل الحجز وتسجيل الملاحظات بنجاح!');
              }} className="bg-neutral-900 border border-cyan-500/40 rounded-3xl p-5 max-w-md w-full space-y-2.5 max-h-[90vh] overflow-y-auto no-scrollbar">
                <div className="flex justify-between border-b border-neutral-800 pb-2"><h3 className="font-bold text-white">✏️ تعديل شامل للحجز ({showEditBooking.ref})</h3><button type="button" onClick={() => setShowEditBooking(null)}>✕</button></div>
                <div className="grid grid-cols-2 gap-2"><input name="bName" defaultValue={showEditBooking.customerName} className="bg-neutral-950 p-2 rounded-xl text-white" /><input name="bPhone" defaultValue={showEditBooking.phone} className="bg-neutral-950 p-2 rounded-xl text-white font-mono" /></div>
                <div className="grid grid-cols-2 gap-2"><input name="bDate" type="date" defaultValue={showEditBooking.date} className="bg-neutral-950 p-2 rounded-xl text-white font-mono" /><input name="bTime" type="time" defaultValue={showEditBooking.time} className="bg-neutral-950 p-2 rounded-xl text-white font-mono" /></div>
                <div className="grid grid-cols-3 gap-2">
                  <select name="bDevType" defaultValue={(showEditBooking.bookedDevices&&showEditBooking.bookedDevices[0]?.type)||((showEditBooking.devicesSummary||'').includes('PS5')?'PS5':'PS4')} onChange={e => { const f=e.target.form; f.bCost.value = calcDevicePrice(pricing, f.bDevType.value, f.bMode.value, Number(f.bDur.value)); }} className="bg-neutral-950 p-2 rounded-xl text-white font-bold"><option value="PS5">PS5 VIP</option><option value="PS4">PS4 Pro</option></select>
                  <select name="bMode" defaultValue={(showEditBooking.bookedDevices&&showEditBooking.bookedDevices[0]?.mode)||'single'} onChange={e => { const f=e.target.form; f.bCost.value = calcDevicePrice(pricing, f.bDevType.value, f.bMode.value, Number(f.bDur.value)); }} className="bg-neutral-950 p-2 rounded-xl text-amber-300 font-bold"><option value="single">فردي</option><option value="multi">ملتي</option></select>
                  <select name="bDur" defaultValue={showEditBooking.duration||30} onChange={e => { const f=e.target.form; f.bCost.value = calcDevicePrice(pricing, f.bDevType.value, f.bMode.value, Number(f.bDur.value)); }} className="bg-neutral-950 p-2 rounded-xl text-emerald-400 font-mono">{DURATION_OPTIONS.map(o => <option key={o.mins} value={o.mins}>{o.mins}د</option>)}</select>
                </div>
                <input name="bSnacks" defaultValue={showEditBooking.snacksSummary} placeholder="الطلبات" className="w-full bg-neutral-950 p-2 rounded-xl text-white" />
                <div className="grid grid-cols-2 gap-2"><div><label className="text-[10px] text-neutral-400">الحساب (يتحدث تلقائي):</label><input name="bCost" type="number" defaultValue={showEditBooking.totalCost} className="w-full bg-neutral-950 p-2 rounded-xl text-amber-400 font-mono font-bold" /></div><div><label className="text-[10px] text-neutral-400">الحالة:</label><select name="bStatus" defaultValue={showEditBooking.status} className="w-full bg-neutral-950 p-2 rounded-xl text-white"><option value="confirmed">مؤكد</option><option value="awaiting_admin_approval">معلق</option><option value="rejected">مرفوض</option><option value="cancelled_emergency">إلغاء طوارئ</option></select></div></div>
                <div className="p-2.5 bg-rose-500/10 border border-rose-500/30 rounded-2xl space-y-2"><span className="text-rose-300 font-bold block text-[11px]">⚠️ تسجيل مشكلة / كسر ذراع بسبب العميل (يحفظ في ملفه):</span><input name="bIncident" defaultValue={showEditBooking.incidentNote||''} placeholder="وصف المشكلة (مثال: كسر ذراع R2)" className="w-full bg-neutral-950 p-2 rounded-xl text-white" /><input name="bDmgFee" type="number" min={0} defaultValue={showEditBooking.damageFee||0} placeholder="غرامة التلف (ج)" className="w-full bg-neutral-950 p-2 rounded-xl text-rose-400 font-mono" /></div>
                <button className="w-full py-3 bg-cyan-500 text-black font-black rounded-xl">حفظ كل التعديلات ➔</button>
              </form>
            </div>
          )}
          {showWalkIn && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"><form onSubmit={e => { e.preventDefault(); const dev=devices.find(d=>d.id===e.target.wDev.value); if(!dev) return alert('اختر شاشة!'); const ses={ id:`ses-${Date.now()}`, deviceId:dev.id, devName:dev.name, devType:dev.type, customerName:e.target.wName.value.trim()||'زبون صالة', mode:e.target.wMode.value, controllers:e.target.wCtrl.value.trim()||'C1, C2', startTime:new Date().toISOString(), snacksCost:0, shiftId:adminShift, source:'in_store' }; db.collection('sessions').doc(ses.id).set(ses); db.collection('devices').doc(dev.id).update({status:'busy'}); setShowWalkIn(false); playNotificationSound('cash'); }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3"><div className="flex justify-between"><h3 className="font-bold text-white">تسجيل زبون صالة</h3><button type="button" onClick={()=>setShowWalkIn(false)}>✕</button></div><input required name="wName" defaultValue="زبون صالة" className="w-full bg-neutral-950 p-2.5 rounded-xl text-white" /><select required name="wDev" className="w-full bg-neutral-950 p-2.5 rounded-xl text-white font-bold"><option value="">-- اختر شاشة --</option>{devices.filter(d=>d.status==='available').map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select><div className="grid grid-cols-2 gap-2"><select name="wMode" className="bg-neutral-950 p-2 rounded-xl text-amber-300"><option value="single">فردي</option><option value="multi">ملتي</option></select><input name="wCtrl" defaultValue="C1, C2" className="bg-neutral-950 p-2 rounded-xl text-cyan-300 font-mono" /></div><button className="w-full py-3 bg-amber-500 text-black font-black rounded-xl">بدء التشغيل 🎮</button></form></div>}
          {showCreateCust && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"><form onSubmit={async e => { e.preventDefault(); const nm=e.target.cName.value.trim(), ph=e.target.cPhone.value.trim(), ps=e.target.cPass.value.trim()||'123456', bl=Number(e.target.cBal.value||0); if(!validateEgyptianPhone(ph)) return alert('رقم مصري غير صحيح.'); const f=e.target.cAva.files[0]; const av=f?await compressImageFile(f):null; db.collection('customers').doc(ph).set({name:nm||'لاعب',phone:ph,password:ps,avatarUrl:av,walletBalance:bl,xp:100,hoursPlayed:0,rewards:[],incidents:[],usedPromos:[],status:'active',myReferralCode:`TX-${ph.slice(-4)}`,createdAt:new Date().toISOString()}).then(()=>{setShowCreateCust(false);playNotificationSound('cash');alert('تم التفعيل!');}); }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3"><div className="flex justify-between"><h3 className="font-bold text-white">👤 تفعيل حساب زائر</h3><button type="button" onClick={()=>setShowCreateCust(false)}>✕</button></div><input required name="cName" placeholder="الاسم ثنائي" className="w-full bg-neutral-950 p-2.5 rounded-xl text-white" /><input required type="tel" name="cPhone" placeholder="01xxxxxxxxx" className="w-full bg-neutral-950 p-2.5 rounded-xl text-white font-mono text-left" /><input required name="cPass" defaultValue="123456" className="w-full bg-neutral-950 p-2.5 rounded-xl text-white" /><input type="number" min={0} defaultValue={0} name="cBal" className="w-full bg-neutral-950 p-2 rounded-xl text-white font-mono text-center" /><input type="file" name="cAva" accept="image/*" className="w-full bg-neutral-950 p-1 rounded-xl text-[10px]" /><button className="w-full py-2.5 bg-blue-600 text-white font-black rounded-xl">حفظ وتفعيل</button></form></div>}
          {showConfig && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"><form onSubmit={e => { e.preventDefault(); const f=e.target; db.collection('site_settings').doc('config').set({...config,loungeName:f.cN.value.trim(),cityLocation:f.cC.value.trim(),phone:f.cP.value.trim(),whatsappNumber:f.cW.value.trim(),openingHours:f.cH.value.trim(),mapsUrl:f.cM.value.trim(),termsText:f.cT.value.trim()}).then(()=>{setShowConfig(false);alert('تم الحفظ!');}); }} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-5 max-w-md w-full space-y-2.5"><div className="flex justify-between"><h3 className="font-bold text-white">⚙️ إعدادات الصالة</h3><button type="button" onClick={()=>setShowConfig(false)}>✕</button></div><div className="grid grid-cols-2 gap-2"><input name="cN" defaultValue={config.loungeName} className="bg-neutral-950 p-2 rounded-xl text-white" /><input name="cC" defaultValue={config.cityLocation} className="bg-neutral-950 p-2 rounded-xl text-white" /><input name="cP" defaultValue={config.phone} className="bg-neutral-950 p-2 rounded-xl text-white font-mono" /><input name="cW" defaultValue={config.whatsappNumber} className="bg-neutral-950 p-2 rounded-xl text-white font-mono" /></div><input name="cH" defaultValue={config.openingHours} className="w-full bg-neutral-950 p-2 rounded-xl text-white" /><input name="cM" defaultValue={config.mapsUrl} className="w-full bg-neutral-950 p-2 rounded-xl text-white font-mono" /><textarea rows={3} name="cT" defaultValue={config.termsText} className="w-full bg-neutral-950 p-2 rounded-xl text-white" /><button className="w-full py-2.5 bg-amber-500 text-black font-black rounded-xl">حفظ</button></form></div>}
          {showPin && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"><form onSubmit={e => { e.preventDefault(); const p1=e.target.p1.value.trim(), p2=e.target.p2.value.trim(); const nh={...shiftHashes}; if(p1.length>=4) nh.shift_1=encodeShiftPin(p1); if(p2.length>=4) nh.shift_2=encodeShiftPin(p2); db.collection('site_settings').doc('admin_security').set(nh,{merge:true}).then(()=>{setShowPin(false);alert('تم التشفير والحفظ!');}); }} className="bg-neutral-900 border border-purple-500/40 rounded-3xl p-6 max-w-sm w-full space-y-3"><div className="flex justify-between"><h3 className="font-bold text-white">🔑 تغيير رموز الشفت</h3><button type="button" onClick={()=>setShowPin(false)}>✕</button></div><input type="password" inputMode="numeric" name="p1" placeholder="رمز شفت 1 الجديد" className="w-full bg-neutral-950 p-2.5 rounded-xl text-white text-center font-mono" /><input type="password" inputMode="numeric" name="p2" placeholder="رمز شفت 2 الجديد" className="w-full bg-neutral-950 p-2.5 rounded-xl text-white text-center font-mono" /><button className="w-full py-2.5 bg-purple-600 text-white font-black rounded-xl">حفظ 🔒</button></form></div>}
          {showExpense && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"><div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-5 max-w-sm w-full space-y-3"><div className="flex justify-between"><h3 className="font-bold text-white">📉 مصاريف الشفت ({totExp}ج)</h3><button onClick={()=>setShowExpense(false)}>✕</button></div><form onSubmit={e=>{e.preventDefault(); const id=`exp-${Date.now()}`; db.collection('expenses').doc(id).set({id,title:e.target.et.value.trim(),amount:Number(e.target.ea.value),shiftId:adminShift,date:todayStr,createdAt:new Date().toISOString()}); e.target.reset();}} className="space-y-2"><input required name="et" placeholder="البند" className="w-full bg-neutral-950 p-2 rounded-xl text-white" /><input required type="number" min={1} name="ea" placeholder="المبلغ" className="w-full bg-neutral-950 p-2 rounded-xl text-white font-mono text-center" /><button className="w-full py-2 bg-rose-600 text-white font-black rounded-xl">+ خصم</button></form><div className="max-h-32 overflow-y-auto space-y-1">{curExp.map(ex=><div key={ex.id} className="p-2 bg-neutral-950 rounded-xl flex justify-between"><span>{ex.title} ({ex.amount}ج)</span><button onClick={()=>db.collection('expenses').doc(ex.id).delete()} className="text-rose-400">✕</button></div>)}</div></div></div>}
          {showDebt && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"><div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-5 max-w-sm w-full space-y-3"><div className="flex justify-between"><h3 className="font-bold text-white">📝 الشكك ({totUnpaidDebts}ج)</h3><button onClick={()=>setShowDebt(false)}>✕</button></div><form onSubmit={e=>{e.preventDefault(); const id=`dbt-${Date.now()}`; db.collection('debts').doc(id).set({id,customerName:e.target.dn.value.trim(),amount:Number(e.target.da.value),note:e.target.dnt.value.trim(),paid:false,shiftId:adminShift,date:todayStr,createdAt:new Date().toISOString()}); e.target.reset();}} className="space-y-2"><input required name="dn" placeholder="العميل" className="w-full bg-neutral-950 p-2 rounded-xl text-white" /><input required type="number" min={1} name="da" placeholder="المبلغ" className="w-full bg-neutral-950 p-2 rounded-xl text-white font-mono text-center" /><input name="dnt" placeholder="ملاحظة" className="w-full bg-neutral-950 p-2 rounded-xl text-white" /><button className="w-full py-2 bg-amber-500 text-black font-black rounded-xl">+ تسجيل</button></form><div className="max-h-32 overflow-y-auto space-y-1">{curDebts.filter(d=>!d.paid).map(d=><div key={d.id} className="p-2 bg-neutral-950 rounded-xl flex justify-between"><span>{d.customerName} ({d.amount}ج)</span><button onClick={()=>db.collection('debts').doc(d.id).update({paid:true})} className="px-2 bg-emerald-500 text-black rounded font-bold">سداد ✓</button></div>)}</div></div></div>}
          {showReport && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"><div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full space-y-3 text-center"><div className="flex justify-between"><h3 className="font-bold text-white">📊 تقرير الوردية ({adminShift})</h3><button onClick={()=>setShowReport(false)}>✕</button></div><div className="p-3 bg-neutral-950 rounded-2xl text-right space-y-1"><div>💵 كاش الصالة: <strong className="text-emerald-400">{inStoreRev}ج</strong></div><div>🌐 الأونلاين: <strong className="text-blue-400">{onlineRev}ج</strong></div><div>📉 المصاريف: <strong className="text-rose-400">-{totExp}ج</strong></div><div className="border-t border-neutral-800 pt-1 text-amber-400 font-bold">صافي الدرج: {netCash}ج</div></div><a href={`https://wa.me/${config.whatsappNumber}?text=${encodeURIComponent(`📊 تقرير ${config.loungeName} (${adminShift} - ${todayStr}):\n• كاش: ${inStoreRev}ج\n• أونلاين: ${onlineRev}ج\n• مصاريف: ${totExp}ج\n• صافي الدرج: ${netCash}ج`)}`} target="_blank" className="w-full py-2.5 bg-emerald-600 text-white font-black rounded-xl block">📲 إرسال للواتساب</a></div></div>}
          {receipt && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"><div className="bg-white text-black rounded-3xl p-6 max-w-xs w-full space-y-3"><div id="printable-receipt" className="space-y-2 text-center border-b pb-3"><h2 className="font-black text-lg">{config.loungeName}</h2><p className="text-[10px]">بون حساب — {config.phone}</p><div className="text-[11px] text-right space-y-1 pt-2 border-t border-dashed"><div>الجهاز: <strong>{receipt.devName}</strong></div><div>العميل: <strong>{receipt.customerName}</strong></div><div>المدة: <strong>{receipt.durationMins}د</strong></div>{receipt.controllersCheck&&<div>الدراعات: <strong>{receipt.controllersCheck}</strong></div>}</div><div className="text-base font-black pt-2 border-t border-dashed flex justify-between"><span>الإجمالي:</span><span>{receipt.totalCost} ج.م</span></div></div><div className="flex gap-2"><button onClick={()=>window.print()} className="flex-1 py-2 bg-black text-white font-bold rounded-xl">🖨️ طباعة</button><button onClick={()=>setReceipt(null)} className="flex-1 py-2 bg-neutral-200 font-bold rounded-xl">إغلاق</button></div></div></div>}
          {showAIChat && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4">
              <div className="bg-neutral-900 border border-amber-500/50 rounded-3xl p-5 max-w-md w-full space-y-3 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-2"><span className="text-amber-400 font-black">🤖 شات المساعد التنفيذي للمدير</span><button onClick={() => setShowAIChat(false)} className="text-neutral-400 font-bold">✕</button></div>
                <div className="h-64 overflow-y-auto space-y-2 p-2 bg-neutral-950 rounded-2xl border border-neutral-800 no-scrollbar">{aiChatLog.map((c, i) => <div key={i} className={`p-2.5 rounded-xl text-[11px] whitespace-pre-line ${c.sender === 'ai' ? 'bg-neutral-900 text-neutral-200 border border-neutral-800' : 'bg-amber-500 text-black font-bold mr-auto'}`}>{c.text}</div>)}{aiLoading && <div className="p-2 rounded-xl text-[11px] bg-neutral-900 text-amber-400 animate-pulse">⏳ جاري التحليل والتنفيذ...</div>}</div>
                <form onSubmit={async e => {
                  e.preventDefault(); const q = aiQuery.trim(); if (!q || aiLoading) return;
                  if (!adminSecret) return alert('أدخل ADMIN_AI_SECRET أولاً في الشريط الأصفر أعلى اللوحة!');
                  const hist = aiChatLog.slice(-6); setAiChatLog(p => [...p, { sender: 'user', text: q }]); setAiQuery(''); setAiLoading(true);
                  try {
                    const res = await fetch(`${AI_WORKER_URL}/admin-chat`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ adminSecret, message: q, history: hist, loungeContext: buildFullLoungeContext() }) });
                    const d = await res.json();
                    if (Array.isArray(d?.actions) && d.actions.length > 0) await executeAIActions(d.actions, 'شات AI المدير');
                    setAiChatLog(p => [...p, { sender: 'ai', text: d?.reply || 'تم تنفيذ الطلب.' }]);
                  } catch { setAiChatLog(p => [...p, { sender: 'ai', text: `⚠️ تعذر الاتصال بالسحابة. ملخص سريع: كاش ${inStoreRev}ج | أونلاين ${onlineRev}ج | صافي ${netCash}ج.` }]); }
                  finally { setAiLoading(false); }
                }} className="flex gap-2"><input value={aiQuery} onChange={e => setAiQuery(e.target.value)} placeholder="اسأل عن يوم، عميل، أو اطلب أي تعديل..." className="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-white text-[11px]" /><button disabled={aiLoading} className="px-4 py-2 bg-amber-500 text-black font-black rounded-xl">إرسال</button></form>
              </div>
            </div>
          )}
          {viewDoc && <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4"><div className="bg-neutral-900 border border-neutral-700 rounded-3xl p-5 max-w-md w-full space-y-3 text-center"><div className="flex justify-between"><h3 className="font-bold text-white">معاينة</h3><button onClick={()=>setViewDoc(null)}>✕</button></div><img src={viewDoc} className="max-h-[65vh] mx-auto rounded-xl object-contain" /><button onClick={()=>setViewDoc(null)} className="w-full py-2 bg-neutral-800 text-white rounded-xl font-bold">إغلاق</button></div></div>}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<AppErrorBoundary><App /></AppErrorBoundary>);
  </script>
</body>
</html>
