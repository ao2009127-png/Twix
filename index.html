        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3"><input required value={partyReason} onChange={e => setPartyReason(e.target.value)} placeholder={L('سبب الحفلة', 'Occasion', lang)} className="sm:col-span-2 bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white" /><div><input type="number" min={1} max={maxGuests} value={attendeesCount} onChange={e => setAttendeesCount(Number(e.target.value))} className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-white font-mono text-center" /><span className="text-[9px] text-neutral-400 block text-center mt-0.5">{L('الحد الأقصى: ', 'Max: ', lang)}{maxGuests}</span></div></div>
        <div className="p-3.5 bg-neutral-950 rounded-2xl border border-neutral-800 flex justify-between text-sm"><span className="font-bold text-white">{L('الإجمالي الكامل (', 'Full Total (', lang)}{activeDevs.length}×{partyDurationHours}h + {partyTax}):</span><strong className="font-mono text-amber-400 font-black">{total} {L('ج.م', 'EGP', lang)}</strong></div>
        <button disabled={busy} type="submit" className="w-full py-3 bg-gradient-to-r from-pink-600 to-amber-500 text-black font-black rounded-2xl">{busy ? '⏳...' : (L('دفع الحفلة كامل (', 'Pay Full Party (', lang) + total + L(' ج.م) ➔', ' EGP) →', lang))}</button>
      </form>
    </div>
  );
}
function PredictionsPage({ matches, currentCustomer, config, lang }) {
  const [userPreds, setUserPreds] = useState({}); const { showAlert, toast } = useTwixUI(); const prizeAmt = Number(config.rewardsConfig?.prediction ?? 35);

    if (!currentCustomer) return showAlert(L('سجل دخولك أولاً لحفظ توقعك!', 'Sign in first to save your prediction!', lang));
    if (m.status !== 'open' || (m.closeAtMs && Date.now() >= m.closeAtMs)) return showAlert(L('تم إغلاق التوقعات لهذه المباراة!', 'Predictions closed!', lang));
    const myPred = m.predictions?.[currentCustomer.phone], scoreA = Number(userPreds[m.id + "_a"] ?? myPred?.scoreA ?? 0), scoreB = Number(userPreds[m.id + "_b"] ?? myPred?.scoreB ?? 0);
    db.collection('matches').doc(m.id).set({ predictions: { [currentCustomer.phone]: { scoreA, scoreB, customerName: currentCustomer.name } } }, { merge: true }).then(() => { playNotificationSound('cash'); toast(L("تم تسجيل توقعك: ", "Saved: ", lang) + tA + " " + scoreA + " - " + scoreB + " " + tB); });
  };
  return (
    <div className="max-w-3xl mx-auto py-6 space-y-6 text-xs">
      <div className="text-center space-y-1"><span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full font-black">{L('مسابقة TWIX — بموافقة المدير', 'TWIX Contest — Admin Approved', lang)}</span><h1 className="text-2xl font-black text-white">⚽ {L('توقع نتيجة الماتش واربح ', 'Predict Match Score & Win ', lang)}{prizeAmt} {L('ج.م', 'EGP', lang)}</h1></div>
      {matches.length === 0 ? <p className="text-neutral-500 py-10 text-center bg-neutral-900 border border-neutral-800 rounded-3xl">{L('لا توجد مباريات للتوقع حالياً.', 'No matches open right now.', lang)}</p> : matches.map(m => {
        const myPred = currentCustomer && m.predictions?.[currentCustomer.phone], isLocked = m.status !== 'open' || (m.closeAtMs && Date.now() >= m.closeAtMs);
        const valA = userPreds[m.id + "_a"] ?? myPred?.scoreA ?? 0, valB = userPreds[m.id + "_b"] ?? myPred?.scoreB ?? 0;
        return (<div key={m.id} className="bg-neutral-900 border border-neutral-800 p-5 rounded-3xl space-y-4"><div className="flex justify-between items-center border-b border-neutral-800 pb-2"><span className="text-amber-400 font-bold font-mono">📅 {m.time}</span><span className={"px-2.5 py-0.5 rounded text-[10px] font-black " + (!isLocked ? 'bg-emerald-500/20 text-emerald-400' : 'bg-neutral-800 text-neutral-400')}>{!isLocked ? L('🟢 مفتوح', '🟢 Open', lang) : (m.status === 'open' ? L('🔒 مغلق', '🔒 Closed', lang) : (L('انتهى ', 'Ended ', lang) + m.scoreA + "-" + m.scoreB))}</span></div><div className="flex items-center justify-around text-center"><div className="space-y-2 flex-1"><strong className="text-white text-base block">{m.teamA}</strong>{!isLocked ? <input type="number" min={0} max={20} value={valA} onChange={e => setUserPreds({ ...userPreds, [m.id + "_a"]: e.target.value })} className="w-14 bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-center text-amber-400 font-black mx-auto" /> : <span className="font-mono text-2xl font-black">{m.scoreA}</span>}</div><span className="text-neutral-500 font-black text-xl">VS</span><div className="space-y-2 flex-1"><strong className="text-white text-base block">{m.teamB}</strong>{!isLocked ? <input type="number" min={0} max={20} value={valB} onChange={e => setUserPreds({ ...userPreds, [m.id + "_b"]: e.target.value })} className="w-14 bg-neutral-950 border border-neutral-800 rounded-xl p-2 text-center text-amber-400 font-black mx-auto" /> : <span className="font-mono text-2xl font-black">{m.scoreB}</span>}</div></div>{!isLocked ? <div className="space-y-2 text-center">{myPred && <span className="text-emerald-400 font-bold block">✓ {L('توقعك:', 'Your pick:', lang)} [{myPred.scoreA} - {myPred.scoreB}]</span>}<button type="button" onClick={() => handleSave(m, m.teamA, m.teamB)} className="w-full py-2.5 bg-emerald-500 text-black font-black rounded-xl">{myPred ? L('تحديث التوقع', 'Update Prediction', lang) : L('تسجيل التوقع ⚽', 'Submit Prediction ⚽', lang)}</button></div> : <div className="p-3 bg-neutral-950 rounded-2xl text-center border border-neutral-800">{m.status === 'open' ? L('التوقعات مقفولة.', 'Predictions locked.', lang) : <><strong>{m.teamA} ({m.scoreA}) - ({m.scoreB}) {m.teamB}</strong></>}</div>}</div>);
      })}
    </div>
  );
    }
